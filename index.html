{
  id: "j18-the-son-and-the-stone",
  title: "The Son and The Stone",
  summary: "The parable of the tenants in the vineyard (Matthew 21, Mark 12, Luke 20) is packed with hints to Isaiah 5, Genesis 22 and Psalm 118. At its centre is a shocking act: the owner sends his beloved son. And it ends with a Hebrew pun linking ‘son’ (ben) and ‘stone’ (even).",
  sections: [
    {
      h: "A Hebrew joke to start with",
      blocks: [
        { t: "p", text: "Let’s begin with a joke — though you really had to be there, and be Jewish, or at least know some Hebrew. John the Baptist was speaking to Pharisees and Sadducees near the Jordan River in the Judean desert. He warned them not to rely on saying, ‘We have Abraham as our father.’ Then he added:" },
        { t: "quote", text: "I tell you that out of these stones God can raise up children for Abraham.", ref: "Matthew 3:9" },
        { t: "p", text: "In Hebrew this is a pun. ‘Stones’ is **avanim** (often written *ebanim*) and ‘children’ is **banim**. The two words sound almost the same. John was making a serious point with a play on words: being a physical child of Abraham is no guarantee of anything. God could turn the very stones into ‘children’." },
        { t: "term", word: "banim / avanim", heb: "בָּנִים / אֲבָנִים", lang: "Hebrew", meaning: "‘Children (sons)’ and ‘stones’. The words sound alike, so Hebrew speakers could make puns with them. The singular forms are ben (son) and even (stone)." },
        { t: "callout", kind: "note", title: "Store this away", text: "Keep this son/stone wordplay in mind. Jesus will use the very same pun, in the singular, at the end of the parable of the tenants." }
      ]
    },
    {
      h: "A vineyard everyone recognised (Isaiah 5)",
      blocks: [
        { t: "p", text: "The parable of the tenants appears in Matthew 21:33-46, Mark 12:1-12 and Luke 20:9-19. Vineyards often appeared in rabbinic parables, usually as a picture of **Israel**. An **absentee landlord** was also familiar. Historical papers show such business deals — including failed attempts to collect what was owed and collectors being thrown out of town. Jesus’ story would feel true to life, but something far more dramatic was coming." },
        { t: "p", text: "Jesus opens with a big hint — a **remez** — to the prophets. The words *vineyard*, *winepress* and *watchtower* instantly point to **Isaiah 5:1-7**, ‘The Song of the Vineyard’." },
        { t: "term", word: "Remez", heb: "רֶמֶז", lang: "Hebrew", meaning: "A ‘hint’. A rabbi quotes a few words of Scripture, expecting hearers to recall the whole passage and its context." },
        { t: "steps", title: "How a Judean vineyard was built (Isaiah 5)", items: [
          { h: "Clear the stones", d: "Judean hillsides are fertile but full of rocks. These were cleared first." },
          { h: "Build a wall or terraces", d: "The cleared stones marked the plot or formed terraces." },
          { h: "Add a hedge of thorns", d: "Thistles and thorns on top of the wall kept out small animals." },
          { h: "Build a watchtower", d: "More stones made a tower, lived in during harvest time." },
          { h: "Dig a winepress", d: "Cut nearby, ready for the grapes." },
          { h: "Wait for a crop", d: "Then the owner could sit back and expect good fruit." }
        ]},
        { t: "p", text: "Few of Jesus’ listeners owned land like this, so he adds **tenants** to draw them into the story. A wealthy owner might live far away. At harvest a share of the fruit was due to him, and he sent servants to collect it. In that culture, servants carried their master’s identity and authority. To mistreat them was to abuse the owner himself." }
      ]
    },
    {
      h: "Judgement, stage by stage",
      blocks: [
        { t: "p", text: "In Jesus’ story the servants are beaten and killed again and again. Last of all the owner sends his son, who is murdered too. Jesus then asks his audience: *What will the owner do now?* This question pulls them back into Isaiah 5, where God asks:" },
        { t: "quote", text: "What more could have been done for my vineyard than I have done for it? … Now I will tell you what I am going to do to my vineyard.", ref: "Isaiah 5:4-5" },
        { t: "flow", title: "God dismantles the vineyard in reverse order (Isaiah 5:5-6)", nodes: [
          { h: "Hedge removed", d: "The thorns and thistles go" },
          { h: "Wall broken down", d: "The vineyard is trampled" },
          { h: "No rain", d: "The clouds are commanded not to rain" },
          { h: "Wasteland", d: "Judgement complete" }
        ]},
        { t: "p", text: "God had been patient for a long time, but finally had to act. Jesus’ parable has the same feel. The tenants never change their hearts, so it must end in judgement. In Matthew, the listeners answer without hesitation: the owner ‘will bring those wretches to a wretched end’ and rent the vineyard to others who will give him his fruit (Matthew 21:41). Notice the typically Hebraic doubling: *wretches* … *wretched end*." },
        { t: "quote", text: "Therefore I tell you that the kingdom of God will be taken away from you and given to a people who will produce its fruit.", ref: "Matthew 21:43" },
        { t: "compare", title: "Who is ‘you’ and who is ‘a people’?", cols: [
          { h: "A common misreading", items: ["‘You’ = the Jewish people as a whole", "‘A people’ = the Gentiles instead of the Jews", "God swaps one nation for another"] },
          { h: "What the context shows", items: ["Jesus is in the Temple courts, questioned by the **chief priests and elders** about his authority (Matthew 21:23)", "‘You’ = these religious leaders — and ‘they knew he was talking about them’ (Matthew 21:45)", "‘A people’ = anyone, Jew or Gentile, who receives the kingdom and bears fruit", "Tax collectors and prostitutes were already entering ahead of the leaders, because they believed John (Matthew 21:31-32)"] }
        ]}
      ]
    },
    {
      h: "The shock in the middle: ‘He sent his son’",
      blocks: [
        { t: "p", text: "We expect a story to build to its climax at the end. But Hebraic thinking is often **symmetric around a central pivot** — a *chiasm*, which places the main focus in the middle. Here, besides the expected ending, there is a huge shock halfway through:" },
        { t: "quote", text: "Last of all, he sent his son to them.", ref: "Matthew 21:37" },
        { t: "p", text: "What is the owner thinking? He knows what happened to his servants. How could he be so reckless with his son’s life? Yet he goes ahead. This is where the bombshell drops. The tenants also act foolishly — did they really think killing the heir would let them inherit the vineyard, when the owner could come and destroy them?" },
        { t: "callout", kind: "insight", title: "Why parables exaggerate", text: "Parables often show characters behaving in excessive, foolhardy ways. The point is to raise the tension and make hearers react strongly. When the owner runs out of servants and sends his son, the story reaches its dramatic climax." },
        { t: "p", text: "Mark and Luke add a moving detail: the owner says he will send his son **‘whom I love’** (Luke 20:13; Mark 12:6, ‘whom he loved’). This is another remez." },
        { t: "timeline", title: "The ‘son whom I love’ echoes", items: [
          { when: "Genesis 22:2", h: "Abraham and Isaac", d: "‘Take your son, your only son, whom you love…’ Everyone knew this story. Isaac was spared at the last moment." },
          { when: "Matthew 3:17", h: "Jesus’ baptism", d: "A voice from heaven: ‘This is my Son, whom I love.’ Fewer people heard this." },
          { when: "Matthew 17:5", h: "The transfiguration", d: "Only three disciples heard the same words again." },
          { when: "The parable", h: "The owner’s son", d: "The link suggests that, unlike Isaac, this Son will not be spared. His death will be planned and brutal." }
        ]}
      ]
    },
    {
      h: "From son (ben) to stone (even)",
      blocks: [
        { t: "p", text: "Now John’s joke returns. John played on *stones* and *children* in the plural. Jesus repeats the pun in the singular. He has spoken of the **son** (*ben*). Now he ends with the **stone** (*even*) by quoting Psalm 118:" },
        { t: "quote", text: "The stone the builders rejected has become the cornerstone; the Lord has done this, and it is marvellous in our eyes.", ref: "Psalm 118:22-23 (Matthew 21:42)" },
        { t: "term", word: "ben / even", heb: "בֵּן / אֶבֶן", lang: "Hebrew", meaning: "‘Son’ and ‘stone’. Jesus moves from the son in the parable to the stone of Psalm 118 — a pun that links the two." },
        { t: "p", text: "Jesus is not showing off. He chose this Psalm because of the shared theme of **rejection**. Both son and stone are rejected — but in neither case is that the end of the story." },
        { t: "compare", title: "Son and stone", cols: [
          { h: "The son (ben)", items: ["Rejected and killed by the tenants", "Killing him did not give them what they hoped", "It led to something worse — their own downfall"] },
          { h: "The stone (even)", items: ["Rejected by the builders", "Became even more important — capstone or cornerstone", "‘The Lord has done this’ — God’s plan cannot be stopped"] }
        ]},
        { t: "callout", kind: "insight", title: "The point for the leaders", text: "Getting rid of Jesus would not solve the religious leaders’ problems. Their troubles would grow until their own downfall. Meanwhile the son-stone would rise higher and grow greater." },
        { t: "cards", title: "More possible hints", items: [
          { h: "Daniel 2", d: "In Nebuchadnezzar’s dream a rock smashes a mighty statue, then grows into a huge mountain." },
          { h: "1 Samuel 16:1-13", d: "Later rabbis read Psalm 118:22-23 as a comment on David’s anointing. Jesse presented seven sons; the youngest, David, was out with the sheep. The rejected son became Israel’s greatest king." },
          { h: "Rock 2, Pot 0", d: "‘Everyone who falls on that stone will be broken… anyone on whom it falls will be crushed’ (Luke 20:18; Matthew 21:44). A Jewish saying ran: if a pot falls on a rock, woe to the pot; if a rock falls on a pot, woe to the pot!" }
        ]}
      ]
    },
    {
      h: "Review",
      blocks: [
        { t: "flip", title: "Flashcards", items: [
          { front: "What pun did John the Baptist make in Matthew 3:9?", back: "‘Stones’ (avanim/ebanim) and ‘children’ (banim) — God can raise up children from stones." },
          { front: "Which Old Testament passage does the vineyard parable hint at?", back: "Isaiah 5:1-7, the Song of the Vineyard (vineyard, winepress, watchtower)." },
          { front: "Who will the kingdom be ‘taken away from’ in Matthew 21:43?", back: "The religious leaders (chief priests and elders), not the Jewish people as a whole." },
          { front: "What is the central shock of the parable?", back: "‘Last of all, he sent his son’ — the focus sits in the middle, in chiastic style." },
          { front: "What does ‘whom I love’ echo?", back: "Genesis 22:2 (Isaac), and the voice at Jesus’ baptism and transfiguration." },
          { front: "What links ben and even?", back: "Son (ben) and stone (even) sound alike; both are rejected yet vindicated by God (Psalm 118:22-23)." }
        ]}
      ]
    }
  ],
  keypoints: [
    "John’s saying in Matthew 3:9 is a Hebrew pun: stones (avanim) and children (banim).",
    "The parable of the tenants opens with a remez to Isaiah 5, the Song of the Vineyard.",
    "In Isaiah 5 God dismantles the vineyard step by step — judgement after long patience.",
    "‘The kingdom will be taken from you’ is aimed at the religious leaders; ‘a people’ means all who bear fruit, Jew and Gentile.",
    "In chiastic style the shock is in the middle: the owner sends his beloved son.",
    "‘Whom I love’ echoes Isaac (Genesis 22:2) and the voice at Jesus’ baptism — but this Son will not be spared.",
    "Jesus moves from son (ben) to stone (even), quoting Psalm 118: the rejected one is vindicated by God.",
    "Falling on the stone, or the stone falling on you — either way the pot loses."
  ],
  quiz: [
    { q: "Which two Hebrew words make John the Baptist’s pun in Matthew 3:9?", options: ["Shalom and shamayim", "Avanim (stones) and banim (children)", "Torah and tovel", "Melech and malakh"], answer: 1, why: "Avanim (stones) and banim (children) sound alike, so John could say God can raise children from stones." },
    { q: "In Matthew 21:43, who is the kingdom taken away from?", options: ["The religious leaders who opposed Jesus", "All Jewish people for ever", "The Roman authorities", "The disciples"], answer: 0, why: "The context is the chief priests and elders questioning Jesus’ authority, and they knew the parable was about them (Matthew 21:45)." },
    { q: "Where does the main focus of the parable sit, according to Hebraic chiastic style?", options: ["In the first line", "In the very last line only", "In the middle — the owner sending his son", "In the description of the winepress"], answer: 2, why: "A chiasm places the focus at the central pivot: ‘Last of all, he sent his son.’" },
    { q: "Why did Jesus quote Psalm 118:22-23 after the parable?", options: ["To show off his wit", "To talk about building the Temple", "To predict the fall of Rome", "Because son and stone share the theme of rejection followed by God’s vindication"], answer: 3, why: "The son (ben) and the stone (even) are both rejected, but God turns rejection into exaltation." },
    { q: "What does the saying about the stone and the pot (Luke 20:18) teach?", options: ["Whichever way they meet, the pot is broken", "Pots are stronger than stones", "Only those who fall are hurt", "Stones should be avoided"], answer: 0, why: "A Jewish saying: if a pot falls on a rock or a rock falls on a pot — woe to the pot. Rock 2, Pot 0." }
  ]
},
{
  id: "j19-give-us-a-clue",
  title: "Give Us A Clue",
  summary: "Jesus and his Father often dropped hints (remez) to the Old Testament. This chapter follows six clues: the tribute coin, the vultures, the finger of God, living water, Jacob’s ladder and the voice from heaven.",
  sections: [
    {
      h: "Paying tribute to Caesar (Matthew 22:15-22)",
      blocks: [
        { t: "p", text: "The question about paying taxes to Caesar (Matthew 22:15-22; Mark 12:13-17; Luke 20:20-26) came during Jesus’ **last week**. So much happened between the triumphal entry and his arrest that a large part of each gospel focuses on those few days. It is a worthwhile exercise to list every event and teaching of that week." },
        { t: "p", text: "Here was another attempt to ‘catch him in his words’ (Mark 12:13). The trap was set by an odd pair: some **Pharisees** together with the **Herodians**. The Herodians supported Herod’s dynasty and the political set-up (rather like the Sadducees). The two groups were opposites, but united in opposing Jesus." },
        { t: "p", text: "The issue was not really ‘tax’ as we know it. It was about offering **tribute** to Caesar with a special coin. Luke uses the Greek word *phoros*, and Matthew and Mark use *kēnson* (from *kēnsos*). Both suggest a poll tax on persons or property, but the core meaning of *kēnsos* is **tribute money**. The old Authorised Version gets it right: ‘Is it lawful to give tribute unto Caesar?’ and ‘Shew me the tribute money’ (Matthew 22:17, 19). Luke has ‘Show me a denarius’ (Luke 20:24)." },
        { t: "term", word: "kēnsos / phoros", heb: "κῆνσος / φόρος", lang: "Greek", meaning: "Words for a tax or tribute on persons or property. Kēnsos (from Latin census) mainly means ‘tribute money’ — the coin used to honour Caesar." },
        { t: "callout", kind: "note", title: "What the coin was for", text: "The tribute coin could be exchanged at certain places — apparently three temples Herod had built — for a pinch of incense. You then offered the incense to show devotion to Caesar. So the question touched on worship, not just money." },
        { t: "table", title: "Who thought what about the tribute coin?", head: ["Group", "Attitude"], rows: [
          ["Herodians", "Quite happy to do it"],
          ["Sadducees", "Went along with it"],
          ["Pharisees", "Split: some called it idolatry; others thought it acceptable as ‘how the world is’"],
          ["Zealots and Essenes", "Fiercely against it"]
        ]},
        { t: "p", text: "The Pharisees who joined the Herodians probably opposed the practice — so Jesus faced two opposing views. Whatever he said, he would upset someone. Then Jesus asked them to **show him a coin**. Roman coins were not allowed on the Temple Mount, so one had to be fetched. Was this a delaying tactic? Or a way to expose the split among his accusers — which of you can produce one? Probably the Herodians had one handy while the Pharisees looked on in disapproval." }
      ]
    },
    {
      h: "Whose image is on you?",
      blocks: [
        { t: "p", text: "A denarius was found. Jesus asked to ‘look at it’ (Mark 12:15), but there is no sign he touched it. Everyone knew what it showed: **Caesar’s image**, with words declaring his divinity — something like ‘Caesar Augustus the divine, father of the country’." },
        { t: "p", text: "Here is the remez. Some versions say ‘portrait’, but ‘image’ or ‘likeness’ points to Scripture. Is it the command against graven images (Exodus 20:4; Deuteronomy 5:8)? Or ‘Cursed is anyone who makes an idol’ (Deuteronomy 27:15)? The real echo goes back to the very beginning:" },
        { t: "quote", text: "Let us make mankind in our image, in our likeness.", ref: "Genesis 1:26-27" },
        { t: "compare", title: "Two images", cols: [
          { h: "Caesar’s image", items: ["Stamped on a piece of metal", "Claims divinity for a man", "Give the coin back to Caesar if you like"] },
          { h: "God’s image", items: ["Stamped on **you**", "Far more valuable", "Give **yourself** back to God — your worship belongs to him"] }
        ]},
        { t: "callout", kind: "insight", title: "‘Give back’", text: "‘Render’ is better translated ‘give back’. Jesus turned the trap into a challenge: Whose image and inscription is on you? Will you give yourself back to God? This silenced his accusers. What to do with the coin may be left deliberately unclear — but even if you give Caesar his coin, do not give him your worship." }
      ]
    },
    {
      h: "Where the vultures gather (Matthew 24:28)",
      blocks: [
        { t: "p", text: "In the middle of his teaching on the Mount of Olives about the end of the age, Jesus says: ‘Wherever there is a carcass, there the vultures will gather’ (Matthew 24:28). It sounds like a proverb, but it is a remez to **Job 39:27-30**, which ends: ‘where the slain are, there it is’ (verse 30)." },
        { t: "term", word: "Nesher", heb: "נֶשֶׁר", lang: "Hebrew", meaning: "Often translated ‘eagle’, but it means any large bird of prey, including a vulture or buzzard. With amazing eyesight it spots its meal from a great height." },
        { t: "p", text: "Job uses the present tense and Jesus the future, but there is no real difference. A proverb is stated in the present (‘a stitch in time saves nine’) yet speaks about the future." },
        { t: "compare", title: "Matthew and Luke compared", cols: [
          { h: "Matthew 24:28", items: ["‘Carcass’", "Part of an uninterrupted talk", "Follows warnings about people saying ‘He’s over there!’ (24:26)"] },
          { h: "Luke 17:37", items: ["‘Dead body’", "An answer to the disciples’ question: ‘Where, Lord?’", "Follows talk of people being taken in judgement when the Son of Man is revealed (17:30-35)"] }
        ]},
        { t: "p", text: "In both places the question is ‘where?’ — Where will people be taken? Where will Jesus appear? Jesus answers with Job, and the meaning is: **‘Don’t ask!’** You do not need to know. When the moment comes, everything will happen instinctively, as surely as vultures find a carcass. You will find me — in fact, I will find you." },
        { t: "callout", kind: "insight", title: "Remember the vultures", text: "Jesus was answering both worry and too much curiosity. When we want to speculate about the how, where and when of his return, we should remember the vultures. What he has said is enough." }
      ]
    },
    {
      h: "The finger of God (Luke 11:20)",
      blocks: [
        { t: "p", text: "Jesus says he drives out demons ‘by the finger of God’ (Luke 11:20). Matthew has ‘by the Spirit of God’ (Matthew 12:28). So the **finger** is a picture (an anthropomorphism) for the **Spirit**. But there is a remez too." },
        { t: "p", text: "We might think of the Ten Commandments, written ‘by the finger of God’ (Exodus 31:18; Deuteronomy 9:10). But this passage is not about the Law. (By the way, when a woman caught in adultery was brought to Jesus — a legal matter — he wrote on the ground with his finger, John 8:2-8. That may well be a silent remez back to the giving of the Law.)" },
        { t: "quote", text: "The magicians said to Pharaoh, ‘This is the finger of God.’", ref: "Exodus 8:19" },
        { t: "steps", title: "From Egypt to Galilee", items: [
          { h: "Egypt", d: "At first Pharaoh’s magicians copied Moses’ and Aaron’s miracles. Then they failed and confessed: ‘This is the finger of God.’ Moses had no magic of his own — this was God at work." },
          { h: "Galilee", d: "Jesus healed a man who was mute (and in Matthew also blind, Matthew 12:22) through a demon — something no one had done before." },
          { h: "The right response", d: "This should have led people to welcome Jesus as Messiah and herald of the kingdom." },
          { h: "The actual response", d: "Like Pharaoh, hearts were hardened. Would the outcome for the leaders be the same?" }
        ]}
      ]
    },
    {
      h: "Living water, a ladder and the Father’s hints",
      blocks: [
        { t: "p", text: "In **John 7:38** Jesus promises ‘rivers of living water’ flowing from those who believe. John explains this means the Spirit (John 7:39). Jesus cried this out on the last day of the **Feast of Tabernacles**, when water was drawn from the pool of Siloam and poured on the altar. There is also a hint to Jeremiah:" },
        { t: "quote", text: "My people have committed two sins: They have forsaken me, the spring of living water, and have dug their own cisterns, broken cisterns that cannot hold water.", ref: "Jeremiah 2:13" },
        { t: "compare", title: "Two kinds of water", cols: [
          { h: "Living water (a spring)", items: ["Flowing", "A living relationship with God", "Spreads life to others"] },
          { h: "Cistern water", items: ["Still, can turn stale", "Living by man-made rules and regulations", "May sustain a few for a while, but stagnates"] }
        ]},
        { t: "callout", kind: "insight", title: "Biblical prosperity", text: "Psalm 1:3 says a tree planted by streams of water bears fruit and prospers. In Hebraic thinking, to ‘prosper’ means to bring goodness and well-being to others — not to get more for yourself. The Spirit’s living water flowing from us blesses everyone we meet." },
        { t: "p", text: "**A ladder to heaven (John 1:51).** Jesus told Nathanael, resting under a fig tree, that he would see heaven open and angels ascending and descending on the Son of Man. This points to Jacob’s dream of a ladder (Genesis 28:12). It is not a Messianic prophecy, but Jesus used it to hint that **he is the ladder** — the link between heaven and earth, God and man. Nathanael became a disciple on the spot." },
        { t: "table", title: "The Father gave hints too", head: ["Words from heaven", "Scripture hinted at"], rows: [
          ["‘You are my Son’ (baptism, Mark 1:11)", "Psalm 2:7"],
          ["‘whom I love’", "Genesis 22:2"],
          ["‘with you I am well pleased’", "Isaiah 42:1"],
          ["‘Listen to him!’ (transfiguration, Mark 9:7)", "Deuteronomy 18:15 — a prophet like Moses"]
        ]},
        { t: "p", text: "At the transfiguration the first two parts repeat, but the third now points to God’s promise to raise up a prophet like Moses: *You must listen to him!* Listening to the Jewish Jesus is exactly what this study is about." }
      ]
    },
    {
      h: "Review",
      blocks: [
        { t: "tree", title: "Six clues in this chapter", root: "Give Us A Clue", children: [
          { h: "Tribute coin", d: "Image → Genesis 1:26-27" },
          { h: "Vultures", d: "Job 39:27-30 → ‘Don’t ask’" },
          { h: "Finger of God", d: "Exodus 8:19" },
          { h: "Living water", d: "Jeremiah 2:13; Psalm 1:3" },
          { h: "Ladder", d: "Genesis 28:12" },
          { h: "Voice from heaven", d: "Psalm 2:7; Genesis 22:2; Isaiah 42:1; Deuteronomy 18:15" }
        ]},
        { t: "flip", title: "Flashcards", items: [
          { front: "What was the tribute coin used for?", back: "To buy a pinch of incense to offer to Caesar as an act of devotion." },
          { front: "Which verse does ‘whose image’ really point to?", back: "Genesis 1:26-27 — we are made in God’s image, so give yourself back to God." },
          { front: "What does ‘where the vultures gather’ mean?", back: "From Job 39:30: ‘Don’t ask’ — when he returns, it will happen instinctively; you do not need the details." },
          { front: "Where do Pharaoh’s magicians say ‘This is the finger of God’?", back: "Exodus 8:19." },
          { front: "Living water vs cistern water?", back: "Flowing relationship with God vs stale man-made rules (Jeremiah 2:13)." },
          { front: "What does Jesus’ ladder remark to Nathanael hint at?", back: "Jacob’s ladder (Genesis 28:12): Jesus is the link between heaven and earth." }
        ]}
      ]
    }
  ],
  keypoints: [
    "The tax question was really about the tribute coin, used to buy incense to honour Caesar.",
    "Pharisees and Herodians held opposing views, so any answer would upset someone.",
    "‘Whose image?’ points to Genesis 1:26-27: give the coin to Caesar, but give yourself back to God.",
    "‘Where the vultures gather’ echoes Job 39:27-30 and means ‘don’t ask’ — his return will happen instinctively.",
    "‘The finger of God’ (Luke 11:20) echoes Exodus 8:19: real divine power, not magic; hardened hearts are warned.",
    "Living water (John 7:38) contrasts with broken cisterns (Jeremiah 2:13); biblical prosperity means blessing others.",
    "Jesus is Jacob’s ladder — the link between heaven and earth (John 1:51; Genesis 28:12).",
    "The Father’s words at the baptism and transfiguration combine Psalm 2:7, Genesis 22:2, Isaiah 42:1 and Deuteronomy 18:15."
  ],
  quiz: [
    { q: "What made the tribute coin controversial?", options: ["It was made of gold", "It was used to buy incense to show devotion to Caesar", "It paid for the Temple", "It was forged"], answer: 1, why: "The tribute coin could be exchanged for incense offered to Caesar, so some saw it as idolatry." },
    { q: "Which Scripture does Jesus’ question about the ‘image’ on the coin point back to most deeply?", options: ["Exodus 20:4", "Deuteronomy 27:15", "Psalm 23", "Genesis 1:26-27"], answer: 3, why: "The deepest echo is that humans bear God’s image, so we should give ourselves back to God." },
    { q: "In Luke 17:37, what is the vultures saying responding to?", options: ["The disciples’ question ‘Where, Lord?’", "A Pharisee’s trap", "A request for a sign", "Herod’s threat"], answer: 0, why: "In Luke the disciples ask ‘Where, Lord?’ and Jesus answers with Job’s proverb — in effect, ‘Don’t ask.’" },
    { q: "Where do the words ‘This is the finger of God’ come from?", options: ["Exodus 31:18", "Pharaoh’s magicians in Exodus 8:19", "Jeremiah 2:13", "Genesis 28:12"], answer: 1, why: "The magicians admitted Moses’ miracles were God’s work, not magic — the same is true of Jesus’ miracles." },
    { q: "In Hebraic thinking, what does it mean to ‘prosper’?", options: ["To gain wealth", "To avoid trouble", "To bring goodness and well-being to others", "To win battles"], answer: 2, why: "Like a tree by streams (Psalm 1:3), the prosperous person blesses others." }
  ]
},
{
  id: "j20-a-distressing-baptism",
  title: "A Distressing Baptism",
  summary: "Luke 12:49-50 is best read as a pair. Jesus’ ‘baptism’ is not something done to him but something he must do: one day he will immerse the earth in the fire of judgement — and the thought distresses him.",
  sections: [
    {
      h: "A puzzling, emotional saying",
      blocks: [
        { t: "p", text: "In this part of the study we look at more times when Jesus ‘opened his mouth and spoke’ as a Jew to Jews. We start with one of his most emotional sayings:" },
        { t: "quote", text: "I have a baptism to undergo, and what constraint I am under until it is completed!", ref: "Luke 12:50" },
        { t: "p", text: "Translations vary: ‘what stress I am under’, ‘how distressed I am’, ‘pressed’ or ‘pained’. Clearly there is strong emotion. But what is this baptism?" },
        { t: "list", title: "Possible meanings", items: [
          "**His water baptism?** No — it had already happened and was hardly distressing.",
          "**His suffering and death?** A common view. It fits Mark 10:38-39, where baptism is linked with drinking the cup of suffering. But it does not fit the context of Luke 12.",
          "**Something else?** We need to read verse 50 together with verse 49."
        ]}
      ]
    },
    {
      h: "Read verses 49 and 50 as a pair",
      blocks: [
        { t: "quote", text: "I have come to bring fire on the earth, and how I wish it were already kindled!", ref: "Luke 12:49" },
        { t: "p", text: "These two verses are **parallel** — they say similar things in slightly different words, so each helps explain the other." },
        { t: "table", title: "The parallel", head: ["Verse 49", "Verse 50"], rows: [
          ["‘I have come to bring fire’", "‘I have a baptism to undertake’"],
          ["A mission statement", "A task to complete"],
          ["‘How I wish’ — yearning", "‘How distressed I am’ — distress"],
          ["‘Already kindled’ — the fire starting", "‘Until it is completed’ — the fire finished"]
        ]},
        { t: "callout", kind: "note", title: "‘I have come’", text: "As seen earlier in this study, ‘I have come’ is a Hebraic way of stating a purpose — a mission statement, not a comment on Jesus’ birth or a journey. It is followed by a verb of intent (‘to bring fire’) and can point to something still in the future." },
        { t: "p", text: "The key question: is the baptism something Jesus **does** (active) or something **done to him** (passive)? The Hebrew word behind the Greek *baptizō* is **tovel**, which can be either, depending on context. Greek and English make it passive. But because verse 49 is about something Jesus has come to *do*, the active meaning is most likely. So we should read: **‘I have a baptism to undertake’**, not ‘undergo’." },
        { t: "term", word: "Tovel", heb: "טוֹבֵל", lang: "Hebrew", meaning: "To immerse or dip. It can be active (to immerse something) or passive (to be immersed), depending on context — the Hebrew behind the Greek baptizō." },
        { t: "p", text: "If Jesus is the one who must carry out this baptism, he is not speaking about suffering he will go through — not Gethsemane (compare Mark 14:33), not the Romans, not Calvary. He has a task to finish, and will not be at ease until it is done." }
      ]
    },
    {
      h: "Spirit and fire: two different baptisms",
      blocks: [
        { t: "p", text: "John the Baptist said Jesus would baptise ‘with the Holy Spirit and fire’ (Matthew 3:11). These are **two distinct actions**. The ‘tongues of fire’ at Pentecost (Acts 2:3) are not what John meant. For John, **fire meant judgement**." },
        { t: "cards", title: "John’s two pictures of judgement (Matthew 3:10-12)", items: [
          { h: "The axe", d: "Already at the root of trees that bear no good fruit. Bad trees are ‘thrown into the fire’ (3:10)." },
          { h: "The winnowing fork", d: "Like a pitchfork with bigger blades. Grain is first threshed on the floor by a board pulled by a donkey. Then the fork tosses it up and the breeze blows the chaff away. The chaff is burned ‘with unquenchable fire’ (3:12)." }
        ]},
        { t: "steps", title: "Threshing and winnowing", items: [
          { h: "Threshing", d: "A threshing board is dragged across the wheat on the floor, starting the separation." },
          { h: "Winnowing", d: "The winnowing fork tosses it into the air." },
          { h: "Separation", d: "The breeze carries the light chaff away; the grain falls back." },
          { h: "Burning", d: "The chaff is burned — a picture of final judgement." }
        ]},
        { t: "compare", title: "Two baptisms John announced", cols: [
          { h: "Baptism in the Holy Spirit", items: ["Gift of new life", "Received by believers", "Seen at Pentecost"] },
          { h: "Baptism of fire", items: ["Judgement and destruction", "Like burning bad trees and chaff", "Will come when Jesus returns"] }
        ]},
        { t: "callout", kind: "insight", title: "Putting it together", text: "Jesus will one day baptise — immerse — the earth in fire. When he returns he will bring judgement and destruction. He does not look forward to it. It distresses him, and he longs for it to be over." },
        { t: "p", text: "‘Kindled’ suggests a fire just starting. Hebrew ‘burn’ has a wide range of meanings. In Exodus 3:2 the bush was ‘on fire’ (burning) but did not ‘burn up’ (was not consumed). In Luke 12:49 Jesus wishes the final judgement had already started; in verse 50 he speaks of the distress he feels until the earth is fully consumed." }
      ]
    },
    {
      h: "The verses that follow: division",
      blocks: [
        { t: "p", text: "Verses 51-53 also begin with ‘I have come’ (some versions say ‘I came’, but Hebrew has only one past tense, so there is no real difference). Jesus says his mission is already bringing **division**. ‘From now on’ (verse 52) families will split — some for him, some against him, and so against each other." },
        { t: "p", text: "The delay before judgement gives more people time to turn to God in repentance and faith. That delay is a sign of God’s **mercy** — and also a source of **distress** for Jesus as he watches division unfold." },
        { t: "callout", kind: "note", title: "A paraphrase of Luke 12:49-53", text: "‘My task is to set the earth on fire, and I am already doing this. The seeds of judgement are being sown even now as families divide over me. One day, on my return, there will be a final destruction, which I am not looking forward to. As part of my mission I must immerse the earth in judgement, and it fills me with distress right now as I see some rejecting me and storing up judgement for themselves.’" },
        { t: "callout", kind: "warn", title: "Do we share his feelings?", text: "We may look forward with joy to Jesus’ return. But are we as distressed as he is about those who have rejected him? Keep these verses in mind as a reminder of the full impact of his return." }
      ]
    },
    {
      h: "Review",
      blocks: [
        { t: "flip", title: "Flashcards", items: [
          { front: "Why should Luke 12:49 and 12:50 be read together?", back: "They are parallel verses; each explains the other (fire ↔ baptism)." },
          { front: "What Hebrew word lies behind ‘baptise’?", back: "Tovel — to immerse; it can be active or passive." },
          { front: "Undergo or undertake?", back: "Undertake: the baptism is something Jesus will do, not something done to him." },
          { front: "What does ‘fire’ mean in Matthew 3:11?", back: "Judgement — shown by the axe and the winnowing fork, ending in fire." },
          { front: "Why is Jesus distressed?", back: "Because his mission includes immersing the earth in judgement, and people are rejecting him." }
        ]}
      ]
    }
  ],
  keypoints: [

    "Luke 12:49 and 12:50 are parallel and explain each other.",

{
  id: "j21-whos-afraid-of-the-big-bad-fox",
  title: "Who’s Afraid of the Big Bad Fox?",
  summary: "When Jesus called Herod Antipas ‘that fox’ (Luke 13:32), he was not calling him cunning. In Jewish idiom, a fox was a lesser man compared with a lion. Herod’s family history also lies behind the parable of the ten minas (Luke 19).",
  sections: [
    {
      h: "‘Go and tell that fox’",
      blocks: [
        { t: "quote", text: "Go and tell that fox, ‘I will keep on driving out demons and healing people today and tomorrow, and on the third day I will reach my goal.’ In any case, I must press on today and tomorrow and the next day — for surely no prophet can die outside Jerusalem!", ref: "Luke 13:32-33" },
        { t: "p", text: "Some Pharisees warned Jesus to flee because Herod wanted to kill him (Luke 13:31). This shows that **not all Pharisees were hostile** to Jesus. In the next chapter Jesus even dines in the home of a prominent Pharisee (Luke 14:1)." },
        { t: "p", text: "Today ‘fox’ makes us think of someone cunning or sly, thanks to fables and proverbs. Greek, and sometimes Hebrew, could mean that too. But by Jesus’ time ‘fox’ had become a **cultural metaphor** with a wider meaning — and that is what Jesus used." }
      ]
    },
    {
      h: "Untangling Herod’s family",
      blocks: [
        { t: "p", text: "It is easy to get muddled with the Herods. Three sons of **Herod the Great** appear in the gospels." },
        { t: "tree", title: "Herod the Great’s three sons in the gospels", root: "Herod the Great (an Idumaean)", children: [
          { h: "Archelaus", d: "Mother: Malthace, a Samaritan. Ethnarch of Judea, Samaria and Idumea (Edom), 4 BC – AD 6. Deposed; exiled to Gaul, died AD 18." },
          { h: "Antipas (Antipater)", d: "Full brother of Archelaus. Tetrarch of Galilee and Perea, 4 BC – AD 39 — the ‘fox’." },
          { h: "Philip (Herod Philip II)", d: "Half-brother; mother Cleopatra of Jerusalem, Herod’s fifth wife. Tetrarch of Ituraea and Trachonitis, 4 BC – AD 34." }
        ]},
        { t: "term", word: "Ethnarch", lang: "Greek", meaning: "‘Ruler of a people’ — a leader or governor, lower in rank than a king." },
        { t: "term", word: "Tetrarch", lang: "Greek", meaning: "‘Ruler of a fourth’. Antipas ruled about a quarter of his father’s kingdom (Matthew 14:1)." },
        { t: "p", text: "Archelaus, the eldest (only eighteen), received about half the kingdom. A map of this division is a great Bible-study aid. It shows who ruled where Jesus ministered, and why he sometimes moved on — crossing the Sea of Galilee took him from Antipas’ land into Philip’s." },
        { t: "timeline", title: "Herod’s sons and Jesus", items: [
          { when: "4 BC", h: "Herod the Great dies", d: "His kingdom is divided between Archelaus, Antipas and Philip." },
          { when: "Jesus’ childhood", h: "The return from Egypt", d: "Joseph hears that the violent Archelaus rules Judea, so the family settles in Nazareth in Galilee, under Antipas, instead of Bethlehem (Matthew 2:19-23)." },
          { when: "AD 6", h: "Archelaus deposed", d: "Judea becomes a Roman province under a Roman governor (later Pontius Pilate). Archelaus had no influence on Jesus’ ministry." },
          { when: "Jesus’ ministry", h: "Antipas rules Galilee", d: "Jesus spends much time in his territory. Antipas imprisons and beheads John the Baptist (Luke 3:19-20)." },
          { when: "AD 34 / AD 39", h: "End of Philip’s and Antipas’ rule", d: "Philip’s reign ends in AD 34; Antipas’ in AD 39." }
        ]}
      ]
    },
    {
      h: "Lions and foxes",
      blocks: [
        { t: "p", text: "In first-century Jewish culture, calling someone a fox **contrasted him with a lion**. Great men were lions; lesser men were foxes. The same contrast was used of intelligence and of family background." },
        { t: "table", title: "Lion-and-fox sayings", head: ["Saying", "Meaning"], rows: [
          ["‘The lion turns out to be a mere fox.’", "Someone thought brilliant proved inept."],
          ["‘There are lions before you and you ask a fox?’", "A humble reply: why ask me when cleverer people are here?"],
          ["‘He is a lion, the son of a lion.’", "He lives up to his famous parent."],
          ["‘He is a lion, the son of a fox.’", "A compliment: he has risen above his origins."],
          ["‘He is a fox, the son of a fox.’", "You can guess!"],
          ["‘Better to be a tail to lions than a head to foxes.’", "A lowly place among great people is better than leading fools; you grow stronger with people of calibre."]
        ]},
        { t: "callout", kind: "insight", title: "Cutting Herod down to size", text: "Jesus was not praising Herod’s cunning. Antipas was no lion. At best he was ‘a fox, the son of a lion’ — nowhere near his father, Herod ‘the Great’. He might think himself equal, but Jesus did not. So Jesus was not afraid. Herod was no real threat." },
        { t: "p", text: "Jesus also knew he was doing his Father’s will. He was heading to Jerusalem to be ‘delivered into the hands of men’ (Luke 9:44) and then ‘taken up into heaven’ (Luke 9:51). Herod could not stop God’s plan. The ‘fox’ remark made this point neatly — and probably made the listeners smile. Today we might say *weakling*, *small-fry*, *a nobody*, or, for a ruler with no real power, *usurper* or *pretender*." }
      ]
    },
    {
      h: "History behind the parable of the ten minas",
      blocks: [
        { t: "p", text: "In Luke 19:12 Jesus begins the parable of the ten minas (similar to the parable of the talents, Matthew 25:14-30). Luke is specific: ‘A man of noble birth went to a distant country to have himself appointed king and then to return.’ Listeners would recognise a real event." },
        { t: "steps", title: "What actually happened", items: [
          { h: "A journey to Rome", d: "When Herod the Great died, his sons had to travel to Rome. His will was not automatic — Emperor Augustus had to agree, perhaps helped by a ‘gift’." },
          { h: "A changed will", d: "A few days before he died, Herod changed his will, making Archelaus his main heir instead of Antipas — a tense journey!" },
          { h: "Augustus decides", d: "He gave Archelaus the largest portion but only the title ‘ethnarch’, not king — a kind of probation for an eighteen-year-old." },
          { h: "A delegation follows", d: "Jewish representatives went to Rome, listed Herod’s crimes and begged not to be ruled by his sons — they would rather have direct Roman rule. Augustus dismissed them." },
          { h: "Revenge", d: "Archelaus hunted down and killed members of the delegation and their families." },
          { h: "Atrocities and exile", d: "At Passover his soldiers massacred three thousand Jews around the Temple. After more atrocities he was deposed in AD 6 and exiled to Gaul." }
        ]},
        { t: "quote", text: "But his subjects hated him and sent a delegation after him to say, ‘We don’t want this man to be our king.’ He was made king, however, and returned home.", ref: "Luke 19:14-15" },
        { t: "callout", kind: "insight", title: "A knowing smile", text: "Jesus’ hearers would have smiled: noblemen going to a distant country to get power, a hostile delegation following them — they knew this story. Antipas was still in power in Galilee, but only as a puppet. Rome held the real power. Herod was nothing more than a big, bad fox. Jesus knew he would not die at Herod’s hands, so why fear his threats?" }
      ]
    },
    {
      h: "Review",
      blocks: [
        { t: "flip", title: "Flashcards", items: [
          { front: "Which Herod did Jesus call ‘that fox’?", back: "Herod Antipas, tetrarch of Galilee and Perea (4 BC – AD 39)." },
          { front: "In Jewish idiom, a fox is contrasted with…?", back: "A lion. Lions were great men; foxes were lesser men." },
          { front: "Why did Joseph settle in Nazareth?", back: "Because the violent Archelaus ruled Judea (Matthew 2:19-23)." },
          { front: "What does ‘tetrarch’ mean?", back: "Ruler of a fourth (quarter) of a kingdom." },
          { front: "What real event lies behind Luke 19:12-15?", back: "Herod’s sons going to Rome for power, followed by a Jewish delegation opposing them." }
        ]}
      ]
    }
  ],
  keypoints: [
    "Some Pharisees warned Jesus about Herod — not all Pharisees were hostile.",
    "Herod the Great’s kingdom was divided between Archelaus (ethnarch), Antipas and Philip (tetrarchs).",
    "Archelaus’ cruelty led Joseph to settle in Nazareth; Archelaus was deposed in AD 6.",
    "Antipas ruled Galilee during Jesus’ ministry and executed John the Baptist.",
    "In Jewish idiom a ‘fox’ is a lesser man compared with a ‘lion’ — not mainly a cunning one.",
    "Calling Antipas a fox cut him down to size: Jesus did not fear him.",
    "The parable of the ten minas echoes Herod’s sons going to Rome and the Jewish delegation that opposed them."
  ],
  quiz: [
    { q: "What did ‘fox’ mainly suggest in first-century Jewish culture?", options: ["A brilliant leader", "A lesser man, in contrast with a lion", "A holy person", "A thief"], answer: 1, why: "Great men were called lions; lesser men foxes." },
    { q: "Which region did Herod Antipas rule?", options: ["Galilee and Perea", "Judea and Samaria", "Ituraea and Trachonitis", "Egypt"], answer: 0, why: "Antipas was tetrarch of Galilee and Perea from 4 BC to AD 39." },
    { q: "What does ‘Better to be a tail to lions than a head to foxes’ teach?", options: ["Always seek to lead", "Animals are wise", "Avoid great people", "A lowly place among great people is better than leading fools"], answer: 3, why: "You learn more and grow stronger by associating with people of greater calibre." },
    { q: "Which historical event lies behind the opening of the parable of the ten minas?", options: ["The Exodus", "Herod’s sons travelling to Rome to be confirmed as rulers", "The building of the Temple", "Pilate’s trial of Jesus"], answer: 1, why: "A nobleman going to a distant country to receive power — and a hated delegation following — matched Archelaus’ story." }
  ]
},
{
  id: "j22-telling-the-truth",
  title: "Telling the Truth",
  summary: "When Jesus says ‘I tell you the truth’, he is saying ‘Amen!’ — and it comes first. It agrees with something just said or done, then adds a further point: ‘True! And here is more.’",
  sections: [
    {
      h: "Why say it so often?",
      blocks: [
        { t: "p", text: "Jesus says ‘I tell you the truth’ (or similar) over seventy times in the gospels — counting parallel passages. Does that mean he was less truthful at other times? Of course not. Something **Hebraic** lies behind it: a familiar Hebrew word we all use — **Amen!**" },
        { t: "term", word: "Amen", heb: "אָמֵן", lang: "Hebrew", meaning: "An ordinary Hebrew word meaning ‘firm’, ‘established’, ‘true’ or ‘sure!’. In English and Greek it is transliterated — the Hebrew letters are simply turned into our letters." },
        { t: "p", text: "Greek did the same, so the gospels have **amēn legō hymin** — ‘truly I say to you’ (older versions: ‘verily I say unto you’). In John’s Gospel the amen is always **doubled**: ‘truly, truly’ or ‘very truly I tell you’. Why only John does this is unclear, but it makes the phrase even more Hebraic." },
        { t: "table", title: "Forms of the phrase", head: ["Greek", "English", "Example"], rows: [
          ["amēn legō hymin", "Truly I say to you (plural)", "Most occurrences"],
          ["amēn legō soi", "Truly I say to you (singular)", "To Peter, Matthew 26:34"],
          ["amēn amēn legō soi", "Truly, truly I say to you (singular)", "To Nicodemus, John 3:3"],
          ["legō gar hymin", "For I say to you (no amen)", "Various"],
          ["amēn gar legō hymin", "For I tell you the truth", "Various"]
        ]}
      ]
    },
    {
      h: "The amen comes first",
      blocks: [
        { t: "p", text: "Here is the key point. Whenever ‘amen’ occurs, it is **always at the beginning**. English turns it round and puts ‘truth’ at the end: ‘I tell you the truth.’ It should really be: **‘True! I say to you…’**" },
        { t: "compare", title: "How we hear it vs what it means", cols: [
          { h: "Usual reading", items: ["‘Truth’ qualifies what comes next", "As if to boost credibility", "Suggests other words might be less true"] },
          { h: "Hebraic meaning", items: ["‘Amen!’ agrees with what has **just** been said or done", "Like our ‘Amen’ at the end of a prayer", "‘I say to you’ then adds more — a rabbinic ‘furthermore’"] }
        ]},
        { t: "flow", title: "How the idiom works", nodes: [
          { h: "Something is said or done", d: "By someone else — or by the speaker" },
          { h: "‘Amen!’", d: "That’s right! I agree" },
          { h: "‘I say to you…’", d: "Furthermore — here is more" },
          { h: "A further lesson", d: "Developing the point" }
        ]},
        { t: "callout", kind: "insight", title: "In other words", text: "Jesus is saying: ‘This is so true it deserves further comment — so listen to what I now have to say.’ Rabbis even agreed with themselves for effect before going on! The phrase appears in the Old Testament too — even an angel uses it (Daniel 11:2). In the gospels only Jesus says it." }
      ]
    },
    {
      h: "Amen to what people did and said",
      blocks: [
        { t: "p", text: "In each example, look for the thing being endorsed just before." },
        { t: "cards", title: "Edited highlights", items: [
          { h: "The widow’s offering (Mark 12:41-43)", d: "Jesus watches people giving in the Temple. ‘Amen to that! That’s true giving’ — then he teaches about it. Rabbis often drew a lesson from what someone had just done." },
          { h: "The perfume (Mark 14:3-9)", d: "At Simon the Leper’s home a woman pours perfume on Jesus’ head. Others complain. ‘Amen! She’s right!’ — she has prepared him for burial, and her deed will be remembered wherever the gospel is told." },
          { h: "The centurion (Matthew 8:5-13)", d: "His faith astonishes Jesus: ‘Just listen to that!’ Then: many Gentiles will enter the kingdom while unbelieving Jews miss out." },
          { h: "The little child (Matthew 18:3)", d: "Asked who is greatest, Jesus puts a child among them, then affirms his own action: ‘That’s right — now learn from this.’" },
          { h: "The rich young man (Matthew 19:23)", d: "He leaves sad, having great wealth. ‘Take note of what you just saw’ — riches can be dangerous (19:16-24)." },
          { h: "The two sons (Matthew 21:28-31)", d: "‘Which son did his father’s will?’ ‘The first.’ ‘Amen! Exactly! Now here is more to think about.’" }
        ]}
      ]
    },
    {
      h: "Jesus and Nicodemus (John 3)",
      blocks: [
        { t: "p", text: "Much is made of Nicodemus coming ‘at night’, as if in secret or embarrassment. That is speculation. Evening was **when rabbis usually met**, since many had daytime jobs. He may also have brought his own disciples — explaining the ‘we’ of John 3:2 (or he was just speaking grandly). Rabbis normally brought disciples when meeting another rabbi; Jesus’ disciples, probably including John, were likely there too." },
        { t: "steps", title: "The amens in the conversation", items: [
          { h: "Nicodemus (3:2)", d: "‘We know you are a teacher who has come from God…’" },
          { h: "Jesus (3:3)", d: "‘Amen, amen!’ — Yes, you are right: I am from God, my miracles show it. So what I say next about new birth matters." },
          { h: "Nicodemus (3:4)", d: "‘How can someone be born when they are old?’" },
          { h: "Jesus (3:5)", d: "‘Amen, amen!’ — Right again, of course physical rebirth is impossible. Let’s discuss this further." },
          { h: "Jesus (3:11)", d: "Another amen — this pattern likely continued through a much longer talk than John records." }
        ]},
        { t: "callout", kind: "note", title: "Why ‘born again’ only with Nicodemus?", text: "Jesus did not use ‘born again’ (or ‘born from above’) with the Samaritan woman or others. The phrase was already in use. Big life events — marriage, joining the Sanhedrin, becoming ‘Israel’s teacher’ — were called a new birth. Nicodemus had already had as many such ‘new births’ as possible! So his question about being born ‘when old’ is almost a joke: he was too old for any more. The phrase fitted an educated, middle-aged Jewish man perfectly." }
      ]
    },
    {
      h: "Review",
      blocks: [
        { t: "flip", title: "Flashcards", items: [
          { front: "What Hebrew word lies behind ‘I tell you the truth’?", back: "Amen — true, firm, sure." },
          { front: "Where does ‘amen’ always come in Jesus’ phrase?", back: "At the beginning: ‘True! I say to you…’" },
          { front: "What does the ‘amen’ affirm?", back: "Something just said or done — not what is about to be said." },
          { front: "What is special about John’s Gospel?", back: "The amen is always doubled: ‘truly, truly’." },
          { front: "Why did Nicodemus come at night?", back: "Probably because evening was when rabbis normally met — not out of fear." },
          { front: "What did ‘born again’ mean to Nicodemus?", back: "Life-changing events like marriage or joining the Sanhedrin — he had already had them all." }
        ]}
      ]
    }
  ],
  keypoints: [
    "‘I tell you the truth’ translates ‘Amen, I say to you’ — used over seventy times, only by Jesus in the gospels.",
    "Amen is a Hebrew word meaning firm, true, sure; it is transliterated into Greek and English.",

    "‘I say to you’ then adds more — a rabbinic ‘furthermore’.",

    "Nicodemus likely came at night because rabbis met in the evening; ‘born again’ was a phrase he already knew."
  ],
  quiz: [
    { q: "What is the Hebrew word behind ‘I tell you the truth’?", options: ["Shalom", "Amen", "Torah", "Hallelujah"], answer: 1, why: "Greek amēn legō hymin transliterates the Hebrew amen." },
    { q: "What does Jesus’ ‘amen’ normally refer to?", options: ["What has just been said or done", "What he is about to say", "A future prophecy", "His own honesty"], answer: 0, why: "It endorses what came before, like ‘Amen’ at the end of a prayer." },
    { q: "Which Gospel always doubles the amen?", options: ["Matthew", "Mark", "Luke", "John"], answer: 3, why: "In John every case is ‘truly, truly’." },
    { q: "Why did Nicodemus most likely visit at night?", options: ["He was ashamed", "He was hiding from Romans", "Evening was when rabbis usually met", "Jesus only taught at night"], answer: 2, why: "Rabbis often had day jobs and met in the evening, usually with disciples present." },
    { q: "What did Jesus affirm with ‘amen’ in Mark 12:43?", options: ["The Pharisees’ prayers", "The poor widow’s offering", "Peter’s confession", "The rich man’s gift"], answer: 1, why: "He pointed to the widow’s giving as true giving, then taught from it." }
  ]
},
{
  id: "j23-swords-and-ears",
  title: "Swords and Ears",
  summary: "Why did the disciples have two swords, and why did Peter cut off an ear? The Passover seating, the short machaira sword and Temple law help explain it. On the walk to Gethsemane, the Temple’s Golden Vine lies behind ‘I am the true vine’. And ‘Let these sayings sink into your ears’ echoes Exodus 17.",
  sections: [
    {
      h: "A flashing sword in the garden (Luke 22:47-51)",
      blocks: [
        { t: "p", text: "All four gospels tell of Jesus’ arrest, and each mentions a strange incident with a sword and a right ear. ‘Lord, should we strike with our swords?’ the disciples ask (Luke 22:49). Before an answer comes, a blade swishes. John tells us it was **Peter**, and the victim was **Malchus**, a servant of the high priest (John 18:10)." },
        { t: "p", text: "Luke, perhaps because he was a doctor, adds that Jesus ‘touched the man’s ear and healed him’ (Luke 22:51). Jesus rebuked his disciples: ‘all who draw the sword will die by the sword’ (Matthew 26:52; see Luke 22:51; John 18:11)." },
        { t: "list", title: "Questions the accounts raise", items: [
          "Why were the disciples carrying swords?",
          "How many did they have?",
          "Why attack an ear — careful aim, or a glancing blow in the dark?",
          "Why did Jesus heal Malchus — besides compassion (and to stop the screaming)?"
        ]}
      ]
    },
    {
      h: "Two swords at the Passover table",
      blocks: [
        { t: "p", text: "Go back to the Passover meal. ‘When the hour came, Jesus and his apostles reclined at the table’ (Luke 22:14). This was a **triclinium** — three couches in a U-shape around a low serving table. Guests reclined on their left side. Sandals came off and feet were washed first — necessary, since your feet were next to your neighbour!" },
        { t: "term", word: "Triclinium", lang: "Latin", meaning: "A dining arrangement of three couches around a low table, where guests reclined on their left side." },
        { t: "callout", kind: "note", title: "Bodyguards at the ends", text: "Reclining left everyone vulnerable to attack. So the people at the two ends of the U acted as guards. Each kept a sword nearby (not worn — that would be more dangerous to the diners than any intruder!), ready to jump up and defend the group." },
        { t: "p", text: "This explains ‘See, Lord, here are two swords’ (Luke 22:38). Jesus’ reply, ‘That is enough’, does not mean ‘Stop talking like that!’ It most likely means **two are enough for now** — no need to find more." },
        { t: "compare", title: "Then and now (Luke 22:35-36)", cols: [
          { h: "Earlier mission", items: ["Sent out with no provisions (Matthew 10:9-10)", "Following Jesus was safer"] },
          { h: "This night", items: ["‘If you don’t have a sword, sell your cloak and buy one’", "The situation is dangerous; those coming will bring clubs and swords", "Swords for self-defence — not to stop the arrest; Jesus could call twelve legions of angels (Matthew 26:53)"] }
        ]},
        { t: "term", word: "Machaira", heb: "μάχαιρα", lang: "Greek", meaning: "A short, curved, one-edged blade, more like a large knife or dagger. Designed to cut rather than thrust; a domestic tool for killing and butchering animals — unlike a Roman soldier’s larger sword." }
      ]
    },
    {
      h: "Why an ear?",
      blocks: [
        { t: "p", text: "Perhaps Peter had been at one end of the table, or just took charge as usual: ‘I’ll take that now!’ It is likely he knew exactly what he was doing. This was no random thug but a servant of the high priest — maybe his chief assistant, supervising the arrest. Killing him would bring real trouble. Maiming him would have quite different consequences." },
        { t: "steps", title: "A possible reason", items: [
          { h: "Temple law", d: "No one with a blemish or defect could serve in the holy place (Leviticus 21:18-21)." },
          { h: "A known tactic", d: "In Jewish history, cutting off an ear lobe was one way to stop someone holding Temple office." },
          { h: "Peter’s aim?", d: "Disqualify the high priest’s servant — punishment enough in Peter’s mind." },
          { h: "Jesus restores", d: "Perhaps one reason Jesus healed the ear — though this may read too much into a spur-of-the-moment act." }
        ]}
      ]
    },
    {
      h: "The Golden Vine (John 15:1)",
      blocks: [
        { t: "p", text: "On the way from the Upper Room to Gethsemane, the shortest route ran through the **Temple courts**, open in the evening at that season. They would pass the Temple itself, where a man-made **golden vine** was wrapped around the columns at the entrance to the sanctuary." },
        { t: "cards", title: "The Golden Vine", items: [
          { h: "Famous", d: "Mentioned by the Roman historian Tacitus (Histories 5.5) and by Josephus (Antiquities 15.11.3), who marvelled at its size, artistry and costly materials." },
          { h: "Huge", d: "Branches hung from a great height; some grapes were said to be as tall as a man." },
          { h: "Sponsored", d: "The wealthy could buy a golden leaf or grape — or a whole cluster — which priests attached. Donors’ names were inscribed on leaves. Everyone in Jerusalem knew this custom." }
        ]},
        { t: "p", text: "This was Jesus’ last walk through Jerusalem with all his disciples before his arrest. He wanted to give them something to remember. Passing this artificial vine, he said:" },
        { t: "quote", text: "I am the true vine.", ref: "John 15:1" },
        { t: "timeline", title: "Tracking the walk in John’s Gospel", items: [
          { when: "John 14:31", h: "‘Come now; let us leave’", d: "They leave the Passover room — a detail often missed." },
          { when: "John 15–16", h: "Teaching on the way", d: "The vine and branches, and more, spoken while walking — perhaps pausing at the Golden Vine." },
          { when: "John 17", h: "Jesus’ great prayer", d: "Still before they reach the garden." },
          { when: "John 18:1", h: "Across the Kidron", d: "Only now do they enter Gethsemane." }
        ]},
        { t: "callout", kind: "insight", title: "Real fruit", text: "Jesus is the true vine — far more valuable and real than anything golden or man-made. If we stay attached to him as branches, we bear real fruit. Every time the disciples later saw the golden vine, they would remember his words." }
      ]
    },
    {
      h: "‘Lay these sayings in your ears’ (Luke 9:44)",
      blocks: [
        { t: "p", text: "‘Listen carefully to what I am about to tell you’ (Luke 9:44) is a good translation of a vivid Hebrew idiom. The Authorised Version says, ‘Let these sayings sink down into your ears’; another rendering is ‘Lay these sayings in your ears’. Imagine your teacher saying that!" },
        { t: "p", text: "Jesus likely chose it because of **Exodus 17:14**. After Joshua defeated the Amalekites — helped by Moses’ day-long raised hands, held up by Aaron and Hur — God told Moses to write the events on a scroll as a memorial, and to ‘make sure that Joshua hears it’. The Hebrew literally says: **‘place it in the ears of Joshua’**." },
        { t: "flow", title: "From Joshua to the disciples", nodes: [
          { h: "Exodus 17:14", d: "‘Place it in Joshua’s ears’" },
          { h: "Why?", d: "Amalek would be a constant enemy; this victory and God’s promise (17:15-16) would keep Israel going" },
          { h: "Luke 9:44", d: "‘Lay these sayings in your ears’" },
          { h: "Why?", d: "‘The Son of Man is going to be betrayed into the hands of men’" }
        ]},
        { t: "callout", kind: "insight", title: "Not in one ear and out the other", text: "Joshua had to let the words sink in and stay. In the same way, the disciples could not yet grasp that Jesus would be betrayed and killed — it was unthinkable. Jesus used the idiom so they would keep the message for the days ahead, when it would become more and more meaningful." }
      ]
    },
    {
      h: "Review",
      blocks: [
        { t: "flip", title: "Flashcards", items: [
          { front: "Why did the disciples have two swords?", back: "The men at the two ends of the triclinium acted as bodyguards with swords nearby." },
          { front: "What did ‘That is enough’ (Luke 22:38) mean?", back: "Two swords were sufficient — no need for more." },
          { front: "What is a machaira?", back: "A short, curved, one-edged cutting blade — like a large knife." },
          { front: "Why might Peter have aimed for an ear?", back: "A blemish disqualified a man from Temple service (Leviticus 21:18-21)." },
          { front: "What lies behind ‘I am the true vine’?", back: "The Golden Vine at the Temple entrance, passed on the walk to Gethsemane." },
          { front: "Where does ‘lay these sayings in your ears’ come from?", back: "Exodus 17:14 — ‘place it in the ears of Joshua’." }
        ]}
      ]
    }
  ],
  keypoints: [
    "Peter cut off the right ear of Malchus, the high priest’s servant; Jesus healed it and rebuked the violence.",
    "At a triclinium, those at the two ends kept swords nearby as bodyguards — hence ‘two swords’.",
    "‘That is enough’ means two swords are sufficient, not ‘stop talking’.",
    "The machaira was a short, curved cutting blade, a domestic tool.",
    "Losing an ear disqualified a man from Temple service, which may explain Peter’s aim.",
    "‘I am the true vine’ was likely spoken near the Temple’s famous Golden Vine on the walk to Gethsemane (John 14:31–18:1).",
    "‘Lay these sayings in your ears’ echoes Exodus 17:14 — words that must sink in and stay."
  ],
  quiz: [
    { q: "What was a triclinium?", options: ["A Roman sword", "A U-shaped set of three couches round a low table", "A Temple courtyard", "A type of lamp"], answer: 1, why: "Guests reclined on their left side on three couches around a serving table." },
    { q: "What did Jesus most likely mean by ‘That is enough’ about two swords?", options: ["Stop talking about swords", "Throw the swords away", "Two swords are sufficient for now", "Buy many more swords"], answer: 2, why: "He had just told them to get a sword; two would do." },
    { q: "Why might cutting off an ear matter in Jewish law?", options: ["A man with a blemish could not serve in the Temple", "It was a sign of marriage", "It meant the person was a slave", "It was required at Passover"], answer: 0, why: "Leviticus 21:18-21 barred those with a defect from serving in the holy place." },
    { q: "Where was Jesus probably when he said ‘I am the true vine’?", options: ["In Galilee", "On a boat", "In Bethany", "Walking past the Temple’s Golden Vine on the way to Gethsemane"], answer: 3, why: "John 14:31 shows they had left; they reached the garden only in John 18:1." },
    { q: "‘Lay these sayings in your ears’ echoes which passage?", options: ["Genesis 1", "Exodus 17:14", "Psalm 23", "Isaiah 53"], answer: 1, why: "God told Moses to ‘place it in the ears of Joshua’ after the victory over Amalek." }
  ]
