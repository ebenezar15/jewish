/* ===================== CHAPTER 7 ===================== */
{
  id: "j07-two-or-three",
  title: "Two or Three?",
  summary: "Matthew 18:15-20. Binding and loosing extended to all the apostles, the Acts examples, why 'where two or three gather' is about church discipline, and what Jesus really meant by 'church'.",
  sections: [
    {
      h: "Binding and loosing for all the apostles",
      blocks: [
        { t: "p", text: "Did the other disciples feel left out when Jesus spoke to Peter? Just two chapters later, in Matthew 18, the fourth of Matthew's five teaching blocks, Jesus repeats to **all** of them what he had said to Peter about binding and loosing (Matthew 18:18). Any apostle might be called on to interpret Scripture, settle disputes and find answers in a crisis." },
        { t: "quote", text: "Truly I tell you, whatever you bind on earth will be bound in heaven, and whatever you loose on earth will be loosed in heaven.", ref: "Matthew 18:18" }
      ]
    },
    {
      h: "Binding and loosing in Acts",
      blocks: [
        { t: "timeline", title: "Apostolic decisions in the early church", items: [
          { when: "Acts 5:1-11", h: "Ananias and Sapphira", d: "Ananias lied about the money from his land and fell dead, perhaps to Peter's surprise. Three hours later Sapphira repeated the lie; this time Peter was ready and ruled, 'they will carry you out also'. Heaven backed his ruling." },
          { when: "Acts 6:1-6", h: "The widows and the Seven", d: "Some widows were overlooked in the daily food distribution. Seven were appointed to care for them so the apostles could focus on prayer and the word. A less obvious case of binding and loosing." },
          { when: "Acts 15", h: "The Jerusalem Council", d: "Gentiles were believing and receiving the Spirit. Must they be circumcised and keep the Law of Moses? A crisis that threatened to split the church." }
        ] },
        { t: "steps", title: "How the Jerusalem Council 'bound' and 'loosed'", items: [
          { h: "Cases heard", d: "The apostles and elders considered various arguments." },
          { h: "Peter looses", d: "He released Gentiles from the requirement to keep the Law of Moses (Acts 15:7-11)." },
          { h: "James looses too", d: "He agreed (v. 19)." },
          { h: "James binds", d: "He forbade food offered to idols, sexual immorality, the meat of strangled animals, and blood (v. 20). 'Strangled' meat had not had its blood drained at death." },
          { h: "Written down", d: "The ruling was made official in a letter, sent to Gentile believers to be known and kept everywhere." }
        ] },
        { t: "callout", kind: "note", title: "'Heaven' means God", text: "In Matthew especially, 'heaven' is a reverent way of saying 'God', since Jewish readers preferred not to use God's name. It does not mean a debate in a heavenly court or anyone other than God the Father." }
      ]
    },
    {
      h: "The context: dealing with sin among believers",
      blocks: [
        { t: "p", text: "Matthew 18:15-20 is about **church discipline**, or as one Bible heading puts it, 'Dealing with sin in the church'. Verse 18 is often torn away from this context and applied to spiritual warfare or demons, and its real message is lost." },
        { t: "flow", title: "Jesus' three stages (Matthew 18:15-17)", nodes: [
          { h: "1. Just the two of you", d: "Go and point out the fault privately" },
          { h: "2. Take one or two others", d: "So every matter is established by two or three witnesses" },
          { h: "3. Tell the assembly", d: "If he still refuses, treat him as an outsider" },
          { h: "Heaven's backing", d: "What you bind or loose stands (v. 18)" }
        ] },
        { t: "p", text: "The stages increase in severity and consequences. Then comes the promise that the apostles' rulings will be sanctioned by heaven." }
      ]
    },
    {
      h: "Where two or three gather",
      blocks: [
        { t: "quote", text: "Again, truly I tell you that if two of you on earth agree about anything they ask for, it will be done for them by my Father in heaven. For where two or three gather in my name, there am I with them.", ref: "Matthew 18:19-20" },
        { t: "p", text: "These verses are often quoted on their own, especially verse 20 when the prayer meeting is small: 'Never mind, at least Jesus is here!' Do they stand alone or belong with verses 15-18?" },
        { t: "compare", title: "Do verses 19-20 stand alone?", cols: [
          { h: "Yes, a general promise", items: ["'Again' marks a fresh start", "'Anything' or 'whatever' widens what may be asked for"] },
          { h: "No, they belong to vv. 15-20", items: ["Such a short section is more likely linked to nearby verses", "'Two or three' (v. 20) points back to v. 16: you plus 'one or two others'", "This follows Deuteronomy 19:15: 'a matter must be established by the testimony of two or three witnesses'", "Peter's next question (v. 21) is about forgiving a brother who sins, continuing the theme from v. 15"] }
        ] },
        { t: "p", text: "So the matter agreed upon in verse 19 is the discipline of an unrepentant brother or sister. The two or three who judge the issue meet in Jesus' name, can ask him for whatever they need to reach the right decision, and can trust that their judgement, for or against the brother, will match God's will." },
        { t: "callout", kind: "insight", title: "Confidence for a heavy task", text: "How discipline is done, and seen to be done, matters as much as the outcome. Discipline, forgiveness and restoration carry huge, sometimes ruinous consequences. Those deciding could feel overwhelmed: 'What if we get it wrong?' Jesus gives them and the whole community confidence in the process." },
        { t: "p", text: "Of course Jesus is with us in prayer meetings and Bible studies, usually through the Spirit. But the personal 'there am I with them' here is meant for serious cases of sin between believers. In Jewish practice, a wider application in line with the text, a **midrash**, is sometimes allowed, so perhaps some allowance can be made. The danger is that the lesser use becomes the norm and the original meaning is lost. Taking it seriously would mean practising church discipline as Jesus taught, something most churches would rather avoid." }
      ]
    },
    {
      h: "Jewish parallels: the minyan and the Shekinah",
      blocks: [
        { t: "term", word: "Minyan", heb: "מִנְיָן", lang: "Hebrew", meaning: "The quorum of ten men over the age of thirteen required for Jewish public worship or prayer." },
        { t: "term", word: "Shekinah", heb: "שְׁכִינָה", lang: "Hebrew", meaning: "The manifest, dwelling presence of God." },
        { t: "p", text: "Some see Jesus' words as echoing the minyan: but here it is not ten, as in a synagogue, but **two or three, plus Jesus himself**. Early rabbinic writings contain striking parallels:" },
        { t: "table", title: "Rabbinic sayings and Jesus' promise", head: ["Source", "Saying"], rows: [
          ["Sanhedrin 39", "'Whenever ten are gathered for prayer, there the Shekinah rests.'"],
          ["Berakhot 6", "'When three sit as judges, the Shekinah is with them.'"],
          ["Pirke Avot 3:2", "'If two sit together and words of the Law are spoken between them, the Divine Presence rests between them.'"],
          ["Pirke Avot 3:3", "'If three have eaten at one table and have spoken over it words of the Law, it is as if they had eaten from the table of God.'"],
          ["Matthew 18:20", "'Where two or three gather in my name, there am I with them.'"]
        ] }
      ]
    },
    {
      h: "The curious silence: did Jesus say 'church'?",
      blocks: [
        { t: "p", text: "In all the Gospels the word 'church' appears only in these two passages: Matthew 16:18 and 18:17. Here is a curious incident, like the famous detective's clue of the dog that did nothing in the night: **the disciples said nothing**. Jesus seems to introduce a strange new word, yet nobody asks, 'Rabbi, what do you mean by church?'" },
        { t: "p", text: "The simple explanation: he didn't say 'church'! The word does not translate the Greek text or anything Jesus would have said in Hebrew. This study argues that it was imposed on English Bibles in the King James Version to support the Church of England, of which the king was head. Earlier translations, such as Tyndale's, used 'congregation' or 'assembly'. The King James Version drew heavily on Tyndale but, by royal rule, used traditional church words; 'church' was the third of fifteen such rules. The motive was political." },
        { t: "term", word: "Qahal", heb: "קָהָל", lang: "Hebrew", meaning: "'Community, assembly, congregation'. The word for Israel gathered before God after he rescued them from Egypt (e.g. Exodus 35:1; Leviticus 4:13-14; Deuteronomy 5:22)." },
        { t: "term", word: "Ekklesia", heb: "ἐκκλησία", lang: "Greek", meaning: "The Greek equivalent of qahal: 'assembly' or 'community'. It occurs over a hundred times in the New Testament, and is usually translated 'church'." },
        { t: "compare", title: "'Church' or 'community'?", cols: [
          { h: "What we hear in 'church'", items: ["A building or an institution", "Often run in ways Jesus never envisaged", "Institutional churches and one-man shows", "Biblical principles like discipline often missing"] },
          { h: "What the disciples heard in 'qahal'", items: ["God's gathered people, like Israel after Egypt", "'I will build my community, and I'm starting with you'", "A Spirit-led, gifted assembly", "Every member working as a body under the head builder, King Jesus"] }
        ] },
        { t: "p", text: "Ekklesia appears throughout Paul's letters and Revelation. The only places it is not rendered 'church' are in Acts 19 (vv. 32, 39, 41), where it means a legal assembly or a rioting mob." },
        { t: "callout", kind: "warn", title: "Why it matters", text: "This is not a quibble over vocabulary. If we read 'church', we assume Jesus meant what we see around us today. But much of that is the work of human hands rather than the community Jesus promised to build, starting with Peter, Paul and the other apostles." },
        { t: "p", text: "The next chapter looks at the rest of Matthew 18, where Peter picks up the theme of a brother who sins and needs forgiveness." }
      ]
    },
    {"h": "Review flashcards", "blocks": [{"t": "flip", "title": "Test yourself", "items": [{"front": "Matthew 18:18", "back": "Binding and loosing given to all the apostles."}, {"front": "Acts 15 ruling", "back": "Gentiles loosed from the Law of Moses; bound from idol food, sexual immorality, strangled meat and blood."}, {"front": "'Two or three'", "back": "The witnesses of Matthew 18:16 and Deuteronomy 19:15."}, {"front": "Minyan", "back": "Quorum of ten men needed for Jewish public prayer."}, {"front": "Shekinah", "back": "The manifest, dwelling presence of God."}, {"front": "Qahal / ekklesia", "back": "Community or assembly, the word behind 'church'."}]}]}
  ],
  keypoints: [
    "In Matthew 18:18 Jesus gives all the apostles the authority to bind and loose that he gave Peter.",
    "Acts shows this in practice: Ananias and Sapphira, the Seven, and especially the Jerusalem Council (Acts 15).",

      "heb": "ἀδελφός",
      "lang": "Greek",
      "meaning": "“Brother.” In the gospels it means a fellow disciple of either gender — a brother or sister in the new community Jesus is building."

     {
      "t": "p",
      "text": "Some translations say “someone who sins” to sound inclusive. But the Greek is still *adelphos*. So the question is not about anyone at all. It is about believers we treat as brothers and sisters. There will be enough sins to deal with there!"
     },
     {
      "t": "term",
      "word": "Inclusio",
      "meaning": "A literary “bookend.” The same word appears at the start and end of a passage to mark its boundaries. Here “brother” opens the passage (v. 21) and closes it (v. 35)."
     },
     {

      "text": "Lord, how many times shall I forgive my brother or sister who sins against me? Up to seven times?",

   {
    "h": "How many times? One, two, three… seven",
    "blocks": [
     {
      "t": "p",
      "text": "Peter tries to answer his own question: “How about seven?” This makes sense. Seven was often a symbol of **fullness or completion**. Also, this was a standard question to ask a rabbi. Disciples wanted to know their rabbi’s view, because the answer showed whether he belonged to a strict or a lenient school. Seven may have been the generous answer, and Peter may have been guessing what his merciful rabbi would say."
     },
     {
      "t": "p",
      "text": "In Luke 17:3-4 Jesus even says to forgive the same brother **seven times in one day** — again perhaps a symbol of being lavish in forgiveness. But that sounds open to abuse. Is the repentance real each time? For this reason some Jewish traditions said **three times** was enough. If someone did not change after a few times, they never would."
     },
     {
      "t": "quote",
      "text": "If a man said, “I will sin and repent, and sin again and repent,” he will be given no chance to repent. If he said, “I will sin and the Day of Atonement will effect atonement,” then the Day of Atonement effects no atonement.",
      "ref": "Mishnah, Yoma 8:9"

      "t": "p",
      "text": "The Mishnah adds: sins between a person and God are atoned on the Day of Atonement, but sins against a fellow human are atoned **only if he has first made peace with that person**. Repentance must be genuine, and real reconciliation is needed."
     },
     {
      "t": "p",

       {
        "h": "Peter: 7",

      "word": "Remez",
      "heb": "רֶמֶז",

      "t": "p",
      "text": "A rabbi never announced, “Here comes a remez!” The name itself came only in medieval times. Disciples had memorised Scripture from childhood and were listening for such links. If they missed it, the rabbi did not open the scroll for them. His job was to set up a **journey of discovery**. If they missed it — their loss!"

 {
  "id": "j10-eye-eye",
  "title": "Eye, Eye",
  "summary": "Four “eye” sayings in the Sermon on the Mount: the good eye (generosity), eye for an eye (non-retaliation), the plank in the eye (judging), and gouging out the eye (hyperbole about sin).",
  "sections": [
   {
    "h": "Four eyes in one sermon",
    "blocks": [
     {
      "t": "p",
      "text": "The Sermon on the Mount mentions eyes four times — so the chapter title could be twice as long! Hebrew thinking prefers **concrete pictures** for abstract ideas, and the human body often appears in its language."
     },
     {
      "t": "tree",
      "title": "The four eye sayings",
      "root": "Eyes in Matthew 5–7",
      "children": [
       {
        "h": "Have a good eye",
        "d": "Matthew 6:22-23 — generosity with money"
       },
       {
        "h": "Eye for an eye",
        "d": "Matthew 5:38-42 — answering injustice without revenge"
       },
       {
        "h": "A plank in the eye",
        "d": "Matthew 7:3-5 — how (not) to judge"
       },
       {
        "h": "Gouge out your eye",
        "d": "Matthew 5:29 — vivid hyperbole about sin"
       }
      ]
     }
    ]
   },
   {
    "h": "Have a good eye! (Matthew 6:22-23)",
    "blocks": [
     {
      "t": "p",
      "text": "These verses sit in a passage about money: treasures on earth (v. 19) and God and Mammon (v. 24). Why talk about eyes, light and darkness in the middle? Because **Jesus is still talking about money**."
     },
     {
      "t": "term",
      "word": "Ayin tovah",
      "heb": "עַיִן טוֹבָה",
      "lang": "Hebrew",
      "meaning": "“A good eye” — an idiom for a generous person who looks out for others’ needs."
     },
     {
      "t": "term",
      "word": "Ayin ra’ah",
      "heb": "עַיִן רָעָה",
      "lang": "Hebrew",
      "meaning": "“A bad eye” — an idiom for a mean, stingy, self-centred person."
     },
     {
      "t": "p",
      "text": "The Hebrew *ayin* (eye) is **singular**. Translations often change it to “eyes” or “eyesight”, or swap “good” for “single”, “sound”, “clear” or “healthy”. None of these carries the idiom. The idiom is still used today: someone collecting for charity may shake a tin and say, “Have a good eye!”"
     },
     {
      "t": "compare",
      "title": "Good eye vs bad eye",
      "cols": [
       {
        "h": "Good eye",
        "items": [
         "Generous",
         "Looks out for others’ needs",
         "Sees God’s abundance",
         "Lights up your whole life"
        ]
       },
       {
        "h": "Bad eye",
        "items": [
         "Stingy, greedy",
         "Blind to people around",
         "Sees scarcity and lack",
         "Fills life with darkness"
        ]
       }
      ]
     },
     {
      "t": "list",
      "title": "The idiom elsewhere",
      "items": [
       "**Proverbs 22:9** — “The generous will themselves be blessed” — literally the one with a good eye.",
       "**Proverbs 23:6-7** — the stingy man (bad eye) “is always thinking about the cost”.",
       "**Proverbs 28:22** — the stingy (bad eye) find “poverty awaits them”.",
       "**Matthew 20:15** — literally “Is your eye bad because I am good?” (Greek *ophthalmos sou ponēros*, from *ayin ra’ah*). Here translations rightly say “envious” and “generous”.",
       "**Mishnah, Terumot 4:3** — the House of Hillel: giving 1/40 of produce as the heave offering (*terumah*) is a good eye, 1/60 a bad eye. The House of Shammai set the good eye at an even more generous 1/30!",
       "**Pirke Aboth 5:16** — of four attitudes to giving, two are a bad eye: giving yourself but discouraging others (bad eye towards what is theirs), or wanting others to give but not giving yourself (bad eye towards what is yours).",
       "**Talmud on Baba Bathra 4** — in a debate about sales, Rabbi Aqiba said a seller usually sells “with a good eye”."
      ]
     },
     {
      "t": "p",
      "text": "In Hebrew the phrase reads “good **of** eye”. The main idea is “good”; “eye” says how. A generous person is good in how he acts on what his eye sees. He sees a good God providing, and so gives more of his resources and himself."
     },
     {
      "t": "callout",
      "kind": "insight",
      "title": "Why worry comes next",
      "text": "A bad eye focuses on scarcity, which feeds worry: “If I give, there won’t be enough for me.” So right after this, Jesus teaches about worry (Matt. 6:25-34). Worry stifles generosity. The only way to store treasure in heaven is by having a good eye."
     }
    ]
   },
   {
    "h": "Eye for an eye (Matthew 5:38-42)",
    "blocks": [
     {
      "t": "p",
      "text": "“Eye for eye, tooth for tooth” (Exodus 21:23-25; Leviticus 24:19-20; Deuteronomy 19:21) was meant well: to stop revenge spiralling out of control. It ended with the second eye. Jesus gives his disciples a different way: “But I tell you, do not resist an evil person.” Four examples follow."
     },
     {
      "t": "cards",
      "title": "Jesus’ four illustrations",
      "items": [
       {
        "h": "The right cheek (v. 39)",
        "d": "A right-handed person facing you can only hit your right cheek with the back of the hand. In the Roman world, a back-handed slap was how you struck a slave or inferior — an insult and a challenge. Turning the other cheek invites them to strike you as an equal. They may repent… or slap again!"
       },
       {
        "h": "Tunic and cloak (v. 40)",
        "d": "Men wore a light linen tunic (haluk) and a large woollen cloak (tallit) that carried the tassels (Deut. 22:12) and served as a blanket. A cloak taken in pledge had to be returned by sunset (Exod. 22:26-27; Deut. 24:12-13). Give both and you may be shivering."
       },
       {
        "h": "The second mile (v. 41)",
        "d": "A Roman soldier could force a non-citizen to carry his pack one mile (a thousand paces). Refusal could mean prison. Jesus says: after the mile, keep walking. Repay exploitation with kindness."
       },
       {
        "h": "Give and lend (v. 42)",
        "d": "Not a blank cheque. Don’t refuse to lend as a way of getting revenge. Don’t deny someone help you could give."
       }

     {
      "t": "term",
      "word": "Tallit",
      "heb": "טַלִּית",
      "lang": "Hebrew",
      "meaning": "The outer cloak: a large rectangular woollen cloth reaching to the ankles, with tassels on its corners; also used as a blanket at night."

     {
      "t": "term",
      "word": "Haluk",
      "heb": "חָלוּק",
      "lang": "Hebrew",
      "meaning": "The tunic: a lighter inner robe, usually linen, worn at home and at work."

     {
      "t": "p",
      "text": "Verse 42 makes more sense with Hebrew. “Ask” can mean ask a question, request, or **ask to borrow**. Hebrew also has different words for two kinds of borrowing: returning the same item (a book, a car) or repaying in kind (milk, money). These form a poetic parallel. English has one word for “borrow”, so translators used “ask” for variety — which gives the wrong impression."

    ]
   },
   {
    "h": "A plank in the eye (Matthew 7:1-5)",
    "blocks": [
     {
      "t": "p",
      "text": "There is humour here: a man with a roof beam sticking out of his eye tries to remove a speck of sawdust from someone else’s. “Do not judge” (v. 1) is a **warning, not an absolute ban**. The standard you set will be applied to you (v. 2, a saying older than Jesus)."
     },
     {
      "t": "steps",
      "title": "Judging rightly",
      "items": [
       {
        "h": "Check the motive",
        "d": "Judge to correct, never to condemn."
       },
       {
        "h": "Stay within your authority",
        "d": "Only judge where God gives you authority, or you take his place."
       },
       {
        "h": "Never judge a person’s worth or destiny",
        "d": "Only God can. Words like ‘Raca’ and ‘You fool!’ (Matt. 5:22) are excessive judgements of worth."
       },
       {
        "h": "Lift up, don’t squash",
        "d": "Judge without being judgemental."
       }
      ]
     },
     {
      "t": "list",
      "title": "“Measure for measure” in Jewish writings",
      "items": [
       "“With what measure a man metes it shall be measured to him again.” (Mishnah, Sotah 1:7)",
       "Hillel: “Judge not thy fellow until thou art come to his place” — stand in his shoes. (Pirke Aboth 2:5)",
       "“If the judge said, ‘Take the splinter from between your teeth,’ he would retort, ‘Take the beam from between your eyes.’” (Talmud, Baba Bathra 15b)",
       "Rabbi Tarfon: “I doubt if anyone in this generation is fit to rebuke others. If one says, ‘Remove the mote from between your eyes,’ the reply is, ‘Remove the beam from between your eyes.’”"
      ]
     },
     {

      "kind": "note",
      "text": "These parallels show Jesus fitted the culture of his day — while adding an extra dimension other rabbis lacked."
     }
    ]
   },
   {
    "h": "Gouge out your eye (Matthew 5:29)",
    "blocks": [
     {
      "t": "quote",
      "text": "If your right eye causes you to stumble, gouge it out and throw it away.",
      "ref": "Matthew 5:29"

      "t": "callout",
      "kind": "warn",
      "text": "Relief that it is not literal must not make us careless. The vivid picture shows how serious these so-called “lesser sins” are — so we guard ourselves against losing our whole selves in final judgement."
     },
     {
      "t": "flip",
      "title": "Flashcards",
      "items": [

 {

  "title": "The Show Mustn’t Go On",

   {
    "h": "The Beatitudes (Matthew 5:3-12)",
    "blocks": [
     {
      "t": "p",

   {

      "text": "“Hypocrite” appears four times in the Sermon (6:2, 5, 16; 7:5) and often in Matthew 23. Today a hypocrite says one thing and does another (“they do not practise what they preach”, Matt. 23:3). But in Jesus’ day it also meant doing religious acts **for show** (“everything they do is done for people to see”, Matt. 23:5)."

      "text": "In Luke 11:1 the disciples ask, “Lord, teach us to pray.” They already knew prayers from home and synagogue, but disciples normally asked their rabbi for further guidance. Jesus gave an updated version of prayers they knew — the **Amidah** and especially the **Kaddish**. It is better called “the disciples’ prayer”."

  "id": "j12-dig-deep",
  "title": "Dig Deep",
  "summary": "The Sermon on the Mount ends with the parable of the two builders — really two grounds — challenging hearers to become doers. Parables (mashal) were a Jewish form with typical features: unnamed characters, shocks and open endings.",
  "sections": [
   {
    "h": "Disciples or crowds?",
    "blocks": [
     {
      "t": "p",
      "text": "Was Jesus teaching his disciples or the crowds? The crowds were amazed at his authority (Matt. 7:28-29), so they heard him. But a rabbi did not normally preach to huge crowds like a Greek orator."
     },
     {
      "t": "p",
      "text": "The Sermon was probably not a one-off mega-event. More likely Matthew **compiled** Jesus’ early teaching given in many places in Galilee over time. Jesus sat on the mountainside like a rabbi, and “his disciples came to him” (Matt. 5:1) — the phrase for committing yourself to learn from a rabbi."
     },
     {
      "t": "callout",
      "kind": "insight",
      "title": "“Came to him”",
      "text": "This expression marks a committed disciple. Jesus’ aim with the crowds was always to turn casual hearers into committed doers who would “come to him”."
     }
    ]
   },
   {
    "h": "The parable of the two grounds (Matthew 7:24-27)",
    "blocks": [

      "text": "Usually called the wise and foolish builders, it might better be called **the two grounds**. The point is simple: what will you do with what you hear?"

      "title": "Two builders, same teaching",
      "cols": [

        "items": [

         "Builds on the sandy surface",
         "House falls with a great crash"
        ]
       }
      ]
     },
     {
      "t": "p",
      "text": "Sand and rock are not two far-apart places (no beach house!). It is about **depth**: digging through sand to the rock beneath. So the two men may be **neighbours** — like two people side by side in the crowd, or two churchgoers in the same pew. Same teaching; very different results."
     },
     {
      "t": "p",
      "text": "Having heard Jesus “fulfil the Law” and say “But I tell you”, hearers must now let it change them inside. That is what any Torah is for. It takes hard work — but why take the easy option when disaster will follow?"

   {
    "h": "What is a parable?",
    "blocks": [
     {

      "text": "**Jesus did not invent the parable.** Parables are rooted in Jewish culture and Scripture. The clearest Old Testament example is Nathan’s story to David about Uriah (2 Samuel 12:1-4). Jesus based only one parable on an Old Testament text: the Good Samaritan (Leviticus 19:18)."
     },
     {
      "t": "term",
      "word": "Mashal",
      "heb": "מָשָׁל",
      "lang": "Hebrew",
      "meaning": "“Comparison.” Covers parables, sayings, proverbs, riddles, oracles, fables and similitudes — anything that is not plain speech."

     {
      "t": "term",
      "word": "Parabolē",
      "heb": "παραβολή",
      "lang": "Greek",
      "meaning": "From paraballō, “to set one thing beside another” — a comparison, usually between God’s kingdom and everyday life. “An earthly story with a heavenly meaning.”"
     },
     {
      "t": "p",
      "text": "So how many parables did Jesus tell? Answers range from about 30 to 60. Jesus’ replies in Luke 9:57-62 could count as three short, enigmatic parables. Parables can be one sentence, medium length (the two builders), or very short and **paired** (Matt. 13:31-33, 44-46). In Luke 15 three are strung together: the lost sheep and lost coin are “curtain raisers” for the lost son."
     }
    ]
   },
   {
    "h": "Features of a parable",
    "blocks": [
     {
      "t": "cards",
      "title": "What to look for",
      "items": [

        "h": "Unnamed characters",
        "d": "So it could be us."
       },
       {
        "h": "Draws you in",
        "d": "“A man had two sons” (Luke 15:11) rings bells: Cain and Abel, Isaac and Ishmael, Jacob and Esau — this won’t end well!"

       {
        "h": "Which one are you?",
        "d": "The son lost far away among the pigs, or the son lost at home?"
       },
       {
        "h": "Open ending",
        "d": "The father pleads with the older son (Luke 15:28-32). Does he come in? You decide."
       },
       {
        "h": "Illogical behaviour",
        "d": "A father gives part of his estate, while alive, to his most wasteful son."
       },
       {
        "h": "A shock",
        "d": "Asking for the inheritance now meant “I wish you were dead”. Other shocks: the king’s unpayable debt (Matt. 18), the owner sending his son to murderous tenants (Matt. 21:33-46)."

      ]

     {
      "t": "callout",
      "kind": "note",
      "title": "One sharp point",

      "ref": "Elisha ben Avuyah (c. AD 100)"

      "text": "A person whose knowledge is greater than his deeds is like a tree with many branches but few roots: the wind uproots it… A person whose deeds are greater than his knowledge is like a tree with few branches but many roots: all the winds cannot move it.",
      "ref": "Eleazar ben Azariah, Pirke Aboth 3:22"
     },
     {
      "t": "p",
      "text": "Who influenced whom cannot be known — copyright didn’t exist, and parables were spoken before written. But it shows other rabbis also challenged disciples to live what they learnt."
     },
     {
      "t": "callout",
      "kind": "insight",
      "title": "The big difference",
      "text": "The rabbis spoke of those who study Torah. Jesus spoke of “everyone who hears **these words of mine**” (Matt. 7:24, 26). He placed himself and his teaching at the centre — an astonishing claim to authority."
     },
     {
      "t": "flip",
      "title": "Flashcards",
      "items": [
       {
        "front": "Mashal",
        "back": "Hebrew for a parable: any comparison — saying, riddle, proverb or story."
       },
       {
        "front": "Two grounds",
        "back": "Sand over rock: the wise man digs deep to bedrock by doing what he hears."
       },
       {
        "front": "“Came to him”",
        "back": "The phrase for a committed disciple joining a rabbi."
       },
       {
        "front": "Features of a parable",
        "back": "Unnamed characters, shock, illogical behaviour, open ending, one main point."
       },

       }

   "Jesus did not invent parables; they are rooted in Jewish Scripture (e.g. Nathan’s parable in 2 Samuel 12).",

 {
  "id": "j14-the-yokes-on-me",
  "title": "The Yoke’s On Me",
  "summary": "In Matthew 11:28-30, taking Jesus’ yoke means becoming his disciple. His “rest” hints at Exodus 33:14 and Jeremiah 6:16, and a rabbi’s yoke was his way of interpreting Torah — shown by his choice of the second greatest commandment.",
  "sections": [
   {
    "h": "Taking the yoke = becoming a disciple",
    "blocks": [
     {
      "t": "p",
      "text": "Part Three, “Clues and Hints”, explores more examples of **remez**. Words like “rest”, “weary” and “burden” might suggest a holiday from busy life. That may sometimes help, but it is not Jesus’ point. **“Taking the yoke” meant learning from a rabbi** — becoming a disciple."
     },
     {
      "t": "quote",
      "text": "Come to me, all you who are weary and burdened, and I will give you rest. Take my yoke upon you and learn from me, for I am gentle and humble in heart, and you will find rest for your souls. For my yoke is easy and my burden is light.",
      "ref": "Matthew 11:28-30"
     },
     {
      "t": "p",
      "text": "The yoke was a common Jewish image for following God’s laws. Israel’s leaders had “broken off the yoke” (Jeremiah 5:5). “The yoke of the commandments” meant placing yourself under the Law."
     },
     {
      "t": "term",
      "word": "Bar Mitzvah",
      "heb": "בַּר מִצְוָה",
      "lang": "Hebrew/Aramaic",
      "meaning": "“Son of the commandment.” At 13 a Jewish boy declares himself ready to come under Torah — taking the yoke of lifelong learning. The full ritual developed in the 13th-14th centuries, with roots as early as the 6th; something similar may have existed in Jesus’ day."
     },
     {
      "t": "callout",
      "kind": "insight",
      "title": "Two oxen ploughing",
      "text": "A young ox was yoked to an experienced one who knew the farmer’s commands. Walking side by side, the young one learned. That is the rabbi-disciple relationship."
     },
     {
      "t": "list",
      "title": "Clues in the wording",
      "items": [
       "**“Come to me”** — the phrase for a disciple joining a rabbi.",
       "**“Take my yoke… and learn from me”** — a parallelism: yoke = learn. It means “take my yoke in order to learn from me”. (“Learn from me” is better than “learn of me”.)",
       "**“My yoke”** — not just the yoke of the Law in general. Jesus centres it on himself, as in “these words of mine” (Matt. 7:24). His interpretation of the Law IS the Law."
      ]
     },
     {
      "t": "p",
      "text": "Jesus offers a deeper learning than any book or human teacher: a living relationship, side by side, as we “plough through life together”. We have “one Teacher, the Messiah” (Matt. 23:10). Human teachers help, but make disciples only for Jesus. There is room in the yoke for one Master only."
     }
    ]
   },
   {
    "h": "Heavy yokes and an easy one",
    "blocks": [
     {
      "t": "p",
      "text": "All rabbis wanted people to take the yoke of Torah — accepting God’s reign in obedience. But it often became a burden. Jesus criticised **some** Pharisees — not all, for it was a broad movement with many well-meaning members."
     },

      "text": "They tie up heavy, cumbersome loads and put them on other people’s shoulders, but they themselves are not willing to lift a finger to move them.",

      "t": "compare",
      "title": "Two yokes",
      "cols": [

        "h": "Some Pharisees’ yoke",
        "items": [

         "Some called “shoulder Pharisees”",
         "Would not yoke themselves alongside people",
         "Wearied people gave up and were labelled “sinners”"

        "h": "Jesus’ yoke",
        "items": [

         "Still challenging, but less oppressive",
         "He walks beside us in the yoke",
         "More fruitful"
        ]
       }
      ]

     {
      "t": "term",

    "blocks": [
     {
      "t": "p",
      "text": "The book of Ecclesiasticus (the Wisdom of Jesus son of Sirach, or Ben Sirach) in the Apocrypha also uses the yoke image. Notice the Hebraic opening “I opened my mouth”:"
     },

 {
  "id": "j15-the-green-tree",
  "title": "The Green Tree",
  "summary": "On the way to the cross Jesus says, “If they do these things to a green tree, what will happen to a dry one?” A remez to Ezekiel 20-21 shows the green tree is the righteous (Jesus) and the dry trees are those facing Rome’s judgement on Jerusalem.",
  "sections": [
   {
    "h": "A clue spoken under duress",
    "blocks": [
     {
      "t": "p",
      "text": "A rabbi’s well-chosen word or phrase, also found in Scripture, made his hearers think further. Sometimes one word was enough, sometimes a phrase. Nearly every Jew knew the Scriptures well enough to catch it — even those outside his circle of disciples."
     },
     {
      "t": "quote",
      "text": "For if people do these things when the tree is green, what will happen when it is dry?",
      "ref": "Luke 23:31"
     },
     {
      "t": "p",
      "text": "This verse is found only in Luke. It sounds like a proverb, and its imagery needs explaining."
     }
    ]
   },
   {
    "h": "The remez: Ezekiel 20-21",
    "blocks": [
     {
      "t": "p",
      "text": "Ezekiel, one of Jesus’ favourite books for a remez, speaks of trees “both green and dry” (Ezek. 20:47). Chapters 20-21 describe Israel’s rebellion and God’s judgement on Jerusalem and its Temple."
     },
     {
      "t": "quote",
      "text": "I am about to set fire to you, and it will consume all your trees, both green and dry.",
      "ref": "Ezekiel 20:47"
     },
     {
      "t": "p",
      "text": "Normally green trees have enough sap to survive a fire that destroys dry ones. But in the fiercest fire, nothing survives."
     },
     {
      "t": "p",
      "text": "Ezekiel complains, “They are saying of me, ‘Isn’t he just telling parables?’” (Ezek. 20:49). So God gives a **parallel prophecy** — ignore the chapter break and read on! Now fire becomes a sword, and “consume” becomes “cut off” (Ezek. 21:2-5)."
     },
     {
      "t": "table",
      "title": "Ezekiel’s parallel prophecies",
      "head": [

       "Ezekiel 21:2-5",
       "Meaning"
      ],
      "rows": [

        "Sword",
        "Judgement"
       ],
       [
        "Consume",
        "Cut off",
        "Destruction"
       ],
       [
        "Green trees",
        "The righteous",
        "The righteous"
       ],
       [
        "Dry trees",
        "The wicked",
        "The wicked"
       ]
      ]
     },
     {
      "t": "p",
      "text": "Would hearers make the link? Yes. The story form was memorable, it concerned judgement, and the prophecy had already come true. “Green” meaning supple or living, joined with “tree” or “wood”, appears only a few times in Scripture — so there was little room for confusion."
     },
     {
      "t": "callout",
      "kind": "note",
      "title": "A warm-up quote",
      "text": "Just before, Jesus quoted Hosea 10:8 in full: “They will say to the mountains, ‘Fall on us!’ and to the hills, ‘Cover us!’” (Luke 23:30). Perhaps this tuned their ears for the hidden reference. (Hosea 10:8 is also echoed later in Revelation 6:16.)"
     }
    ]
   },
   {
    "h": "Who is the green tree?",
    "blocks": [
     {
      "t": "p",
      "text": "Translations say “**when** the tree is green”, as if one tree is sometimes green, sometimes dry. The Greek is literally “**in** a green tree”, reflecting a Hebrew idiom meaning “**to do to**”."

      "t": "callout",
      "kind": "insight",
      "title": "A better translation",
      "text": "“If men do these things to a green tree, what will they do to a dry one?” Compare Matthew 17:12, where Jesus says of John the Baptist that they “have done to him everything they wished”, and that he too will suffer at their hands."
     },
     {
      "t": "p",
      "text": "So the righteous green tree is **Jesus**. He speaks after being condemned as a traitor to Rome, flogged and mistreated, on the road to crucifixion. Simon of Cyrene is carrying his cross, giving him just enough respite for a short message. A remez lets Jesus say volumes when there is no time to quote all of Ezekiel and preach on it."

      "t": "p",
      "text": "Jesus turns to the wailing women, who typically followed the condemned, and calls them “**Daughters of Jerusalem**” (Luke 23:28). They should weep for themselves and their children. Naming Jerusalem may also point to Ezekiel’s prophecy, which was about Jerusalem and its sanctuary (Ezek. 21:2)."

     {

      "text": "Days earlier, approaching the city, Jesus had **wept over Jerusalem** — not for himself, but for what would come, because they did not “recognise the time of God’s coming” (Luke 19:41-44). “If you, even you, had only known…” (Luke 19:42). Judgement would come not because they “killed Jesus” (the Romans did that) but because they did not recognise their Messiah, and lost what would have brought them peace."

 {
  "id": "j17-breakthrough",
  "title": "Breakthrough!",
  "summary": "Matthew 11:12 seems full of violence. But behind the Greek biazō lies the Hebrew root p-r-ts, “break out”, and a remez to Micah 2:13: the shepherd breaks open the pen and the sheep burst out after their King.",
  "sections": [
   {
    "h": "A troubling verse",
    "blocks": [
     {
      "t": "p",
      "text": "Matthew 11:12 puzzles readers and translators alike. Why would the kingdom of heaven involve violence? Translations disagree:"
     },
     {
      "t": "table",
      "title": "How translations render Matthew 11:12",
      "head": [
       "Version",
       "Wording"
      ],
      "rows": [
       [
        "Authorised (King James)",
        "“the kingdom of heaven suffereth violence, and the violent take it by force”"
       ],
       [
        "New King James",
        "“suffers violence, and the violent take it by force”"
       ],
       [
        "RSV / ESV",
        "“has suffered violence, and men of violence take it by force”"
       ],
       [
        "NIV (early)",
        "“has been forcefully advancing, and forceful men lay hold of it”"
       ],
       [
        "NIV (recent)",
        "“has been subjected to violence, and violent people have been raiding it” (old wording in a footnote)"
       ]
      ]
     },
     {
      "t": "p",
      "text": "The words differ, and the verb switches between **passive** (something done to the kingdom) and **active** (the kingdom doing something). We need a clue to break through!"
     }
    ]
   },
   {
    "h": "Some Greek: biazō",
    "blocks": [
     {
      "t": "term",
      "word": "Biazō",
      "heb": "βιάζω",
      "lang": "Greek",
      "meaning": "“To use force, inflict violence,” especially a forced entry. In modern Greek also “to hurry” — speed and strength of movement."
     },
     {
      "t": "p",
      "text": "The verse has two related words: **biazetai** (verb, about the kingdom) and **biastai** (noun, the violent or forceful people). The debate is whether *biazetai* is passive (“suffers violence”) or active (“advances forcefully”)."
     },
     {
      "t": "p",
      "text": "Some verbs can be **transitive** (needing an object) or **intransitive** (no object needed). *Biazō* is one of these, like *baptizō* (see Luke 12:50). There are also “middle” or “deponent” verbs — passive in form but active in meaning. So the text is ambiguous."
     },
     {
      "t": "compare",
      "title": "Two readings",
      "cols": [
       {
        "h": "Kingdom suffers violence (passive)",
        "items": [
         "The biastai attack the kingdom to stop it growing",
         "Could be religious leaders, Romans, demonic powers",
         "Or Zealots trying to force the kingdom in",
         "Or Herod Antipas, who beheaded John — the first victim",
         "Many say this is the normal sense of biastai"
        ]
       },
       {
        "h": "Kingdom advances forcefully (active)",
        "items": [
         "The biastai are bold people zealously seizing it",
         "John the Baptist and the crowds who responded",
         "Jesus’ miracles and exorcisms; disciples sent out",
         "Those “doing violence” to their own sin by repentance",
         "Evangelists snatching people from evil kingdoms — never physical violence"
        ]
       }
      ]
     },
     {
      "t": "quote",
      "text": "Since that time, the good news of the kingdom of God is being preached, and everyone is forcing their way into it.",
      "ref": "Luke 16:16"
     },
     {
      "t": "p",
      "text": "Luke uses the same *biazetai*, but for people **eagerly rushing into** the kingdom as the good news is preached. There is no physical violence. Luke’s saying sits among loosely connected teachings, without Matthew’s context about John, so it may be a variant or a separate occasion. It helps — but we still need a clue."
     }
    ]
   },
   {
    "h": "Back to Hebrew: p-r-ts, “break out”",
    "blocks": [
     {
      "t": "p",
      "text": "In the **Septuagint** (the Greek Old Testament), *biazō* translates the Hebrew **paratz**, from the root p-r-ts."
     },
     {
      "t": "term",
      "word": "Paratz / Peretz",
      "heb": "פָּרַץ / פֶּרֶץ",
      "lang": "Hebrew",
      "meaning": "“To break out, burst forth, make a breach.” Used of birth, of water bursting a dam, and in shepherding."
     },
     {
      "t": "p",
      "text": "Genesis 38:29: Tamar gives birth to twins. Zerah’s hand appears, then draws back, and his brother bursts out first. Tamar exclaims, “What a breach you have made!” So he is named **Perez** (Peretz), “breach” or “breaking out”."
     },
     {
      "t": "quote",
      "text": "The One who breaks open the way [ha-poretz] will go up before them; they will break through [partzu] the gate and go out. Their King will pass through before them, the LORD at their head.",
      "ref": "Micah 2:13"
     },
     {
      "t": "p",
      "text": "Micah 2 ends with the remnant of Israel returning from exile, gathered by God like sheep in a pen. This is Jesus’ remez."
     }
    ]
   },
   {
    "h": "The shepherd breaks open the pen",
    "blocks": [
     {
      "t": "steps",
      "title": "A morning in the sheepfold",
      "items": [
       {
        "h": "Night",
        "d": "The shepherd pens the sheep in a temporary stone enclosure — against a hillside, in a cave, or using old walls — and closes the gap."
       },
       {
        "h": "Morning: the breaker",
        "d": "He pulls aside some stones to make an opening."
       },
       {
        "h": "Breakthrough",
        "d": "The sheep can’t wait. They push and shove through the gap, several at once, widening the breach; the shepherd knocks more stones aside with his staff."
       },
       {
        "h": "Following",
        "d": "Set free, as if “born”, they rush after the shepherd, their redeemer, and follow him all day with him “at their head”."
       }
      ]
     },
     {
      "t": "callout",
      "kind": "insight",
      "title": "The real picture",
      "text": "Jesus pictures the kingdom of heaven **bursting forth like sheep from a pen** — a joyful, growing movement. Not suffering violence, not inflicting it. Those who “lay hold of it” experience their own breakthrough into salvation and freedom, and as they surge through like water through a broken dam, they widen the breach and sweep others in. This fits Luke 16:16 too."
     }
    ]
   },
   {
    "h": "John the breaker, Jesus the King",
    "blocks": [
     {
      "t": "p",
      "text": "“From the days of John the Baptist until now” shows that **John** made the breach. His radical preaching and baptism of repentance opened a new way, and a movement burst out."
     },
     {
      "t": "p",
      "text": "But in Micah, the breaker, the King and the LORD at their head seem to be one figure. John cannot be the King — he is in Herod Antipas’ prison. So the King must be **Jesus**. He doesn’t say so directly; he wants his hearers to make the connection and see that what John started, he is continuing as people flock to him."
     },
     {
      "t": "p",
      "text": "In Matthew 11:14 Jesus calls John the Elijah who was to come — the messenger preparing the way for the Lord (Mal. 3:1; 4:5-6; Isa. 40:3; Matt. 3:3). Rabbinic sources often read Micah 2:13 as **two people**: the breaker is Elijah, and “their King” is the Branch, the Son of David."
     },
     {
      "t": "quote",
      "text": "The breaker goes up… breaks through thorn fences and prickly hedges to clear the way. Thus it is said of the prophet Elijah that he will come before God’s redemption to turn the hearts of Israel to their Father in heaven… Those returning from exile will break through and pass through the breach as through a gate — they will have courage to turn to God in repentance… Their king passes on before them. He is the King Messiah. He will march at the head of them all.",
      "ref": "Metsudat David on Micah 2:13 (abridged)"
     },
     {
      "t": "table",
      "title": "Micah 2:13 fulfilled",
      "head": [
       "Micah 2:13",
       "Rabbinic reading",
       "In the gospels"
      ],
      "rows": [
       [
        "The breaker goes up before them",
        "Elijah",
        "John the Baptist (Matt. 11:12, 14)"
       ],
       [
        "They break through the gate",
        "Exiles turning to God in repentance",
        "People pressing into the kingdom (Luke 16:16)"
       ],
       [
        "Their King passes before them",
        "King Messiah, Son of David",
        "Jesus"
       ],
       [
        "The LORD at their head",
        "God restoring his presence to Zion",
        "Jesus — left for hearers to conclude"
       ]
      ]
     },
     {
      "t": "callout",
      "kind": "note",
      "text": "Hard work on a difficult verse pays off: listening to the Jewish Jesus often brings a breakthrough."
     },
     {
      "t": "flip",
      "title": "Flashcards",
      "items": [
       {
        "front": "Biazō",
        "back": "Greek: use force, forced entry — also hurry."
       },
       {
        "front": "Paratz",
        "back": "Hebrew: break out, make a breach."
       },
       {
        "front": "Perez",
        "back": "Twin of Zerah, named for “breaking out” (Genesis 38:29)."
       },
       {
        "front": "Micah 2:13",
        "back": "The breaker opens the pen; the sheep burst out; their King goes before them."
       },
       {
        "front": "The breaker and the King",
        "back": "John the Baptist (Elijah) breaks open; Jesus is the King."
       }
      ]
     }
    ]
   }
  ],
  "keypoints": [
   "Matthew 11:12 is translated very differently; the Greek biazetai can be read as passive (suffers violence) or active (advances forcefully).",
   "Biazō can be transitive or intransitive, adding to the ambiguity; Luke 16:16 uses it for people eagerly entering the kingdom.",
   "In the Septuagint, biazō translates the Hebrew paratz — “break out, make a breach”.",
   "Perez (Genesis 38:29) was named for “breaking out” at birth.",

   "Jesus pictures the kingdom bursting forth like sheep — joyful growth, not violence.",
