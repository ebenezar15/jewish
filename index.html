/* ===================== CHAPTER 2 ===================== */
{
  id: "j02-by-whose-authority",
  title: "By Whose Authority?",
  summary: "Matthew 21:23. Jesus taught with an authority that amazed the crowds and worried the leaders. Where did it come from, and why did he keep it rather than pass it on?",
  sections: [
    {
      h: "The question of authority",
      blocks: [
        { t: "p", text: "Jesus' teaching style was rooted in Jewish tradition, but there were differences. The first was **authority**. Everyone who heard him knew he spoke with authority. The crowds were astonished: this was nothing like their usual teachers of the Law (Matthew 7:28-29; Mark 1:22; Luke 4:32, 36)." },
        { t: "quote", text: "By what authority are you doing these things? And who gave you this authority?", ref: "Matthew 21:23" },
        { t: "p", text: "For the religious leaders this was worrying (see also Mark 11:28; Luke 20:2). Their questions show how much authority mattered to them." }
      ]
    },
    {
      h: "How teaching authority normally worked",
      blocks: [
        { t: "p", text: "Before AD 70 there was no formal office of rabbi, but there was a convention that stopped people teaching whatever they liked. You taught **in the name of your rabbi and those who taught him**. You would quote Rabbi X, following Rabbi Y, following Rabbi Z, who said..." },
        { t: "flow", title: "A chain of authority", nodes: ["Rabbi Z taught...", "Rabbi Y passed it on...", "Rabbi X passed it on...", "You quote them all"] },
        { t: "p", text: "This may sound second-hand, but it proved you had learned from others and were passing on collective wisdom, not just your own opinion. It was your set of credentials." },
        { t: "callout", kind: "note", title: "Authority to teach something new", text: "In certain cases you could teach something new, if you had received special authority. This happened when **two already 'authorised' teachers** publicly declared that you too had authority." },
        { t: "p", text: "So the chief priests and elders needed to know who had authorised Jesus. It was about control. Perhaps they also wanted to know who was behind him, and whether others were teaching the same things." }
      ]
    },
    {
      h: "Jesus turns the tables, and his real authority",
      blocks: [
        { t: "p", text: "Jesus answered with a question: where did **John the Baptist's** authority come from, from God or from men? The leaders were stuck. John was not authorised by their system, and they could not claim he was without upsetting the people who held him to be a prophet. If they said 'from God', they would be accused of not believing him. They could only answer, 'We don't know', so Jesus declined to answer them too (Matthew 21:24-27)." },
        { t: "p", text: "But we can do better than 'we don't know'. Jesus received authority in the highest possible way, from God the Father. You could even say he was authorised 'by two' in the accepted way:" },
        { t: "compare", title: "Jesus' 'two witnesses' of authority", cols: [
          { h: "At his baptism", items: ["The Spirit descended on him", "The Father spoke from heaven: 'This is my Son, whom I love; with him I am well pleased'", "Matthew 3:16-17"] },
          { h: "At his transfiguration", items: ["The voice from heaven spoke again", "Adding: 'Listen to him!'", "Matthew 17:5"] }
        ] },
        { t: "p", text: "Nicodemus recognised it: 'no-one could perform the miraculous signs you are doing if God were not with him' (John 3:2). Jesus himself spoke of being 'sent' and said 'my words are not just my own' (John 7:28; 14:10, 24; 17:2)." },
        { t: "callout", kind: "insight", title: "'But I tell you'", text: "At the end of the Sermon on the Mount the crowds were amazed at his authority (Matthew 7:28-29) because he had **not quoted other rabbis**. Again and again he said, 'You have heard that it was said... **But I tell you**' (Matthew 5:21-22, 27-28, 33-34, 38-39, 43-44). This broke the rules of authorised teaching. It may not have been totally unique, but it raised eyebrows: 'Can he really say that?'" }
      ]
    },
    {
      h: "Jesus sits to teach",
      blocks: [
        { t: "p", text: "Matthew introduces the Sermon on the Mount like this: 'He went up on a mountainside and **sat down**' (Matthew 5:1), and then 'he opened his mouth and taught them, saying'. In Jewish culture **rabbis sat to teach**, unlike our preachers who stand." },
        { t: "p", text: "Jesus may well have moved about, and he probably taught this material on many occasions; Matthew likely gathered it together. Calling Matthew 5-7 a 'sermon' comes from our Western preaching tradition. But Matthew's point is clear: a rabbi is about to speak to those who want to be his disciples. Listen carefully." },
        { t: "table", title: "Matthew's five teaching blocks", head: ["Chapters", "Setting", "Theme"], rows: [
          ["5-7", "Jesus 'sat down' on a mountainside", "The Sermon on the Mount"],
          ["10", "-", "Jesus sends his disciples out to do what he has been doing (the next stage of their apprenticeship)"],
          ["13", "He 'got into a boat and sat in it' (13:1-2)", "Parables to the crowds on the shore"],
          ["18", "-", "Training the disciples: life together, discipline and forgiveness"],
          ["24-25", "'Sitting on the Mount of Olives' (24:3)", "His return at the end of the age"]
        ] }
      ]
    },
    {
      h: "Go and make disciples, under his authority",
      blocks: [
        { t: "quote", text: "All authority in heaven and on earth has been given to me. Therefore go and make disciples of all nations... And surely I am with you always, to the very end of the age.", ref: "Matthew 28:18-20" },
        { t: "p", text: "Disciples who became teachers and made more disciples was normal in first-century Judaism. Two notes first: this 'Great Commission' was given in **Galilee**, not at the ascension near Jerusalem, perhaps at an early resurrection appearance. And the words 'go and make' have been much debated." },
        { t: "compare", title: "Two readings of 'go and make'", cols: [
          { h: "A double command", items: ["Both 'go' and 'make' are orders", "A participle attached to a command can 'piggyback' on it and become a command too", "Being sent somewhere is part of obedience: pack your bags"] },
          { h: "One command: 'make'", items: ["'Go' is really a participle: 'as you are going' or 'in your going'", "Make disciples wherever normal life takes you", "Long-distance travel is not essential"] }
        ] },
        { t: "p", text: "The apostles themselves were sent to the ends of the earth (Acts 1:8). We can accept both: some believers must go somewhere at the Lord's command; others make disciples as they go through life. Either way, **disciples make more disciples**." },
        { t: "p", text: "Here is the second big difference. A rabbi normally **passed on his authority** to a few disciples before he died. Jesus does not. All authority has been given to him, and it **stays with him** because he is alive forever. Instead of handing it over, he promises to be with them always. They make disciples under his authority, not their own." },
        { t: "quote", text: "Nor are you to be called 'teacher', for you have one Teacher, the Christ.", ref: "Matthew 23:10 (see also 23:8)" },
        { t: "p", text: "Normally a fully trained disciple raised up his own disciples and became their rabbi and 'father'. Jesus forbids this. There were to be no 'schools' of Peter or of John. They were to make disciples for him, the Teacher who remains forever, and to teach others to **obey** what he commanded (Matthew 28:20), not just memorise it." },
        { t: "callout", kind: "warn", title: "When leaders gather their own followers", text: "At Corinth people were saying 'I follow Paul', 'I follow Apollos', 'I follow Cephas', 'I follow Christ' (1 Corinthians 1:12), and division followed. It is easy for a leader to want a following of their own, and easy for us to prefer human leaders who suit us, even instead of Jesus." },
        { t: "p", text: "Teachers today have no authority of their own. We must teach the whole Bible under Jesus' authority, remembering he is still our rabbi. The apostles knew this: Paul, who never walked with Jesus on earth, still said 'Follow me as I follow Christ' (1 Corinthians 4:15-16; 11:1). Jesus is the only Teacher heaven has fully accredited, and his teachings are not just past words to a Jewish audience; they are the words of our rabbi today." }
      ]
    },
    {"h": "Review flashcards", "blocks": [{"t": "flip", "title": "Test yourself", "items": [{"front": "Chain of authority", "back": "Teaching in the name of earlier rabbis: Rabbi X, following Rabbi Y, following Rabbi Z..."}, {"front": "How could a teacher teach something new?", "back": "If two already authorised teachers publicly declared he had authority."}, {"front": "Jesus' two 'witnesses'", "back": "The Spirit and the Father's voice at his baptism (Matthew 3:16-17), confirmed at the transfiguration (Matthew 17:5)."}, {"front": "'Go and make disciples'", "back": "Perhaps 'as you are going, make disciples'; either way, disciples make disciples (Matthew 28:19)."}, {"front": "Jesus' difference from other rabbis", "back": "He did not pass on his authority; he keeps it because he lives forever (Matthew 28:18-20)."}]}]}
  ],
  keypoints: [
    "Jewish teachers normally taught by quoting a chain of earlier rabbis.",
    "Authority to teach something new required two authorised teachers to declare it.",
    "Jesus was 'authorised' by the Father and the Spirit at his baptism and again at the transfiguration.",
    "'But I tell you' showed Jesus taught with his own authority, which amazed the crowds.",
    "Rabbis sat to teach; Matthew signals Jesus' major teaching blocks by saying he sat down.",
    "'Go and make disciples' may mean 'as you go', but either way disciples make more disciples.",
    "Unlike other rabbis, Jesus did not pass on his authority; he keeps it because he lives forever.",
    "Disciples make disciples for Jesus, not for themselves; he alone is the Teacher (Matthew 23:8-10)."
  ],
  quiz: [
    { q: "How did a teacher normally show his authority in Jesus' day?", options: ["By performing a miracle", "By quoting a chain of earlier rabbis", "By being a priest in the Temple", "By being elected by the people"], answer: 1, why: "Teachers taught in the name of their rabbi and his teachers: 'Rabbi X, following Rabbi Y...'" },
    { q: "What question did Jesus ask in reply to 'By what authority...?'", options: ["Where did Moses get his authority?", "Who authorised the chief priests?", "Was John's baptism from heaven or from men?", "Why do you not keep the Sabbath?"], answer: 2, why: "Asking about John's authority trapped the leaders, who answered 'We don't know' (Matthew 21:24-27)." },
    { q: "What was significant about Jesus 'sitting down' to teach in Matthew 5:1?", options: ["He was tired from the climb", "It showed he was speaking as a rabbi, since rabbis sat to teach", "It showed he was a king on a throne", "It meant the sermon was short"], answer: 1, why: "In Jewish culture rabbis sat to teach; Matthew uses this to mark a major teaching block." },
    { q: "What is the key difference between Jesus and other rabbis regarding authority after their departure?", options: ["Jesus kept his authority because he lives forever", "Jesus passed his authority only to Peter", "Jesus gave equal authority to all twelve disciples", "Jesus never claimed any authority"], answer: 0, why: "'All authority... has been given to me' and 'I am with you always': the disciples make disciples under his authority." },
    { q: "What problem at Corinth illustrates leaders gathering their own followers?", options: ["Arguments over food offered to idols", "Believers saying 'I follow Paul', 'I follow Apollos'", "Disorder at the Lord's Supper", "Lawsuits between believers"], answer: 1, why: "In 1 Corinthians 1:12 believers attached themselves to particular leaders, and division followed." }
  ]
},

/* ===================== CHAPTER 3 ===================== */
{
  id: "j03-no-excuses",
  title: "No Excuses!",
  summary: "Luke 9:57-62. Three would-be disciples meet Jesus on the road. Each reply from Jesus hides a Hebrew idiom about the true cost of following a rabbi.",
  sections: [
    {
      h: "Three short scenes, one big point",
      blocks: [
        { t: "p", text: "Following Jesus was never a light decision. It could mean leaving relatives and friends and travelling the country, so a would-be disciple had to have his priorities in order. Luke places three short incidents side by side, all 'as they were walking along the road' (Luke 9:57), to show **the cost of following Jesus**. Matthew records only two of them (Matthew 8:18-22)." },
        { t: "p", text: "Each scene is two verses long. This three-part pattern is common in the Gospels: it reinforces one message while allowing variety. Read the verses slowly. What is the same? What is different?" },
        { t: "tree", title: "The shape of Luke 9:57-62", root: "Following Jesus: the cost", children: [
          { h: "Scene 1 (vv. 57-58): a volunteer", d: "'I will follow you wherever you go.' Has not counted the cost. Two-part dialogue.", children: [{ h: "Jesus: 'nowhere to lay his head'" }] },
          { h: "Scene 2 (vv. 59-60): a recruit", d: "Jesus says 'Follow me'. He replies 'First let me...' Three-part dialogue.", children: [{ h: "Jesus: 'Let the dead bury their own dead... proclaim the kingdom'" }] },
          { h: "Scene 3 (vv. 61-62): a volunteer with a condition", d: "'I will follow you, but first let me...' Two-part dialogue.", children: [{ h: "Jesus: 'hand to the plough... fit for the kingdom'" }] }
        ] },
        { t: "list", title: "Patterns to notice", items: [
          "'Follow' and 'go' appear in all three scenes.",
          "Each ends with a cryptic saying from Jesus drawn from nature, farming or customs. When something sounds strange to us, that is a clue it is Hebraic.",
          "Scenes 1 and 3 are volunteers; scene 2 is recruited by Jesus.",
          "Scenes 2 and 3 both say 'first let me', both involve family, and both end with 'the kingdom of God', contrasting old life with the new life now on offer.",
          "There is progression: the first man offers unconditionally but must count the cost; the third seems to have counted it but has a specific condition.",
          "The similarities bind the passage together; the differences show each person must respond in his own way."
        ] }
      ]
    },
    {
      h: "Scene 1: 'Nowhere to lay his head'",
      blocks: [
        { t: "quote", text: "Foxes have holes and birds of the air have nests, but the Son of Man has nowhere to lay his head.", ref: "Luke 9:58" },
        { t: "p", text: "We usually take this to mean Jesus had nowhere to sleep: he slept rough, was poor and had a hard life. But this runs into problems." },
        { t: "compare", title: "Why the 'no bed' reading doesn't fit", cols: [
          { h: "The usual Western reading", items: ["'Lay my head' = go to sleep", "Jesus had no bed and slept in fields", "He was poor and homeless", "Disciples must accept rough living"] },
          { h: "What the evidence says", items: ["Middle Eastern hospitality would never leave a popular teacher without a roof", "Even near hostile Jerusalem he stayed with Mary, Martha and Lazarus at Bethany", "Wealthy women supported them (Luke 8:1-3)", "Their money bag was so full Judas could steal unnoticed (John 12:6; 13:29)"] }
        ] },
        { t: "p", text: "Jesus' own pictures give another clue. **Birds don't sleep in nests**; they roost in trees. They build nests to lay eggs and raise their young until they can fly. **Foxes sleep in dens**, but dig holes to give birth and raise their cubs. Nests and holes are places for **bringing up the next generation**." },
        { t: "term", word: "To lay one's head", lang: "Hebrew idiom", meaning: "An idiom about teaching, not sleeping: passing on what is in your head to someone else. It may also mean placing your 'headship', your direction and control, upon someone." },
        { t: "p", text: "The man had offered to 'follow' Jesus, meaning to become his disciple. And a rabbi raising disciples was like a father raising sons. So Jesus is speaking about his work as a rabbi. Unlike birds and foxes, he has no fixed 'nest' or 'hole' for raising his 'sons': **no formal school or classroom**." },
        { t: "p", text: "Matthew tells us this man was a teacher of the Law (Matthew 8:19). He may have expected Jesus to hold regular classes, like a couple of hours twice a week. Jesus warns him that true discipleship involves far more." },
        { t: "callout", kind: "insight", title: "Will you let him lay his head on you?", text: "The head tells the rest of the body what to do. Jesus is looking for people on whom to 'lay his head', those who will let his teaching control every part of life, not just walk behind him. 'You say you will follow me wherever. Will you let me direct everything you do?'" }
      ]
    },
    {
      h: "Scene 2: 'Let the dead bury their own dead'",
      blocks: [
        { t: "p", text: "Here Jesus takes the initiative and says 'Follow me'. The man replies, 'Lord, first let me go and bury my father' (Luke 9:59). Jesus ends with an emphatic command; the Greek stresses the 'you': 'as for you, you go and proclaim the kingdom of God' (Luke 9:60)." },
        { t: "p", text: "Jesus' answer sounds harsh only because we assume the father is dead or dying. In fact the father is **alive and well**, and the son is making an excuse." },
        { t: "term", word: "To bury one's father", lang: "Hebrew idiom", meaning: "The duty of a son to stay at home and care for his parents until they are laid to rest. It speaks of years of family obligation, not a funeral this week." },
        { t: "p", text: "So the man means: 'I'll go home now, and when my father dies some years from now and my duties are over, I'll think about following you.' It is a **delaying device** that puts the pressure back on Jesus. Yet Jesus' call overrides family ties. Let the 'dead', those with no interest in the kingdom, deal with such matters. The disciple is called into a new father-son relationship." },
        { t: "term", word: "Shivah", heb: "שִׁבְעָה", lang: "Hebrew", meaning: "'Seven'. The seven-day period of mourning after a death, when family members stay at home and receive visitors." },
        { t: "p", text: "The setting backs this up. If his father had just died, the man would be at home sitting shivah, not out on the road. If his father were dying, he would also be at home. The idiom is still used among Jewish people: 'Aren't you going to bury your father first?' may be asked of someone planning to move away. A father might say to a chosen son, 'I want you to bury me', meaning 'this will be your duty one day'. A childless man might say it to another young man: 'I look on you as a son.'" },
        { t: "callout", kind: "note", title: "An alternative explanation: two burials", text: "Jews buried the body on the day of death and then mourned for a week. A year later, when the flesh had decayed, the oldest son gathered the bones into a small chest (an ossuary) and placed it with the ancestors, perhaps in a family cave. This 'secondary burial' was popular in the first century but is no longer practised. The man may have been between the two burials. Jesus would not have endorsed this custom: it had no basis in Scripture, and a superstition had grown that the decaying flesh atoned for the dead person's sins. This view is possible but less likely than the idiom." },
        { t: "callout", kind: "warn", title: "Either way", text: "The man was making an excuse. And when it comes to following Jesus, there are no excuses!" }
      ]
    },
    {
      h: "Scene 3: Saying good-bye and the plough",
      blocks: [
        { t: "p", text: "The third man volunteers but adds a condition: 'First let me go back and say good-bye to my family' (Luke 9:61). Elisha was allowed to do this by Elijah (1 Kings 19:20), so why is Jesus so firm?" },
        { t: "term", word: "Apotasso", heb: "ἀποτάσσω", lang: "Greek", meaning: "Can mean 'say good-bye' but more usually 'take leave of', that is, ask permission to leave." },
        { t: "steps", title: "Middle Eastern etiquette of leaving", items: [
          { h: "The one leaving asks permission", d: "You do not just say good-bye and go." },
          { h: "Those staying decide", d: "They may agree, or refuse." },
          { h: "They say good-bye to you", d: "'God be with you' or 'God go with you' is said by those who stay." }
        ] },
        { t: "p", text: "Everyone listening knew what he meant: he must get his father's permission, and his father would very likely refuse to let him go off on such a questionable venture. A ready-made excuse! He is saying, 'My father's authority is higher than yours.' Jesus answers, in effect, 'My authority is higher', which makes sense once we remember the rabbi stood in the place of a father." },
        { t: "quote", text: "No-one who puts a hand to the plough and looks back is fit for service in the kingdom of God.", ref: "Luke 9:62" },
        { t: "cards", title: "Ploughing in Jesus' day", items: [
          { h: "One hand", d: "The light plough was guided with one hand, usually the left, to keep it upright, set its depth and lift it over stones." },
          { h: "The goad", d: "The other hand drove the oxen with a goad, an iron-tipped stick about two yards long." },
          { h: "Eyes fixed", d: "The ploughman stared at the furrow between the oxen's hindquarters." },
          { h: "Looking back = disaster", d: "He could break the plough on a rock, cut back into finished furrows, or gouge unploughed ground and make future work harder." }
        ] },
        { t: "p", text: "Ploughing took skill and total concentration, working in harmony with what was done and what was still to do. In the service of the kingdom, anything less than complete focus is not just unproductive but **destructive**." }
      ]
    },
    {
      h: "You are the man!",
      blocks: [
        { t: "p", text: "None of the three men is named. Why? **Because he is you and me.** We can put ourselves in each scene and ask: are these our excuses? The stories are not there to shame three individuals but to warn and challenge us." },
        { t: "p", text: "And we are never told how any of them responded. Jesus has the last word, and each story is left hanging, so that **we** complete the conversation with our own response. We should not assume they all walked away." },
        { t: "p", text: "The rich young man is similar (Matthew 19:16-22; Mark 10:17-22; Luke 18:18-25). He is unnamed, sincere and Torah-observant. He went away sad because he had great wealth. We assume he refused, but perhaps he was sad because he was about to do exactly what Jesus said! If that nameless man were you, what would you do?" },
        { t: "cycle", title: "The excuses we still make", center: "Follow me", hint: "Tap each excuse", items: [
          { h: "'I'll follow on my terms'", d: "Wanting a part-time, classroom faith rather than letting Jesus direct everything." },
          { h: "'Later, when duties end'", d: "Putting off discipleship until family obligations are over." },
          { h: "'I need permission'", d: "Letting another authority outrank Jesus' call." },
          { h: "'Just one look back'", d: "Divided focus that damages the work of the kingdom." }
        ] }
      ]
    },
    {"h": "Review flashcards", "blocks": [{"t": "flip", "title": "Test yourself", "items": [{"front": "'Nowhere to lay his head'", "back": "A teaching idiom: Jesus had no fixed 'school' for raising disciples (Luke 9:58)."}, {"front": "'First let me bury my father'", "back": "Let me wait until my living father dies, perhaps years from now (Luke 9:59)."}, {"front": "Shivah", "back": "The seven-day mourning period when family stay at home."}, {"front": "Apotasso", "back": "Greek: to take leave, i.e. ask permission to go."}, {"front": "Hand to the plough", "back": "Looking back ruins the furrow; kingdom service needs total focus (Luke 9:62)."}]}]}
  ],
  keypoints: [
    "Luke 9:57-62 sets three scenes side by side to show the cost of following Jesus.",
    "'Nowhere to lay his head' is a teaching idiom, not a statement of homelessness.",
    "Birds' nests and foxes' holes are for raising young; Jesus had no fixed 'school' for raising disciples.",
    "'Let me first bury my father' meant 'let me wait until my father dies, perhaps years from now'.",
    "Taking leave meant asking permission; the third man was using his father's authority as an excuse.",
    "A ploughman who looks back ruins the furrow; kingdom service needs complete focus.",
    "The men are unnamed and the endings left open so that we put ourselves in their place.",
    "When it comes to following Jesus, there are no excuses."
  ],
  quiz: [
    { q: "What does the Hebrew idiom 'to lay one's head' refer to?", options: ["Going to sleep", "Teaching and passing on instruction", "Dying and being buried", "Bowing in worship"], answer: 1, why: "It is an idiom about transferring what is in your head to others, and possibly placing your 'headship' on them." },
    { q: "In Luke 9:59, what was the man really saying by 'first let me go and bury my father'?", options: ["My father died this morning", "I must arrange a secondary burial today", "I will follow once my living father has died, perhaps years from now", "I need to borrow money for a funeral"], answer: 2, why: "The idiom refers to caring for parents until their death. It was a delaying excuse." },
    { q: "Why does Jesus' plough saying fit the third man?", options: ["He was a farmer by trade", "Looking back while ploughing ruins the work, just as divided loyalty harms kingdom service", "Ploughs were symbols of wealth", "Jesus wanted him to plough his father's field first"], answer: 1, why: "The ploughman needed complete focus; looking back could break the plough or spoil furrows." },
    { q: "Why are the three men left unnamed and their responses unrecorded?", options: ["The Gospel writers forgot", "So that readers can see themselves in the story and give their own response", "Because they were Gentiles", "Because all three rejected Jesus"], answer: 0, why: "Their anonymity lets us ask whether these are our excuses, and the open ending invites our answer." }
  ]
},

/* ===================== CHAPTER 4 ===================== */
{
  id: "j04-its-all-relative",
  title: "It's All Relative",
  summary: "Luke 14:26. Did Jesus really tell his disciples to hate their families? In Hebrew thinking 'love' and 'hate' can mean 'put first' and 'put second'.",
  sections: [
    {
      h: "A hard saying",
      blocks: [
        { t: "quote", text: "If anyone comes to me and does not hate father and mother, wife and children, brothers and sisters, yes, even life itself, such a person cannot be my disciple.", ref: "Luke 14:26" },
        { t: "p", text: "This verse puzzles many readers. It sounds harsh and unlike Jesus. It seems to contradict 'Honour your father and your mother' (Exodus 20:12) and Paul's call for husbands to love their wives (Ephesians 5:25, 28)." },
        { t: "p", text: "The parallel in Matthew 10:37 helps. There Jesus does not say 'hate'; he says whoever loves family members **more than me** is not worthy of me. In English these don't match: you can love your wife more than your cat without hating the cat! Something more is going on." },
        { t: "callout", kind: "insight", title: "The key", text: "Here love and hate are **not emotions but preferences**. They are about choices, a matter of the will rather than the heart. In Hebrew thinking, to love is to **put first**, and to hate is to **put second**. It's all relative!" }
      ]
    },
    {
      h: "'Love' and 'hate' across the Scriptures",
      blocks: [
        { t: "table", title: "The love/hate idiom in the Bible", head: ["Passage", "What it says", "What it means"], rows: [
          ["Malachi 1:2-3", "'I have loved Jacob, but Esau I have hated.'", "God's covenant choice: though Esau was born first, Jacob was put first to carry the promises made to Abraham and Isaac (Genesis 28, 35)."],
          ["Genesis 29:31", "Leah was 'hated' (literal Hebrew; KJV, ESV)", "Leah was loved, but less than Rachel (Genesis 29:30). 'Not loved' (NIV) is not quite accurate."],
          ["Deuteronomy 21:15-17", "A man with two wives, one loved and one 'hated'", "One wife is preferred, but the husband must still give the firstborn's rights to the true firstborn, even if he is the son of the less-loved wife."],
          ["Matthew 6:24", "'No-one can serve two masters... you will hate the one and love the other.'", "You cannot put God and Mammon (wealth) equally first; one will take second place."]
        ] },
        { t: "p", text: "The rich young man (Matthew 19:16-22) was in exactly this predicament. He was trying to love both God and his wealth, when he needed to learn how to 'hate'!" },
        { t: "callout", kind: "warn", title: "Not a lower commitment", text: "Knowing that 'hate' can mean 'love less' does not soften the call. Following Jesus still requires total commitment, especially where family is concerned." }
      ]
    },
    {
      h: "Jesus' mother and brothers",
      blocks: [
        { t: "p", text: "One busy day, Jesus' mother and brothers came to see him but could not get near because of the crowd (Matthew 12:46-50; Mark 3:31-35; Luke 8:20-21). When told, Jesus **pointed to his disciples** and said:" },
        { t: "quote", text: "Here are my mother and my brothers. For whoever does the will of my Father in heaven is my brother and sister and mother.", ref: "Matthew 12:49-50" },
        { t: "p", text: "This is often thought disrespectful, but we shouldn't assume he ignored them. He may have gone out to them soon after or welcomed them in. Nor was he shutting them out of his wider family; that depended on whether they too were committed to his heavenly Father." },
        { t: "p", text: "Jesus was doing what any rabbi would do: using what happened in front of him as a teaching moment. Rabbis always looked for illustrations close at hand, and pointing at the disciples while speaking was a typical rabbinic way of driving the lesson home. It was a positive lesson for the disciples, not a put-down of his family." },
        { t: "p", text: "Did Mary fully understand? Perhaps not at first. And his brothers did not yet believe he was the Messiah. Other mothers must have wondered about 'losing' their sons to Jesus' mission. Yet for Mary it ended happily:" },
        { t: "timeline", title: "Jesus' family comes into the bigger family", items: [
          { when: "During his ministry", h: "Outside the crowd", d: "Mother and brothers stand outside; Jesus speaks of a bigger family (Matthew 12:46-50)." },
          { when: "At the cross", h: "'Here is your son'", d: "Jesus entrusts Mary to John: 'Woman, here is your son... Here is your mother' (John 19:26-27)." },
          { when: "After the ascension", h: "Praying together", d: "Mary and his brothers join the apostles in prayer (Acts 1:14), likely among the 120 (Acts 1:15)." },
          { when: "Pentecost", h: "Filled with the Spirit", d: "They would go on to experience the Spirit's power (Acts 2:1-4)." }
        ] }
      ]
    },
    {
      h: "What the Mishnah says about disciples and families",
      blocks: [
        { t: "term", word: "Mishnah", heb: "מִשְׁנָה", lang: "Hebrew", meaning: "A major collection of the oral traditions from around the time of Jesus, written down around the start of the second century AD. It is divided into tractates." },
        { t: "p", text: "Most disciples were young, but some were married; people often married around eighteen. Peter was married, since Jesus healed his mother-in-law (Matthew 8:14-15). So what about a disciple's wife?" },
        { t: "cards", title: "Rabbi versus family in the Mishnah", items: [
          { h: "Thirty days (Ketubot 5:6)", d: "A disciple could leave home for up to thirty days to study with a rabbi, even against his wife's wishes. After that he needed her permission." },
          { h: "Rabbi before father (Baba Metzia 2:11)", d: "If both your father and your rabbi lost something or carried a burden, you helped your rabbi first. If both were taken captive, you ransomed your rabbi first." },
          { h: "The reason", d: "Your father brought you into this world; your rabbi gave you wisdom that brings you into the world to come." },
          { h: "One exception", d: "If your father was also your teacher, you could put him first." }
        ] },
        { t: "p", text: "This is a clear example of 'hating' in the Hebrew sense. It seems shocking only because we haven't grasped how strong the rabbi-disciple bond was. You could not be halfway in." },
        { t: "p", text: "The father-son pattern was an ancient privilege, perhaps going back to **Elijah**, who trained younger prophets. Translations often say 'the company of the prophets' (2 Kings 2:3, 5, 7, 15), but the Hebrew is '**sons of the prophets**'. And Elisha cried to Elijah, 'My father! My father!' (2 Kings 2:12)." }
      ]
    },
    {
      h: "'Even life itself', and 'Do you love me more than these?'",
      blocks: [
        { t: "p", text: "Jesus adds 'yes, even life itself'. This is not a call to self-hatred or to think our lives worthless, but to put ourselves and our self-interest second to discipleship." },
        { t: "p", text: "Our character, habits and attitudes are first shaped by our families. That 'umbilical cord' may pull against a rabbi who wants to form disciples in his own image. We may need to renounce some family ways and cut off their influence, but not by literal hating. We can keep loving and honouring our families while letting Jesus shape us differently." },
        { t: "quote", text: "Simon son of John, do you love me more than these?", ref: "John 21:15" },
        { t: "compare", title: "Who or what are 'these'?", cols: [
          { h: "The other disciples", items: ["'Do you love me more than these love me?'", "Peter had boasted he would never fall away even if all others did (Matthew 26:33; Mark 14:29)", "His humble answer shows he has learned not to make such claims"] },
          { h: "The fishing business", items: ["Peter had gone back to fishing", "'These' could be the fish or the boats", "If only we had seen where Jesus was pointing!"] }
        ] },
        { t: "callout", kind: "insight", title: "One thing is certain", text: "If Peter had not answered 'Yes, Lord', we could say that he 'hated' Jesus, in the Hebrew sense of putting him second." }
      ]
    },
    {"h": "Review flashcards", "blocks": [{"t": "flip", "title": "Test yourself", "items": [{"front": "Hebrew 'love' and 'hate'", "back": "To love = to put first; to hate = to put second. Preferences, not emotions."}, {"front": "Malachi 1:2-3", "back": "'Jacob I loved, Esau I hated': God's covenant choice of Jacob."}, {"front": "Leah 'hated'", "back": "Loved less than Rachel (Genesis 29:30-31)."}, {"front": "Mishnah, Baba Metzia 2:11", "back": "Ransom your rabbi before your father, unless your father is also your teacher."}, {"front": "'Sons of the prophets'", "back": "The Hebrew behind 'company of the prophets' in 2 Kings 2: the father-son pattern of discipleship."}]}]}
  ],
  keypoints: [
    "In Hebrew thinking, 'love' can mean 'put first' and 'hate' can mean 'put second'.",
    "Matthew 10:37 ('loves... more than me') explains Luke 14:26 ('hate').",
    "'Jacob I loved, Esau I hated' (Malachi 1:2-3) describes God's covenant choice, not an emotion.",
    "Leah was 'hated' only in the sense of being loved less than Rachel (Genesis 29:30-31).",
    "Jesus used his family's arrival as a teaching moment, pointing to his disciples as his family.",
    "The Mishnah put a disciple's rabbi above his father (Baba Metzia 2:11) and allowed 30 days' study away from his wife (Ketubot 5:6).",
    "The father-son pattern of discipleship goes back to Elijah and the 'sons of the prophets'.",
    "'Even life itself' means putting self-interest second, not self-loathing."
  ],
  quiz: [
    { q: "In Luke 14:26, what does 'hate' mean in its Hebrew sense?", options: ["To feel strong anger", "To put second, to love less", "To abandon completely", "To curse"], answer: 1, why: "Love and hate here are preferences, not emotions: to love is to put first, to hate is to put second." },
    { q: "What does Genesis 29:30-31 show about Leah being 'hated'?", options: ["Jacob had no feelings for her at all", "Jacob loved her, but loved Rachel more", "God was angry with Leah", "Leah hated Jacob"], answer: 1, why: "Genesis 29:30 says Jacob loved Rachel more than Leah. 'Hated' means she took second place." },
    { q: "According to the Mishnah (Baba Metzia 2:11), if both your father and your rabbi were taken captive, whom should you ransom first?", options: ["Your father, always", "Whoever is older", "Your rabbi, unless your father was also your teacher", "Neither; you should pray instead"], answer: 2, why: "Your rabbi gives you wisdom for the world to come, so he came first, with the exception of a father who was also your teacher." },
    { q: "What does the Hebrew behind 'the company of the prophets' (2 Kings 2) literally say?", options: ["Sons of the prophets", "Servants of the prophets", "Friends of the prophets", "Students of the Law"], answer: 0, why: "The Hebrew is 'sons of the prophets', reflecting the father-son pattern of discipleship." },
    { q: "Why did Jesus point to his disciples and say 'Here are my mother and my brothers'?", options: ["To reject his family publicly", "Because he did not recognise his family", "As a rabbi using a moment at hand to teach his disciples", "Because his family had asked him to stop teaching"], answer: 2, why: "Rabbis used what was at hand to teach; pointing to the disciples reinforced a positive lesson about the family of those who do the Father's will." }
  ]
},

/* ===================== CHAPTER 5 ===================== */
{
  id: "j05-betrayal",
  title: "Betrayal!",
  summary: "Matthew 26:20-25; John 18:17, 25. Everyone knows Judas betrayed Jesus. But in a rabbi-disciple world, Peter's denial was also a betrayal. Comparing the two shows the way back.",
  sections: [
    {
      h: "Judas: not 'whodunnit?' but why",
      blocks: [
        { t: "p", text: "At the Last Supper Jesus announces that one of the Twelve will betray him and reveals who (Matthew 26:20-25). But the Gospels tell us long before. Again and again Judas is 'the one who would betray him' (John 6:71; 12:4; Mark 14:10; Luke 22:4; John 18:2, 5). Even the lists of the apostles give the big spoiler: Judas 'the traitor' (Luke 6:16), 'who betrayed him' (Matthew 10:4; Mark 3:19)." },
        { t: "p", text: "So the mystery is not who, but **why**. Given what we know of the rabbi-disciple bond, how could any disciple turn against his rabbi? And was this the only betrayal in the Gospels? Some say there were **two**, and the second culprit is less obviously flagged." },
        { t: "quote", text: "Then Judas, the one who would betray him, said, 'Surely not I, Rabbi?' Jesus answered, 'Yes, it is you.'", ref: "Matthew 26:25" },
        { t: "p", text: "Judas seems genuinely surprised, even after he had arranged with the chief priests to 'hand Jesus over' for money (Matthew 26:14-16). Perhaps he did not think what he was doing was a betrayal." },
        { t: "callout", kind: "note", title: "One suggested explanation", text: "All the disciples misunderstood Jesus to some degree, but Judas more so, and with worse results. Seeing the clash with the authorities building, he may have tried to force Jesus' hand and kick-start the revolt he thought Jesus planned. In his mind he was helping his rabbi. When Jesus did not fight back and was condemned, Judas was seized with remorse: 'I have sinned, for I have betrayed innocent blood' (Matthew 27:3)." },
        { t: "p", text: "We cannot ignore that Satan prompted Judas (John 13:2), or that the betrayal was foretold and part of God's plan. There are deep mysteries here." }
      ]
    },
    {
      h: "Peter: a denial that was a betrayal",
      blocks: [
        { t: "p", text: "The second betrayer is none other than **Peter**. We know he denied Jesus; Matthew even says 'disown' (Matthew 26:34). But a Jewish reader would see something more serious still: **betrayal**." },
        { t: "compare", title: "How the challenge to Peter is worded", cols: [
          { h: "Matthew, Mark, Luke", items: ["'You were with Jesus'", "'You are one of them'"] },
          { h: "John 18:17, 25", items: ["'You aren't one of this man's **disciples** too, are you?'", "Peter: 'I am not.'"] }
        ] },
        { t: "p", text: "Peter was not just denying a friendship or that he knew Jesus. He was **publicly disowning his rabbi**. The bond was closer than family. For three years Peter's identity and whole life were wrapped up in it." },
        { t: "steps", title: "Why it felt like the end for Peter", items: [
          { h: "The worst insult", d: "Disowning your rabbi, especially in his hour of greatest need, was the deepest betrayal." },
          { h: "He wept bitterly", d: "Not just upset: it had wrecked everything (Matthew 26:75)." },
          { h: "No longer a disciple", d: "In his own mind, and in others', he could no longer be counted a disciple. In his eyes it was worse than what Judas did." },
          { h: "No way back", d: "So Peter believed." }
        ] },
        { t: "quote", text: "But go, tell his disciples and Peter...", ref: "Mark 16:7" },
        { t: "p", text: "Why is Peter named separately by the angel at the empty tomb? Perhaps because he was no longer counted among the disciples, at least in others' minds. Otherwise the women might have told the rest but not him." }
      ]
    },
    {
      h: "Peter restored: 'Follow me!'",
      blocks: [
        { t: "p", text: "This makes John 21 powerful. We call it 'the restoration of Peter', but we only grasp the restoration when we see what was broken. Only John records it, and without it the start of Acts makes no sense: there Peter is back among the disciples, leading and preaching. How did that happen?" },
        { t: "flow", title: "John 21: the road back", nodes: [
          { h: "Back to fishing", d: "Peter returns to what he knows, feeling he no longer belongs" },
          { h: "Jesus on the shore", d: "A huge catch of fish" },
          { h: "A charcoal fire", d: "Like the one he warmed himself at when he betrayed Jesus" },
          { h: "Three questions", d: "'Do you love me?' echoing three denials" },
          { h: "'Follow me!'", d: "The call to discipleship renewed" }
        ] },
        { t: "p", text: "The key words are easily missed: **'Follow me!'** (John 21:19). Peter had first heard them by the lake years before (Matthew 4:19). It was the familiar call of a rabbi to a disciple. He could hardly believe his ears, but when Jesus repeated it, 'You must follow me' (John 21:22), Peter knew he could be a disciple again." }
      ]
    },
    {
      h: "Two betrayals compared",
      blocks: [
        { t: "compare", title: "Judas and Peter", cols: [
          { h: "Judas", items: ["Flagged as betrayer from the start", "Handed Jesus over for silver, with a kiss", "Remorseful, but saw no tomorrow", "Went away and hanged himself (Matthew 27:5)", "Denied his rabbi's teaching on forgiveness, loving enemies and God's mercy to the repentant", "Never gave Jesus a chance to restore him"] },
          { h: "Peter", items: ["Denial not flagged in the same way", "Publicly disowned his rabbi", "Went out and wept bitterly", "Returned to fishing, but stayed among the disciples", "Still trusted what his rabbi had taught, even in despair", "Restored with 'Follow me!'"] }
        ] },
        { t: "p", text: "In the end Judas' betrayal went further than the thirty pieces of silver or the kiss. By taking his own life he betrayed **what his rabbi had taught**. Would Jesus have forgiven and restored Judas? We might think it unlikely, but can we be sure? Judas did not believe it possible. Peter had listened more carefully, and his rabbi's words stayed with him in his deepest despair." },
        { t: "callout", kind: "insight", title: "Reassurance for us", text: "Jesus knew about both betrayals beforehand, and said so in a way that both men and the others would realise he knew. He knows what we are like before we do. And he prayed for Peter that his faith would not fail, so that he would turn back and strengthen the others (Luke 22:32). Without that prayer, might Peter too have given up?" },
        { t: "p", text: "With his discipleship restored, Peter could become the rock on which Jesus would build (Matthew 16:18), which the next chapter explores." }
      ]
    },
    {"h": "Review flashcards", "blocks": [{"t": "flip", "title": "Test yourself", "items": [{"front": "Peter's question in John", "back": "'You aren't one of this man's disciples, are you?' 'I am not' (John 18:17, 25)."}, {"front": "Why was Peter's denial a betrayal?", "back": "He publicly disowned his rabbi, the deepest insult a disciple could give."}, {"front": "'Tell his disciples and Peter'", "back": "Mark 16:7: perhaps Peter was no longer counted a disciple."}, {"front": "The key words of Peter's restoration", "back": "'Follow me!' (John 21:19, 22)."}, {"front": "Jesus' prayer for Peter", "back": "That his faith would not fail (Luke 22:32)."}]}]}
  ],
  keypoints: [
    "The Gospels name Judas as betrayer from the start; the real question is why he did it.",
    "One suggestion: Judas tried to force Jesus into a revolt and did not see it as betrayal.",
    "In John, Peter is asked if he is Jesus' disciple and says 'I am not': a public disowning of his rabbi.",
    "To a Jewish reader, disowning your rabbi was a betrayal, worse than an ordinary denial.",
    "The angel's 'tell his disciples and Peter' (Mark 16:7) hints Peter was no longer counted a disciple.",
    "In John 21 Jesus restores Peter with the rabbi's call: 'Follow me!'",
    "Judas despaired and betrayed his rabbi's teaching on forgiveness; Peter held on to it.",
    "Jesus prayed for Peter's faith not to fail (Luke 22:32)."
  ],
  quiz: [
    { q: "Why does John's account make Peter's denial look like a betrayal?", options: ["Peter is accused of stealing", "Peter is asked if he is one of Jesus' disciples and says 'I am not'", "Peter takes money from the priests", "Peter attacks a servant with a sword"], answer: 1, why: "Denying being his disciple was publicly disowning his rabbi, a deep betrayal in that culture." },
    { q: "Why might the angel have said 'tell his disciples and Peter' (Mark 16:7)?", options: ["Peter was the oldest disciple", "Peter had already left Jerusalem", "Peter was perhaps no longer counted among the disciples", "The angel did not know Peter's name"], answer: 2, why: "After his betrayal Peter may have been seen, and saw himself, as no longer a disciple." },
    { q: "What are the 'key words' of Peter's restoration in John 21?", options: ["'Follow me!'", "'Peace be with you'", "'Do not be afraid'", "'Go and sin no more'"], answer: 0, why: "'Follow me!' (John 21:19, 22) was the rabbi's call to discipleship Peter first heard at the lake." },
    { q: "According to this study, how did Judas' end deepen his betrayal?", options: ["He spent the silver on a field", "He ran away to Galilee", "He joined the Romans", "By taking his life he denied his rabbi's teaching on forgiveness and mercy"], answer: 3, why: "Judas saw no hope and did not give Jesus a chance to restore him." }
  ]
},

/* ===================== CHAPTER 6 ===================== */
{
  id: "j06-whats-in-a-name",
  title: "What's in a Name?",
  summary: "Matthew 16:17-19. Peter, the rock, the keys of the kingdom, and binding and loosing: one of the most Hebraic passages in the New Testament, explained through its setting and its Old Testament echoes.",
  sections: [
    {
      h: "Peter's confession",
      blocks: [
        { t: "p", text: "Everything here flows from Peter's confession that Jesus is 'the Messiah, the Son of the living God' (Matthew 16:16), or 'God's Messiah' (Luke 9:20). Jesus says this did not come from 'flesh and blood' but from his Father in heaven." },
        { t: "term", word: "Flesh and blood", lang: "Hebrew idiom", meaning: "An idiomatic way of saying 'human beings, mankind'. Peter's insight did not come from any human teacher." },
        { t: "p", text: "This was a fresh, supernatural revelation. Then Jesus spoke personally to Peter in the hearing of the others, words that have stirred much debate, beginning with the name change from Simon to Peter." },
        { t: "quote", text: "And I tell you that you are Peter, and on this rock I will build my church, and the gates of Hades will not overcome it.", ref: "Matthew 16:18" }
      ]
    },
    {
      h: "Petros and petra: who or what is the rock?",
      blocks: [
        { t: "compare", title: "Two traditional views", cols: [
          { h: "The rock is Peter", items: ["Mainly Catholic and Orthodox traditions", "Peter is the rock Jesus builds on"] },
          { h: "The rock is the revelation", items: ["Mainly Protestant and evangelical traditions", "The focus shifts from the man to his confession of who Jesus is", "The church is built on that faith"] }
        ] },
        { t: "p", text: "Faith in Jesus as Messiah and Son of God is certainly essential. But it is also reasonable to see Peter personally singled out: as a leading apostle he would be a major part of the rock on which Jesus builds, without this making him a Pope or Bishop of Rome!" },
        { t: "term", word: "Petros / Petra", heb: "Πέτρος / πέτρα", lang: "Greek", meaning: "Petros: a smaller piece of rock, a loose stone or at most a boulder (Peter's name). Petra: bedrock, a massive rock formation." },
        { t: "p", text: "These Greek words may have entered Hebrew as **loanwords**, just as English uses French words like 'souvenir', 'etiquette' and 'déjà vu', and French uses 'le weekend'. Petros was, or soon became, used in names of Hebrew people and places. So Jesus may have used these very words in his pun, or something similar in Hebrew." },
        { t: "callout", kind: "insight", title: "A little bit of something much bigger", text: "Peter is a petros, a piece of rock; the petra is the bedrock. Peter would be a small part of something far bigger." }
      ]
    },
    {
      h: "Look where Jesus was standing: Caesarea Philippi",
      blocks: [
        { t: "p", text: "'You are Peter, and on you I will build' would have been clear. 'On **this** rock' is ambiguous. If only we had been there to see where Jesus was looking or pointing! Rabbis illustrated their teaching from what was visible, and deliberately took disciples to places that reinforced the lesson." },
        { t: "cards", title: "The setting", items: [
          { h: "Far north", d: "The region of Caesarea Philippi, near the ancient city of Dan." },
          { h: "Pagan stronghold", d: "Dedicated to the god Pan, with a temple and caves." },
          { h: "A wall of rock", d: "A massive cliff over 30 metres high and 150 metres wide, with the city built on top." },
          { h: "'Gates of Hades'", d: "The caves were thought to be an entrance to the underworld and were called 'the gates of Hades'." }
        ] },
        { t: "p", text: "The whole scene illustrated what Jesus said. We can imagine him looking at Petros, then up at the petra, then back at Petros. What Jesus would build, a spiritual building not a physical one, would be stronger than anything here, and Peter would play a major part. Would he be solid enough for the spiritual battle? After his revelation, Jesus believed so, enough to give him a new name." }
      ]
    },
    {
      h: "The rock from which you were cut: Abraham",
      blocks: [
        { t: "p", text: "Jesus was doing more than making a pun. Rabbis dropped single words that pointed to a Scripture, and disciples were expected to pick them up. 'Rock' would bring to mind:" },
        { t: "quote", text: "Look to the rock from which you were cut and to the quarry from which you were hewn; look to Abraham, your father, and to Sarah, who gave you birth.", ref: "Isaiah 51:1-2" },
        { t: "p", text: "Peter would have been thrilled: 'Jesus is comparing me to Abraham, the father of many nations! I can be a rock for him, as Abraham was for God at the start of our history.'" },
        { t: "term", word: "Midrash", heb: "מִדְרָשׁ", lang: "Hebrew", meaning: "A Jewish commentary on a biblical text, often using stories and parables to draw out meaning. Also an application of a teaching that goes beyond the text but stays in line with it." },
        { t: "steps", title: "A later rabbinic midrash: the king and the rock (Yalkut Shimoni on Numbers 23:9)", items: [
          { h: "A king wants to build a palace", d: "He digs for solid rock to lay foundations but finds only mire." },
          { h: "He keeps digging", d: "Site after site, always mud. He does not give up." },
          { h: "He strikes rock", d: "'Here I will build,' he says, and lays foundations." },
          { h: "God and the world", d: "Before creating the world, God looked at the wicked generations of Enosh and the Flood: 'How can I create the world when they will provoke me?'" },
          { h: "God sees Abraham", d: "'Here I have found solid rock on which I can build and lay the world's foundations.'" }
        ] },
        { t: "p", text: "God looked down the line, saw Abraham, and knew to go ahead: here was someone to partner with to put things right. Is this how Jesus now saw Peter?" }
      ]
    },
    {
      h: "The keys of the kingdom",
      blocks: [
        { t: "p", text: "Jesus then promises Peter 'the keys of the kingdom of heaven' (not of any gates, pearly or otherwise!). Keys are a symbol of **trust**: whoever holds them is reliable and responsible. The word 'keys' would point Peter to two Old Testament passages." },
        { t: "table", title: "Keys in the Scriptures and Jewish tradition", head: ["Source", "Story", "Lesson"], rows: [
          ["Isaiah 22:15-22", "Shebna, a proud palace official, carved himself a showy rock-tomb. He was removed, and humble, faithful Eliakim received 'the key of the house of David'.", "Keys go to the faithful steward. Jesus later applies 22:22 to himself: 'What he opens no-one can shut' (Revelation 3:7)."],
          ["1 Chronicles 9:22-27", "Four chief gatekeepers of the Temple stayed at their posts overnight and held the key to open God's house each morning.", "Key-holders carry special trust and responsibility."],
          ["Rabbinic story (first Temple)", "Failed key-keepers threw the keys up to heaven saying, 'Let these keys be given back to you', and a large hand received them.", "God is the true owner of the keys."],
          ["2 Baruch 10:18 (second Temple, early 2nd century AD)", "'You priests, take the keys of the sanctuary and throw them up to heaven... for we have been found to be false stewards.'", "God gives keys only to the faithful and trustworthy."]
        ] },
        { t: "p", text: "Jesus was declaring that Peter merited this kind of trust in the community Jesus would build. What would that look like in practice? That depends on one more idiom." }
      ]
    },
    {
      h: "Binding and loosing, and a new name",
      blocks: [
        { t: "term", word: "Binding and loosing", lang: "Rabbinic idiom", meaning: "Teachers of the Law made rulings on how to apply God's commands. To bind = to forbid. To loose = to permit." },
        { t: "callout", kind: "warn", title: "Not about demons", text: "These words are often lifted out of Matthew 16:19 and used for 'spiritual warfare'. That is misguided at best and dangerous at worst. 'Bind' is used elsewhere of tying up a strong man (Matthew 12:29), but as a pair with 'loose' it has nothing to do with demons. Would we want anyone to loose demons?!" },
        { t: "p", text: "For example: what work is allowed on the Sabbath? Rabbis 'bound' (forbade) some things and 'loosed' (allowed) others. We never say 'I bind you from walking on the grass' or 'I loose you to copy my picture', but Peter would have understood at once." },
        { t: "quote", text: "Whatever you bind on earth will be bound in heaven, and whatever you loose on earth will be loosed in heaven.", ref: "Matthew 16:19" },
        { t: "p", text: "A new name meant a new start and a new resolve. The keys meant a position of trust. And part of that was **making decisions** for the new community, situations unlike any before, where even his Scriptures might not give a ready answer. What a burden! So Jesus reassured him: his rulings would have heaven's backing. Not that God would rubber-stamp whatever Peter decided, but that God would guide him to get it right. The footnote translation, 'will **have been** bound... loosed in heaven', is probably more accurate." },
        { t: "callout", kind: "insight", title: "'Fear not, Peter'", text: "Fear can paralyse us with indecision or rush us into wrong choices. Jesus was saying: 'You will get it right. Even though I won't be around, I'll make sure of that.'" },
        { t: "p", text: "A name change in the Bible is always significant. We now call him Peter even when describing events before the name change. Yet in John 21:15-17, before restoring him, Jesus three times called him by his old name, '**Simon son of John**'. Peter would have remembered the last time Jesus called him that (Matthew 16:17) and how far he had fallen. But it would not be long before he was 'the rock' again. What's in a name? A lot, when it's Peter." },
        { t: "list", title: "In summary, Peter would...", items: [
          "be solid as a rock, a founding part of something far bigger than he imagined;",
          "reliably 'lock and unlock' situations otherwise beyond his understanding;",
          "make complex decisions guaranteed to be in line with God's will."
        ] }
      ]
    },

        { t: "p", text: "Did the other disciples feel left out when Jesus spoke to Peter? Just two chapters later, in Matthew 18, the fourth of Matthew's five teaching blocks, Jesus repeats to **all** of them what he had said to Peter about binding and loosing (Matthew 18:18). Any apostle might be called on to interpret Scripture, settle disputes and find answers in a crisis." },

          { when: "Acts 6:1-6", h: "The widows and the Seven", d: "Some widows were overlooked in the daily food distribution. Seven were appointed to care for them so the apostles could focus on prayer and the word. A less obvious case of binding and loosing." },

    {

      blocks: [
        { t: "quote", text: "Again, truly I tell you that if two of you on earth agree about anything they ask for, it will be done for them by my Father in heaven. For where two or three gather in my name, there am I with them.", ref: "Matthew 18:19-20" },
        { t: "p", text: "These verses are often quoted on their own, especially verse 20 when the prayer meeting is small: 'Never mind, at least Jesus is here!' Do they stand alone or belong with verses 15-18?" },
        { t: "compare", title: "Do verses 19-20 stand alone?", cols: [
          { h: "Yes, a general promise", items: ["'Again' marks a fresh start", "'Anything' or 'whatever' widens what may be asked for"] },
          { h: "No, they belong to vv. 15-20", items: ["Such a short section is more likely linked to nearby verses", "'Two or three' (v. 20) points back to v. 16: you plus 'one or two others'", "This follows Deuteronomy 19:15: 'a matter must be established by the testimony of two or three witnesses'", "Peter's next question (v. 21) is about forgiving a brother who sins, continuing the theme from v. 15"] }
        ] },
        { t: "p", text: "So the matter agreed upon in verse 19 is the discipline of an unrepentant brother or sister. The two or three who judge the issue meet in Jesus' name, can ask him for whatever they need to reach the right decision, and can trust that their judgement, for or against the brother, will match God's will." },
        { t: "callout", kind: "insight", title: "Confidence for a heavy task", text: "How discipline is done, and seen to be done, matters as much as the outcome. Discipline, forgiveness and restoration carry huge, sometimes ruinous consequences. Those deciding could feel overwhelmed: 'What if we get it wrong?' Jesus gives them and the whole community confidence in the process." },
        { t: "p", text: "Of course Jesus is with us in prayer meetings and Bible studies, usually through the Spirit. But the personal 'there am I with them' here is meant for serious cases of sin between believers. In Jewish practice, a wider application in line with the text, a **midrash**, is sometimes allowed, so perhaps some allowance can be made. The danger is that the lesser use becomes the norm and the original meaning is lost. Taking it seriously would mean practising church discipline as Jesus taught, something most churches would rather avoid." }

    {

        { t: "term", word: "Shekinah", heb: "שְׁכִינָה", lang: "Hebrew", meaning: "The manifest, dwelling presence of God." },
        { t: "p", text: "Some see Jesus' words as echoing the minyan: but here it is not ten, as in a synagogue, but **two or three, plus Jesus himself**. Early rabbinic writings contain striking parallels:" },

        { t: "p", text: "The simple explanation: he didn't say 'church'! The word does not translate the Greek text or anything Jesus would have said in Hebrew. This study argues that it was imposed on English Bibles in the King James Version to support the Church of England, of which the king was head. Earlier translations, such as Tyndale's, used 'congregation' or 'assembly'. The King James Version drew heavily on Tyndale but, by royal rule, used traditional church words; 'church' was the third of fifteen such rules. The motive was political." },

        { t: "p", text: "The next chapter looks at the rest of Matthew 18, where Peter picks up the theme of a brother who sins and needs forgiveness." }

  var s = store.get("scheme", null);
  if (s) document.documentElement.setAttribute("data-scheme", s); else document.documentElement.removeAttribute("data-scheme");
  document.documentElement.style.setProperty("--fs", store.get("fs", 17) + "px");
  var meta = $('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", getComputedStyle(document.body).getPropertyValue("--bg").trim() || "#EDF1F7");
}

/* ---------- progress ---------- */
function done(){ return store.get("done", {}); }
function markDone(key){ var d = done(); d[key] = 1; store.set("done", d); }
function bookPct(b){ var d = done(), n = 0; b.chapters.forEach(function(c){ if (d[b.id+"/"+c.id]) n++; }); return Math.round(100*n/Math.max(1,b.chapters.length)); }

/* ---------- shell ---------- */
function shell(){
  document.body.insertAdjacentHTML("afterbegin",
    '<div class="progressline" id="pl"></div>'+
    '<header class="bar">'+
      '<a class="brand" href="#/" aria-label="Home">'+
        '<svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--accent)"/><path d="M20 11v19M10 13v4a10 10 0 0 0 20 0v-4M15 13v4a5 5 0 0 0 10 0v-4M14 31h12" stroke="var(--accent-ink)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>'+
        '<span>Roots &amp; Branches</span></a>'+
      '<button class="iconbtn" id="b-search" aria-label="Search">'+I.search+'<span class="lbl">Search</span></button>'+

      '<input class="search-input" id="q" type="search" placeholder="Search every chapter, e.g. Passover, Shema, seven seals" autocomplete="off">'+
      '<div class="results" id="results"></div>'+

    '<div class="toast" id="toast" role="status"></div>');
  document.body.insertAdjacentHTML("beforeend", '<footer>A study companion on the Jewish roots of the Christian faith. Works offline once downloaded.</footer>');

  $("#swatches").innerHTML = SCHEMES.map(function(s){
    return '<button class="swatch" data-s="'+s.id+'"><span class="dots">'+s.c.map(function(c){return '<i style="background:'+c+'"></i>';}).join("")+'</span>'+s.name+'</button>';
  }).join("");
  $("#fsseg").innerHTML = [[15,"Small"],[17,"Medium"],[19,"Large"],[21,"Huge"]].map(function(f){ return '<button data-fs="'+f[0]+'">'+f[1]+'</button>'; }).join("");
  function syncTheme(){
    var cur = store.get("scheme", null) || (matchMedia("(prefers-color-scheme: dark)").matches ? "midnight" : "tekhelet");
    $$("#swatches .swatch").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.s === cur); });
    $$("#fsseg button").forEach(function(b){ b.setAttribute("aria-pressed", +b.dataset.fs === store.get("fs",17)); });
  }
  $("#swatches").addEventListener("click", function(e){ var b = e.target.closest(".swatch"); if(!b) return; store.set("scheme", b.dataset.s); applyTheme(); syncTheme(); });
  $("#fsseg").addEventListener("click", function(e){ var b = e.target.closest("button"); if(!b) return; store.set("fs", +b.dataset.fs); applyTheme(); syncTheme(); });
  function openSheet(id){ $("#"+id).classList.add("open"); syncTheme(); if (id==="s-search") setTimeout(function(){ $("#q").focus(); }, 50); }

function toast(msg){ var t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 2600); }

/* ---------- download: saves this whole app as one offline file ---------- */
var PRISTINE = null;
function download(){
  var html = "<!DOCTYPE html>\n" + PRISTINE;
  var blob = new Blob([html], {type:"text/html"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "roots-and-branches.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast("Saved roots-and-branches.html. Open it on any device, even offline.");
}

/* ---------- search ---------- */
var INDEX = [];
function buildIndex(){
  BOOKS.forEach(function(b){ b.chapters.forEach(function(c){
    var parts = [c.title, c.summary];
    (c.sections||[]).forEach(function(s){ parts.push(s.h); (s.blocks||[]).forEach(function(k){ parts.push(blockText(k)); }); });
    (c.keypoints||[]).forEach(function(k){ parts.push(k); });
    INDEX.push({b:b, c:c, text: plain(parts.join(" • "))});
  }); });
}
function blockText(k){
  var out = [];
  (function walk(o){ if (o == null) return; if (typeof o === "string") out.push(o); else if (Array.isArray(o)) o.forEach(walk); else if (typeof o === "object") Object.keys(o).forEach(function(key){ if (key !== "t" && key !== "kind") walk(o[key]); }); })(k);
  return out.join(" ");
}
function search(q){
  q = q.trim(); var r = $("#results");
  if (q.length < 2){ r.innerHTML = '<p style="color:var(--muted);font-size:.9rem;margin:6px 4px">Type at least two letters.</p>'; return; }
  var ql = q.toLowerCase(), hits = [];
  INDEX.forEach(function(it){
    var i = it.text.toLowerCase().indexOf(ql); if (i < 0) return;
    var s = Math.max(0, i-60), snip = it.text.slice(s, i+q.length+80);
    hits.push('<a href="#/'+it.b.id+'/'+it.c.id+'"><b>'+esc(it.c.title)+'</b><small>'+esc(it.b.short)+'</small><small>…'+esc(snip).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"), function(m){return "<mark>"+m+"</mark>";})+'…</small></a>');
  });
  r.innerHTML = hits.length ? hits.slice(0,30).join("") : '<p style="color:var(--muted);font-size:.9rem;margin:6px 4px">No chapter mentions “'+esc(q)+'”. Try a shorter word.</p>';
}

/* ---------- block renderers ---------- */
function title(k, icon){ return k.title ? '<div class="blk-title">'+(icon||I.diagram)+md(k.title)+'</div>' : ""; }
var R = {
  p: function(k){ return '<p>'+md(k.text)+'</p>'; },
  list: function(k){ return title(k, I.bulb)+'<ul>'+k.items.map(function(i){ return '<li>'+md(i)+'</li>'; }).join("")+'</ul>'; },
  callout: function(k){ var kind = k.kind || "insight"; return '<div class="callout '+kind+'">'+(kind==="insight"?I.bulb:I.note)+'<div>'+(k.title?'<b>'+md(k.title)+'</b>':"")+'<p>'+md(k.text)+'</p></div></div>'; },
  quote: function(k){ return '<blockquote class="quote">'+md(k.text)+(k.ref?'<cite>'+esc(k.ref)+'</cite>':"")+'</blockquote>'; },
  term: function(k){ return '<div class="term"><div><span class="w">'+esc(k.word)+'</span>'+(k.heb?'<span class="heb">'+esc(k.heb)+'</span>':"")+'</div><div><p class="m">'+md(k.meaning)+'</p>'+(k.lang?'<small>'+esc(k.lang)+'</small>':"")+'</div></div>'; },
  flow: function(k){
    return title(k)+'<div class="flow">'+k.nodes.map(function(n, i){
      var h = typeof n === "string" ? md(n) : md(n.h) + (n.d ? '<small>'+md(n.d)+'</small>' : "");
      return (i ? '<div class="arrow" aria-hidden="true">'+I.arrow+'</div>' : "") + '<div class="node">'+h+'</div>';
    }).join("")+'</div>';
  },
  steps: function(k){ return title(k)+'<div class="steps"><div class="fill"></div>'+k.items.map(function(s, i){ return '<div class="step"><span class="dot">'+(i+1)+'</span><b>'+md(s.h)+'</b>'+(s.d?'<p>'+md(s.d)+'</p>':"")+'</div>'; }).join("")+'</div>'; },
  compare: function(k){ return title(k)+'<div class="compare" style="--cols:'+k.cols.length+'">'+k.cols.map(function(c){ return '<div class="col"><h4>'+md(c.h)+'</h4><ul>'+c.items.map(function(i){return '<li>'+md(i)+'</li>';}).join("")+'</ul></div>'; }).join("")+'</div>'; },
  timeline: function(k){ return title(k)+'<div class="timeline">'+k.items.map(function(t){ return '<div class="tl">'+(t.when?'<span class="when">'+esc(t.when)+'</span>':"")+'<b>'+md(t.h)+'</b>'+(t.d?'<p>'+md(t.d)+'</p>':"")+'</div>'; }).join("")+'</div>'; },
  cards: function(k){ return title(k)+'<div class="cards">'+k.items.map(function(c){ return '<div class="card"><b>'+md(c.h)+'</b><p>'+md(c.d||"")+'</p></div>'; }).join("")+'</div>'; },
  table: function(k){ return title(k)+'<div class="tbl"><table><thead><tr>'+k.head.map(function(h){return '<th>'+md(h)+'</th>';}).join("")+'</tr></thead><tbody>'+k.rows.map(function(r){ return '<tr>'+r.map(function(c){return '<td>'+md(c)+'</td>';}).join("")+'</tr>'; }).join("")+'</tbody></table></div>'; },
  flip: function(k){ return title(k, I.quiz)+'<div class="flips">'+k.items.map(function(f){ return '<button class="flip" aria-pressed="false"><span class="inner"><span class="face front">'+md(f.front)+'<small>Tap to reveal</small></span><span class="face back">'+md(f.back)+'</span></span></button>'; }).join("")+'</div>'; },
  tree: function(k){
    function kids(arr){ return arr && arr.length ? '<ul>'+arr.map(function(n){ if (typeof n === "string") n = {h:n}; return '<li><span class="tn">'+md(n.h)+(n.d?'<small>'+md(n.d)+'</small>':"")+'</span>'+kids(n.children)+'</li>'; }).join("")+'</ul>' : ""; }
    return title(k, I.map)+'<div class="tree"><span class="troot">'+md(k.root)+'</span>'+kids(k.children)+'</div>';
  },
  cycle: function(k){
    var n = k.items.length, uid = "cy"+Math.random().toString(36).slice(2,7);
    var nodes = k.items.map(function(it, i){
      var a = -Math.PI/2 + i*2*Math.PI/n, x = 50 + 35*Math.cos(a), y = 50 + 36*Math.sin(a);
      return '<button class="cnode" style="left:'+x.toFixed(2)+'%;top:'+y.toFixed(2)+'%" data-i="'+i+'" aria-pressed="false">'+md(it.h)+'</button>';
    }).join("");
    return title(k)+'<div class="cycle" id="'+uid+'" data-items="'+esc(JSON.stringify(k.items))+'"><svg class="ring-svg" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-path" cx="50" cy="50" r="35.5"/></svg>'+nodes+'<div class="center"><b>'+md(k.center||"Tap a circle")+'</b><span>'+md(k.hint||"Each one opens its meaning here.")+'</span></div></div>';
  }
};
function renderBlock(k){
  var f = R[k.t]; if (!f) return "";
  var cls = k.t === "p" ? "" : " reveal";
  return k.t === "p" ? f(k) : '<div class="blk'+cls+'">'+f(k)+'</div>';
}

/* ---------- interactions inside content ---------- */
var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
  es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
}, {rootMargin:"0px 0px -8% 0px"}) : null;
function wire(root){
  $$(".reveal", root).forEach(function(el){ if (io) io.observe(el); else el.classList.add("in"); });
  $$(".flip", root).forEach(function(b){ b.onclick = function(){ b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); }; });
  $$(".cycle", root).forEach(function(c){
    var items = JSON.parse(c.dataset.items), center = $(".center", c);
    c.addEventListener("click", function(e){
      var b = e.target.closest(".cnode"); if (!b) return;
      $$(".cnode", c).forEach(function(x){ x.setAttribute("aria-pressed", x === b); });
      var it = items[+b.dataset.i];
      center.innerHTML = '<b>'+md(it.h)+'</b><span>'+md(it.d||"")+'</span>';
      center.animate && center.animate([{opacity:0, transform:"translate(-50%,-46%)"},{opacity:1, transform:"translate(-50%,-50%)"}], {duration:350, easing:"ease-out"});
    });
  });
}

/* ---------- views ---------- */
function menorahSVG(){
  var xs = [40, 80, 120, 160, 200, 240, 280], out = "";
  // arms
  [[1,5],[2,4],[3,3]].forEach(function(p, i){
    var l = xs[p[0]-1], r = xs[7-p[0]], depth = 150 - i*45;
    out += '<path class="stem" style="animation-delay:'+(.2+i*.15)+'s" d="M'+l+' 110 v20 a'+((160-l))+' '+depth*0.6+' 0 0 0 '+(r-l)+' 0 v-20"/>';
  });
  out += '<path class="stem" d="M160 110 v200"/>';
  out += '<path class="base" d="M110 330 h100 l-14 -20 h-72 z" />';
  xs.forEach(function(x, i){
    var d = 1.2 + Math.abs(i-3)*.18;
    out += '<ellipse class="glow" cx="'+x+'" cy="86" rx="16" ry="20" style="animation-delay:'+d+'s"/>';
    out += '<rect class="cup" x="'+(x-11)+'" y="100" width="22" height="10" rx="3"/>';
    out += '<path class="flame" style="animation-delay:'+d+'s, '+(d+.5)+'s" d="M'+x+' 64 C '+(x+12)+' 80 '+(x+10)+' 96 '+x+' 98 C '+(x-10)+' 96 '+(x-12)+' 80 '+x+' 64 Z"/>';
  });
  return '<svg class="menorah" viewBox="0 0 320 350" role="img" aria-label="A seven-branched lampstand lighting up">'+out+'</svg>';
}

    menorahSVG()+'</section>'+

    BOOKS.map(function(b){

        '<span class="glyph">'+(BOOK_ICON[b.icon]||I.book)+'</span><h3>'+esc(b.title)+'</h3><p>'+md(b.tagline)+'</p>'+

    }).join("")+'</div>'+
    '<div class="sectionhead"><h2>Study tools</h2></div><div class="tools">'+
      '<a class="tool" href="#/glossary">'+I.book+'<b>Glossary</b><span>Every Hebrew and Greek word explained in plain English.</span></a>'+
      '<a class="tool" href="#/maps">'+I.map+'<b>Big-picture maps</b><span>The skeleton of each study on one screen.</span></a>'+
      '<a class="tool" href="#/cards">'+I.quiz+'<b>Flashcards</b><span>Flip cards from every chapter to test your memory.</span></a>'+
      '<a class="tool" href="#/'+(BOOKS[1]?BOOKS[1].id:"")+'">'+I.calendar+'<b>Feast calendar</b><span>The yearly cycle of Israel’s appointed times.</span></a>'+
