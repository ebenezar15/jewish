{
  id: "j24-how-near-and-how-wise",
  title: "How Near and How Wise",
  summary: "In Hebrew, ‘near’ means right up close — no distance at all. The kingdom is here now. This chapter also explores John the Baptist’s doubts, the reed and the oak, ‘wisdom is proved right by her children’ and the summer-fruit link between the fig tree and Amos 8.",
  sections: [
    {
      h: "How near is the kingdom? (Matthew 4:17)",
      blocks: [
        { t: "quote", text: "Repent, for the kingdom of heaven is near.", ref: "Matthew 4:17" },
        { t: "p", text: "This was Jesus’ first message in Galilee. Later he sent out seventy-two followers to proclaim the same nearness of the kingdom (Luke 10:9, 11) — they had to grasp it for themselves and pass it on. But what does ‘near’ mean? Was the kingdom any nearer later than at the start?" },
        { t: "p", text: "In English, ‘near’ suggests *close, but not yet here*. The Greek can be read ‘is at hand’ — within reach. The Hebrew idea is even stronger: **to come near means to come right up close, even to be in the same place**." },
        { t: "cards", title: "Hebrew ‘near’ means no distance", items: [
          { h: "2 Kings 16:12", d: "King Ahaz ‘drew near’ the altar and made offerings on it — you can only do that if you are right there." },
          { h: "Genesis 20:4", d: "Abimelech had ‘not gone near’ Sarah — meaning no sexual relations had taken place." },
          { h: "Isaiah 8:3", d: "Isaiah ‘approached’ the prophetess and she conceived — some versions say ‘made love to’." },
          { h: "Deuteronomy 22:13-14", d: "A newly married man ‘comes near’ his wife — again, the closest possible contact." }
        ]},
        { t: "callout", kind: "insight", title: "Now and not yet", text: "So when Jesus says the kingdom is ‘near’, he means it is here — no distance at all — though there is still a future side to it. The kingdom is not about territory but about God’s rule in our lives. You can become its subject now by keeping God’s Law and obeying his will — ‘drawing near’." }
      ]
    },
    {
      h: "John the Baptist’s doubts (Matthew 11:2-6)",
      blocks: [
        { t: "p", text: "John had preached the same message first (Matthew 3:2). He had been certain: ‘Look, the Lamb of God… this is God’s Chosen One’ (John 1:29-34). But from prison he sent disciples to ask: ‘Are you the one who was to come, or should we expect someone else?’ (Matthew 11:3)." },
        { t: "p", text: "John was probably not doubting that Jesus was Messiah, but whether Jesus was **acting as Messiah should**. He had preached fire, the winnowing fork and the axe (Matthew 3:10-12). What he heard of Jesus’ deeds were acts of **mercy** rather than **judgement**. If the kingdom was at hand, why wasn’t it sweeping away the old order?" },
        { t: "p", text: "Jesus replied by echoing the prophets, mainly Isaiah (Isaiah 29:18-19; 35:5-6; 61:1), and Psalm 146:" },
        { t: "quote", text: "He upholds the cause of the oppressed and gives food to the hungry. The Lord sets prisoners free, the Lord gives sight to the blind, the Lord lifts up those who are bowed down.", ref: "Psalm 146:7-8" },
        { t: "callout", kind: "note", title: "A Dead Sea Scroll parallel", text: "A fragment known as ‘A Messianic Apocalypse’ (4Q521) also describes the Messiah’s works as acts of mercy, using Psalm 146:7-8 and Isaiah 61:1. Did John know it — and did Jesus know John knew it? We cannot be sure." },
        { t: "compare", title: "Expectation and reality", cols: [
          { h: "What John expected", items: ["Fire of judgement", "Axe at the root", "Evil swept away at once", "Perhaps his own release — freeing captives was a Messianic act"] },
          { h: "What Jesus showed", items: ["Acts of mercy: healing, good news to the poor", "The kingdom starting small and growing like a seed", "Wheat and weeds growing together", "A steady, sure spread of God’s ways"] }
        ]},
        { t: "p", text: "This is the tension the early church had to accept. The kingdom has already come; Jesus’ reign is present and growing. But other kingdoms are also ‘at hand’ — darkness, Satan and countless human wills living without God as King. That clash continues until the end of history. We are not told how John responded." }
      ]
    },
    {
      h: "A reed or an oak? (Matthew 11:7-15)",
      blocks: [
        { t: "p", text: "After John’s disciples left, Jesus urged the crowd to think more highly of John. Earlier in this study we saw John as the **breach-maker**, who let the kingdom ‘break through’. That took toughness, like Elijah — and now he was paying the price." },
        { t: "quote", text: "What did you go out into the wilderness to see? A reed swayed by the wind?", ref: "Matthew 11:7" },
        { t: "cycle", title: "Reeds by the Jordan through the day", center: "The reed", hint: "Tap each stage", items: [
          { h: "Morning", d: "Standing tall" },
          { h: "Afternoon heat", d: "Sinking down" },
          { h: "Cool evening", d: "Rising up again" },
          { h: "Breeze", d: "Shaking gently" }
        ]},
        { t: "compare", title: "The parable of The Reed and The Oak", cols: [
          { h: "The reed", items: ["Sways and bends in the wind", "Compromises more and more", "Survives the storm"] },
          { h: "The oak", items: ["Stands firm on deep roots", "Refuses to bend", "Toppled when a gale comes — like John, now in prison and about to die"] }
        ]},
        { t: "p", text: "A well-known parable of the time, *The Reed and The Oak*, was much like Aesop’s *The Oak and the Reed*. A simple mention of a reed brought it all to mind: Was John a compromiser? No — he was a mighty tree, now felled. Jesus both praised and explained John. Comparing him with **Elijah** adds more: even Elijah served God’s purpose and then stepped aside for another (Elisha)." }
      ]
    },
    {
      h: "How wise are you? (Matthew 11:16-19)",
      blocks: [
        { t: "p", text: "The crowds criticised John for being too strict (ascetic) and Jesus for not being strict enough! Jesus called them fickle, like children. Then he ended with a puzzling saying:" },
        { t: "quote", text: "But wisdom is proved right by her actions.", ref: "Matthew 11:19 (Luke 7:35: ‘by all her children’)" },
        { t: "p", text: "The Greek is identical in both gospels except for Luke’s extra ‘all’ (*pantōn*). The word **teknon** (‘children’) is translated two ways: ‘children’ and ‘actions’. Actions are the ‘offspring’ of wisdom. So the idiom means: **wisdom can be seen by what it produces**." },
        { t: "term", word: "Teknon", heb: "τέκνον", lang: "Greek", meaning: "‘Child’ or ‘offspring’. Used here for the results or outcomes that wisdom produces." },
        { t: "callout", kind: "insight", title: "A word with opposite meanings", text: "Some Hebrew words can mean opposites, with context deciding — the same word can mean ‘come’ and ‘go’. ‘Wisdom’ can mean smartness or stupidity. So the saying means: you can tell real wisdom from folly by whether its arguments are consistent and what its actions produce. The crowds’ inconsistent arguments about John and Jesus showed their lack of wisdom." }
      ]
    },
    {
      h: "The nearness of summer (Matthew 24:32-33)",
      blocks: [
        { t: "p", text: "Back to ‘near’. The fig tree’s tender twigs and new leaves tell you **summer is near**. This sits in an end-times passage, but our aim is Hebraic connections, not solving every puzzle." },
        { t: "p", text: "Does the fig tree stand for Israel? Sometimes in the Bible it does, but not always. In Proverbs 27:18 it stands for a master: ‘The one who guards a fig-tree will eat its fruit, and whoever protects their master will be honoured.’ Sometimes a fig tree is simply a fig tree. The key word here is **summer** — a remez to Amos." },
        { t: "term", word: "Qayitz / qetz", heb: "קַיִץ / קֵץ", lang: "Hebrew", meaning: "‘Summer (fruit)’ and ‘end’. The words are linked: summer is the end of the growing season and the farming year." },
        { t: "steps", title: "Amos 8:1-2 and the fig tree", items: [
          { h: "Amos’ vision", d: "He sees literally ‘a basket of summer’ — usually translated ‘summer fruit’ or ‘ripe fruit’." },
          { h: "God’s explanation", d: "‘The end has come upon my people Israel’ — summer (qayitz) sounds like end (ha-qetz)." },
          { h: "Ripe for harvest", d: "Fruit fully grown — only harvest remains. Harvest pictures judgement: separating good from bad." },
          { h: "Jesus’ lesson", d: "As you read the fig tree’s signs, when you see all these things, know that I am near — summer means the end and judgement." }
        ]},
        { t: "callout", kind: "note", title: "How near is near?", text: "Right at the door. As close as that. No distance at all." }
      ]
    },
    {
      h: "Review",
      blocks: [
        { t: "flip", title: "Flashcards", items: [
          { front: "What does ‘near’ mean in Hebrew?", back: "Right up close — no distance at all (e.g. Ahaz at the altar, 2 Kings 16:12)." },
          { front: "What was John the Baptist really asking?", back: "Whether Jesus was acting as Messiah should — mercy instead of judgement." },
          { front: "What is 4Q521?", back: "A Dead Sea Scroll, ‘A Messianic Apocalypse’, describing the Messiah’s acts of mercy." },
          { front: "Reed or oak?", back: "The reed bends and survives; the oak stands firm and falls in a gale — John was an oak." },
          { front: "‘Wisdom is proved right by her children’ means…?", back: "Wisdom is known by what it produces (teknon = offspring/outcomes)." },
          { front: "How do ‘summer’ and ‘end’ connect?", back: "Qayitz and qetz — Amos 8:1-2: summer fruit means the end has come." }
        ]}
      ]
    }
  ],
  keypoints: [
    "In Hebrew, to ‘come near’ means to be right up close; the kingdom is here now, though also still to come.",
    "The kingdom is about God’s rule in our lives, not territory.",
    "John the Baptist questioned whether Jesus was acting as Messiah, since he saw mercy rather than judgement.",
    "Jesus answered with echoes of Isaiah and Psalm 146; the Dead Sea Scroll 4Q521 has a similar list.",
    "The kingdom grows slowly, alongside other kingdoms, until the end.",
    "The reed and the oak: John refused to bend and was felled like an oak.",
    "‘Wisdom is proved right by her children’ means wisdom is judged by its outcomes.",
    "The fig tree’s ‘summer’ links to Amos 8: summer (qayitz) means the end (qetz) and judgement."
  ],
  quiz: [
    { q: "What does ‘near’ mean in Hebrew thinking?", options: ["Coming soon, but far away", "Right up close — no distance at all", "Only in heaven", "Uncertain"], answer: 1, why: "Examples like Ahaz at the altar show ‘near’ means right there." },
    { q: "Why did John the Baptist send his question from prison?", options: ["He had never met Jesus", "He wanted to become a disciple", "Jesus’ acts of mercy did not match his expectation of judgement", "He wanted to start a revolt"], answer: 2, why: "John had preached fire and the axe; he heard of mercy and healing instead." },
    { q: "In the reed-and-oak picture, what happens to the oak?", options: ["It stands firm until a gale topples it", "It bends and survives", "It grows into a mountain", "It is cut into a cross"], answer: 0, why: "The oak refuses to bend, so a strong gale can bring it down — like John." },
    { q: "Which prophet is hinted at by the ‘summer’ in Matthew 24:32?", options: ["Jonah", "Hosea", "Micah", "Amos"], answer: 3, why: "Amos 8:1-2: a basket of summer fruit — the end has come." }
  ]
},
{
  id: "j25-remember-me",
  title: "Remember Me",
  summary: "Three Hebraic snippets from Luke — a ‘bad name’, a changed face and a ‘set’ face — lead to the big theme: in the Bible, to ‘remember’ is an act of the will. God remembers his covenant by acting for his people, and the dying thief used a covenant word: ‘Remember me!’",
  sections: [
    {
      h: "‘Reject your name as evil’ (Luke 6:22)",
      blocks: [
        { t: "p", text: "In Luke’s ‘sermon on the plain’ — a shorter version of Matthew’s ‘sermon on the mount’ — one Beatitude says: ‘Blessed are you when people… reject your name as evil’ (Luke 6:22). The Authorised Version has ‘cast out your name as evil’. What does it mean?" },
        { t: "list", title: "Clues from Hebrew", items: [
          "In Hebrew, **adjectives come after the noun**: ‘name evil’ or ‘name bad’.",
          "The word ‘as’ is not in the original; it was added because ‘cast out your name bad’ sounded odd.",
          "The Greek verb *ekbalōsin* (from *ekballō*) means to throw out forcefully. But the Hebrew equivalent, **hotzi**, has nothing violent about it. It means ‘to cause to go out’."
        ]},
        { t: "term", word: "Hotzi", heb: "הוֹצִיא", lang: "Hebrew", meaning: "‘To cause to go out’ — the causative form of ‘go out’. With ‘a bad name’ it means to publish or spread a bad report: slander or defamation." },
        { t: "table", title: "‘Giving a bad name’ in the Old Testament", head: ["Passage", "Situation"], rows: [
          ["Nehemiah 6:13", "Men were hired to scare Nehemiah into sin so they could ‘give me a bad name to discredit me’."],
          ["Deuteronomy 22:13-14", "A husband who dislikes his wife slanders her and ‘gives her a bad name’."],
          ["Deuteronomy 22:19", "He ‘has given an Israelite virgin a bad name’."]
        ]},
        { t: "callout", kind: "insight", title: "The meaning", text: "We are blessed when people smear our name or slander us because of Jesus." }
      ]
    },
    {
      h: "The face of Jesus (Luke 9:29, 51)",
      blocks: [
        { t: "p", text: "At the transfiguration, ‘the appearance of his face changed’ (Luke 9:29) — a very Hebraic phrase found in rabbinic writings of the time. The Authorised Version: ‘the fashion of his countenance was altered.’ The word ‘transfiguration’ only means ‘change’, and it is in the headings, not the text. Matthew, for once less Hebraic, is clearer: ‘his face shone like the sun’ (Matthew 17:2)." },
        { t: "p", text: "Compare **Moses**, whose face was radiant when he came down from Sinai with the tablets (Exodus 34:29) and whenever he spoke with the Lord (Exodus 34:34-35). Fittingly, Moses was there at the transfiguration — and they spoke about Jesus’ coming death, his ‘departure’, in Greek his **exodos** (Luke 9:31)." },
        { t: "term", word: "Exodos", heb: "ἔξοδος", lang: "Greek", meaning: "‘Exodus’, ‘departure’. Used in Luke 9:31 for Jesus’ coming death in Jerusalem." },
        { t: "cards", title: "Hebrew loves ‘face’ idioms", items: [
          { h: "Flee from the face of", d: "Run away from someone" },
          { h: "Set your face against", d: "Oppose" },
          { h: "Turn / hide your face", d: "Withdraw favour" },
          { h: "Make your face shine on", d: "Show favour" },
          { h: "Lift up your face", d: "Look with confidence or favour" },
          { h: "God’s face = his Presence", d: "‘My Presence [face] will go with you’ (Exodus 33:14) — God’s face walking with us" }
        ]}
      ]
    },
    {
      h: "‘He set his face to go to Jerusalem’",
      blocks: [
        { t: "p", text: "Luke 9:51 in many versions says Jesus ‘resolutely set out for Jerusalem’. The Greek says he ‘set his face to go to Jerusalem’, matching a Hebrew phrase. To ‘set your face towards’ a place simply means to **turn in that direction and set off**. It is common in the Old Testament (Genesis 31:21; 2 Kings 12:17; Daniel 11:17). In English we say ‘head for’ rather than ‘face’." },
        { t: "compare", title: "Over-translation vs the plain idiom", cols: [
          { h: "Often read into it", items: ["‘Resolutely’, ‘an iron will’", "‘A face set like flint’ (Isaiah 50:7 — a different context, no remez here)", "Gritted teeth, a brave face, an inner struggle", "Daniel 11:17 ‘he will determine to come’ adds determination not in the Hebrew"] },
          { h: "What it actually means", items: ["‘As the time approached, he set off’", "There was intent — he would not turn back", "No sign he needed extra courage at this point", "Luke 9:53: ‘he was heading for Jerusalem’ — following his nose!"] }
        ]}
      ]
    },
    {
      h: "What does it mean for God to remember?",
      blocks: [
        { t: "p", text: "Scripture says God ‘remembered’ Noah (Genesis 8:1), Rachel (Genesis 30:22) and Hannah (1 Samuel 1:19). Did God have a senior moment? Had Noah slipped his mind during 150 days of flood? And when God says he will remember our sins no more (Isaiah 43:25; Jeremiah 31:34), we hope that is not just a brain fade!" },

        { t: "p", text: "**Joseph in prison.** Joseph gave Pharaoh’s cupbearer a good interpretation of his dream and asked: ‘When all goes well with you, remember me and show me kindness’ (Genesis 40:14) — put in a word for me! But the cupbearer ‘did not remember Joseph; he forgot him’ (Genesis 40:23). He hadn’t literally forgotten; he **chose not to act**." },

        { t: "term", word: "Zakhar", heb: "זָכַר", lang: "Hebrew", meaning: "‘To remember’. In the Bible it means choosing to act for someone, especially in keeping a covenant — not merely recalling a fact." }

        { t: "callout", kind: "note", title: "A prayer for anyone", text: "‘Remember me!’ is a prayer we can use in any situation, however desperate. Short and to the point. God will surely respond. And notice how Jesus began his reply to the thief: ‘I tell you the truth.’ Amen!" }

{

  title: "And Finally...",
  summary: "The closing reflection: the dying thief had it right, but most of us have time to become true disciples. Discipleship means being shaped by Jesus in community (ekklesia), recovering his Jewishness, and remembering he is more than a rabbi — he is the great I AM, the silent suffering servant, Saviour and Lord.",

        { t: "p", text: "From birth, all of us are shaped by others — people around us, people we read or hear about. You are certainly someone’s disciple, maybe many people’s. But if you are a Christian, are you **his** disciple? Is Christ your teacher and guide? Are you yoked to Jesus as he offers?" }

        { t: "term", word: "Ekklesia", heb: "ἐκκλησία", lang: "Greek", meaning: "A community of believers with Jesus as their Head — what Jesus promised to build. Not an institution, hierarchy or programme, but a spiritual home where discipleship can flourish." },
        { t: "callout", kind: "insight", title: "Living what he taught", text: "Jesus’ aim was not mainly to pass on information but to transform lives. Disciples are never just listeners waiting to be filled. Today we test learning by whether people can repeat it in words. Jesus wanted to see his teaching lived out in actions." },
        { t: "p", text: "To live ‘the Jesus way’, we must listen carefully to what he said. His teaching methods were very different from ours, and what he said often cannot be understood without knowing **how** he said it and the **world and culture** he spoke into." }

    },
    {
      h: "Recovering what was lost",

        { t: "callout", kind: "insight", title: "A claim to deity", text: "Jesus was claiming not only to have existed before Abraham — extraordinary enough — but to share God’s own identity. He came into a particular culture, at a particular time, ministering in a particular way. But he is also the Son of God, one with the Father, the eternal Word who was with God from the beginning and became flesh." }

    {

        { t: "p", text: "Yochanan, the son of Zebedee, was born into a deeply Jewish world. He grew up in a Galilean fishing family, probably in **Bethsaida or Capernaum**. These towns were strongly Jewish, but also touched by Greek and Roman trade and ideas." },
        { t: "term", word: "Torah", heb: "תּוֹרָה", lang: "Hebrew", meaning: "“Teaching” or “instruction.” Here it means the first five books of the Bible (Genesis to Deuteronomy), the heart of Jewish learning." },

        { t: "term", word: "Shema", heb: "שְׁמַע", lang: "Hebrew", meaning: "“Hear!” The first word of Deuteronomy 6:4, “Hear, O Israel: the LORD our God, the LORD is one.” It is Israel’s central confession of faith and was often the first thing a Jewish child memorized." },

          { front: "Was apocalyptic writing meant as a crystal ball?", back: "No. It was a symbolic, theological message of hope for the oppressed." }
        ] }
      ]
    }

    { q: "What does John’s Hebrew name, Yochanan, mean?", options: ["Son of thunder", "God is gracious", "Beloved disciple", "Salvation"], answer: 1, why: "Yochanan means “God is gracious” or “the LORD has shown favor.” (Yeshua is the name that means “salvation.”)" },
    { q: "Where and when did John most likely write Revelation?", options: ["In Jerusalem, around AD 30", "In Rome, under Nero", "On Patmos, around AD 95 under Domitian", "In Ephesus, around AD 50"], answer: 2, why: "John was exiled to the island of Patmos during Domitian’s reign (AD 81–96), probably around AD 95 (Revelation 1:9)." },

{
  id: "r02-revelation-a-jewish-book",
  title: "Revelation: A Jewish Book",
  summary: "Revelation belongs to the Jewish apocalyptic tradition. Its mostly Gentile first readers lived inside a Jewish faith world, thought of time in cycles, and knew the prophets John was drawing from.",
  sections: [
    {
      h: "Part of a Jewish Tradition",
      blocks: [
        { t: "p", text: "Revelation belongs to a well-known genre: **Jewish apocalyptic literature**. These writings appeared in the centuries before Jesus and continued after Him. Besides biblical books, they include writings outside the Bible such as **1 Enoch, 2 Esdras**, and the **War Scroll** from the Dead Sea Scrolls." },
        { t: "p", text: "These texts were written **in times of crisis**. They offered hope from God and a glimpse of how history will finally turn out. They were never meant as literal blueprints of future events. They were symbolic visions to encourage the faithful under oppression. **Revelation follows this pattern exactly.**" },
        { t: "callout", kind: "note", title: "A puzzle", text: "John wrote to **seven churches in Asia Minor** (modern Turkey), communities made up mostly of Gentiles. So why is his book soaked in Jewish imagery from the Hebrew Bible? Why use symbols from a tradition his readers might not fully know? The answer lies in the nature of early Christianity, the role of Jewish apocalyptic writing, and how biblical prophecy works." }
      ]
    },
    {
      h: "When the Church Was Still Jewish",
      blocks: [
        { t: "p", text: "Most Christians today see Christianity as a mainly Gentile religion, completely separate from Judaism. But at first, it was **not a separate faith**. It was a movement, a sect or “denomination” **within Judaism**, rooted in Jewish beliefs, Scriptures and traditions. Christianity became an official religion only in the **4th century**." },
        { t: "p", text: "For at least the first **two centuries**, followers of Jesus, both Jews and Gentile converts, saw themselves as part of **Israel’s covenant community**. They saw Jesus as the fulfillment of Jewish messianic hopes, not the founder of a new religion. Only later, through historical events, theological arguments and social pressures, did Christianity drift from its Jewish foundations and become a separate and often very antisemitic religion." },
        { t: "p", text: "Part of this came from a deliberate separation. **Emperor Constantine** (4th century) worked toward a “Jewish-free” religion, removing Jewish leaders and theologians from key roles in the church. This had lasting effects on Christian–Jewish relations and on how Christians interpret the Bible." },
        { t: "timeline", title: "From Jewish movement to separate religion", items: [
          { when: "1st century", h: "A movement within Judaism", d: "Jewish and Gentile followers of Jesus see themselves as part of Israel’s story." },
          { when: "1st–2nd centuries", h: "Still Jewish in identity", d: "Jesus is seen as the fulfillment of Jewish messianic hope." },
          { when: "Later centuries", h: "Gradual drift", d: "Disputes and social pressures pull the church away from its roots." },
          { when: "4th century", h: "Official religion", d: "Constantine pushes Jewish leaders out; Christianity becomes a distinct religion." }
        ] },
        { t: "p", text: "In the churches of Asia Minor, Jewish believers (sometimes called “Messianic Jews”, not to be confused with the modern movement of that name) played a major role alongside Gentile converts." },
        { t: "table", title: "Mixed Jewish–Gentile churches in the New Testament", head: ["Place", "What we see", "Reference"], rows: [
          ["Ephesus", "Paul, the “apostle to the Gentiles,” first reasons with Jews in the synagogue, then turns to Gentiles", "Romans 11:13; Acts 18:19-21; 19:8-10"],
          ["Galatia", "Jews and Gentiles live together; tension over Jewish customs leads Paul to rebuke Peter for withdrawing from Gentiles", "Galatians 2:14"],
          ["Colossae", "Warnings about Jewish legalism suggest a mixed congregation", "Colossians 2:16-17"],
          ["Colossae", "In Christ there is no distinction between Jew and Greek", "Colossians 3:11"],
          ["Smyrna, Philadelphia, Pergamum, Thyatira, Laodicea", "Churches of Revelation with Jewish–Christian interaction, sometimes in harmony, sometimes in tension", "Revelation 2–3"]
        ] },
        { t: "callout", kind: "insight", text: "In John’s day, the “Christian” church was still very **Jewish** in identity, practice and worldview. Even its non-Jewish members saw themselves as part of **Israel’s story**." }
      ]
    },
    {
      h: "The God-Fearers",
      blocks: [
        { t: "term", word: "God-fearers", heb: "φοβούμενοι τὸν θεόν", lang: "Greek", meaning: "Gentiles in the Second Temple period who worshiped the God of Israel and followed many Jewish practices, but did not fully convert to Judaism (Acts 10:1-2; 13:16, 26; 16:14; 17:4; 18:7)." },
        { t: "cards", title: "What God-fearers did", items: [
          { h: "Synagogue", d: "Attended Jewish synagogues." },
          { h: "Scripture", d: "Studied the Hebrew Scriptures and Jewish texts." },
          { h: "Customs", d: "Kept some customs, such as the Sabbath and food laws." },
          { h: "Ethics", d: "Followed Jewish moral teaching." }
        ] },
        { t: "p", text: "Before Jesus, many God-fearers learned about Judaism through **Jewish friends, neighbors or business partners**. Because they already went to synagogue and knew the Scriptures, they were natural candidates for the gospel, and likely the **main target audience** of Paul’s mission journeys." },
        { t: "callout", kind: "insight", title: "A helpful comparison", text: "A God-fearer becoming a follower of Jesus was a bit like a modern Catholic becoming a Protestant (or the other way round). It was a shift of view **within the same religious framework**. They simply moved from one Jewish “denomination” to another." },
        { t: "p", text: "When Paul preached in synagogues, he often found a **mixed audience** of Jews and God-fearing Gentiles (Acts 13:16; 17:4). These Gentiles already loved one God and Jewish ethics. They were very open to Jesus as the Jewish Messiah, especially since they did not need circumcision or full Torah observance." },
        { t: "p", text: "God-fearers were among the Gentile believers addressed by the **Jerusalem Council** (Acts 15:29). The council decided Gentile followers of Jesus did not need to become Jews through circumcision or keep the whole Torah. They were asked to avoid only four things:" },
        { t: "list", title: "The Jerusalem Council’s four requirements (Acts 15:29)", items: [
          "Food sacrificed to idols",
          "Blood",
          "Meat of strangled animals",
          "Sexual immorality (likely tied to idolatry, since pagan worship often involved temple prostitution)"
        ] },
        { t: "flow", title: "Why the first readers understood John’s symbols", nodes: [
          { h: "God-fearers", d: "Already in the synagogue" },
          { h: "Know the Hebrew Bible", d: "Familiar with prophets and symbols" },
          { h: "Follow Jesus as Messiah", d: "Join mixed Jewish–Gentile churches" },
          { h: "Read Revelation", d: "Its imagery feels familiar, not bizarre" }
        ] }
      ]
    },
    {
      h: "The Biblical Concept of Time",
      blocks: [
        { t: "p", text: "To read Revelation well, we must understand how the Bible thinks about **time**. John’s Old Testament symbolism and Jewish apocalyptic style point to a message meant to **transcend time**, teaching deep truths that come round again and again, rather than giving a simple forecast." },
        { t: "p", text: "A symbolic reading does **not** deny that real future events will happen, such as Christ’s final victory and the New Jerusalem. But the emphasis is on symbols of **timeless truths and recurring patterns**, fitting the Jewish view of time as cyclical rather than purely linear." },
        { t: "compare", title: "Two views of time", cols: [
          { h: "Western time: linear", items: ["A straight line", "Past → present → future", "A clear beginning and end", "Events happen once"] },
          { h: "Jewish time: cyclical", items: ["Cycles, rhythms and repeated patterns", "Moves forward like a spiral, not a line", "Events repeat in theme, not identically", "Each cycle deepens meaning and points to final fulfillment"] }
        ] },
        { t: "term", word: "Shabbat", heb: "שַׁבָּת", lang: "Hebrew", meaning: "The Sabbath, the seventh day of rest. Its weekly return is one of the clearest pictures of time as a rhythm." },
        { t: "p", text: "We see this in the **weekly rhythm of Shabbat**, the **yearly cycle of feasts**, and in prophecy, where past events echo into the future. Redemption, exile, return, judgment and renewal happen **again and again** in Scripture. Israel’s story is not a one-time plotline but a repeated pattern woven into history." },
        { t: "cycle", title: "The repeating pattern of Scripture", center: "God’s story in cycles", hint: "Tap each stage", items: [
          { h: "Redemption", d: "God rescues His people." },
          { h: "Exile", d: "Unfaithfulness leads to loss and scattering." },
          { h: "Judgment", d: "God confronts sin and oppression." },
          { h: "Return", d: "God brings His people back." },
          { h: "Renewal", d: "Life and covenant are restored, pointing to final fulfillment." }
        ] },
        { t: "callout", kind: "insight", title: "The Messiah follows the pattern", text: "The Messiah’s story follows the same shape: **death, burial, resurrection**. And this pattern is mirrored not only once, but in creation, in nations and in individual lives." },
        { t: "p", text: "This is crucial for reading Revelation. Prophetic and apocalyptic texts are rarely straight timelines. They are symbolic portraits of **repeated cycles**: human failure, God stepping in, and final restoration." }
      ]
    },
    {
      h: "Revelation Cannot Be Understood Without the Hebrew Scriptures",
      blocks: [
        { t: "p", text: "Revelation is not an isolated vision. It is part of a long line of Jewish apocalyptic writing running through the Hebrew Scriptures. John does **not invent a new prophetic language**. He inherits and adapts a system of Jewish symbols, drawing especially on **Isaiah, Ezekiel, Daniel and Zechariah**. Here are a few quick examples." },
        { t: "table", title: "Old Testament → Revelation", head: ["Prophet", "Old Testament picture", "Revelation echo", "Meaning"], rows: [
          ["Daniel", "Four beasts from the sea (Daniel 7)", "Beast rising from the sea (Revelation 13)", "Oppressive empires rise and fall under God’s control"],
          ["Isaiah", "New heavens and new earth (Isaiah 65:17)", "New heaven and new earth (Revelation 21)", "God’s ancient promise of renewal, now for all creation"],
          ["Ezekiel", "Angel measures a restored temple (Ezekiel 40–48)", "Measuring the temple (Revelation 11)", "God dwelling with His people; the true temple is the people of God"]
        ] },
        { t: "p", text: "**Daniel.** The beast from the sea in Revelation 13 does not come out of nowhere. It points straight to the beasts of Daniel 7, where four beasts stand for oppressive kingdoms, ending with a terrifying final one that is crushed when God’s kingdom arrives. By using this picture, John tells his readers that the “beast” of their own day is part of the **same recurring pattern** of empire and divine justice. Just as Daniel’s vision ends with God’s triumph, so will their struggle." },
        { t: "quote", text: "See, I will create new heavens and a new earth. The former things will not be remembered, nor will they come to mind.", ref: "Isaiah 65:17" },
        { t: "p", text: "**Isaiah.** In Isaiah, this promise was a vision of hope for a restored Israel, a world without suffering and death. John carries it further into a **cosmic renewal** that includes all creation. God’s plan is not new; it is the high point of promises made long ago." },
        { t: "p", text: "**Ezekiel.** In Ezekiel 40–48, an angel carefully measures a restored temple, picturing God re-establishing His dwelling among His people. When John echoes this in Revelation 11, the physical temple in Jerusalem had already been **destroyed by Rome** (AD 70). So John reads Ezekiel’s vision symbolically: the true temple is **the people of God themselves**." },
        { t: "callout", kind: "insight", text: "John does not just borrow words. He places himself inside the ongoing story of God and His people. His message is not a wholly new revelation but the **fulfillment and transformation** of ancient prophecies, which readers who knew the Hebrew Scriptures would instantly recognize." }
      ]
    },
    {
      h: "The Final Book in the Series",
      blocks: [
        { t: "p", text: "Revelation should not be read in isolation. It is part of a much larger framework that keeps pointing back to **God’s faithfulness in history**." },
        { t: "p", text: "Revelation is the last book of the Bible, but it also belongs to another “series”: **Jewish apocalyptic literature**. By using the same language as Daniel, Isaiah, Ezekiel, Zechariah and other apocalyptic books outside the Bible, John shows that Revelation is not a surprising new prophecy but the **continuation and climax** of God’s established plan. This strengthens its credibility and roots it in the hope of divine justice that sustained Israel for centuries." },
        { t: "tree", title: "Revelation’s two families", root: "Revelation", children: [
          { h: "Last book of the Bible", d: "Completes the biblical story" },
          { h: "Final book of the Jewish apocalyptic series", children: [
            { h: "Daniel, Isaiah, Ezekiel, Zechariah", d: "Biblical sources" },
            { h: "1 Enoch, 2 Esdras, 2 Baruch, War Scroll", d: "Other Jewish apocalyptic writings" }
          ] }
        ] },
        { t: "callout", kind: "insight", title: "Foundational, not incidental", text: "The Jewishness of Revelation is not a side detail. It is the **foundation**. Only by grasping symbols already used for centuries can we appreciate John’s vision as the grand climax of a story that had been unfolding for generations." },
        { t: "p", text: "**In conclusion:** Revelation’s heavy use of Jewish symbols, even for mainly Gentile churches, reflects the deep Jewish roots of early Christianity. John’s readers knew the Scriptures through Jewish believers and God-fearers, so his imagery was not obscure to them but familiar. By drawing on this prophetic heritage, John reassured them of God’s faithfulness: their struggles fit a **timeless pattern of divine promise and final victory**." },
        { t: "flip", title: "Flashcards", items: [
          { front: "Name three Jewish apocalyptic writings outside the Bible.", back: "1 Enoch, 2 Esdras and the War Scroll (Dead Sea Scrolls)." },
          { front: "Who were the God-fearers?", back: "Gentiles who worshiped Israel’s God, attended synagogue and kept some Jewish customs without fully converting." },
          { front: "What four things did Acts 15:29 ask Gentiles to avoid?", back: "Food sacrificed to idols, blood, meat of strangled animals, and sexual immorality." },
          { front: "Western vs Jewish view of time?", back: "Western: a straight line. Jewish: cycles and patterns moving forward like a spiral." },
          { front: "Which Isaiah verse lies behind Revelation 21?", back: "Isaiah 65:17: “See, I will create new heavens and a new earth.”" },
          { front: "Why did John read Ezekiel’s temple symbolically?", back: "Rome had destroyed the Jerusalem temple; the true temple is God’s people." }
        ] }
      ]
    }
  ],

  ],
  quiz: [
    { q: "Why could mostly Gentile churches understand Revelation’s Jewish symbols?", options: ["John explained every symbol in footnotes", "They were rooted in a Jewish faith world, many as God-fearers who knew the Hebrew Scriptures", "The symbols came from Greek mythology", "They did not understand them at all"], answer: 1, why: "The early churches were deeply Jewish in worldview, and God-fearers already knew the synagogue and Scriptures." },
    { q: "Which of these was NOT one of the Jerusalem Council’s requirements for Gentile believers (Acts 15:29)?", options: ["Abstain from blood", "Abstain from food sacrificed to idols", "Be circumcised", "Abstain from sexual immorality"], answer: 2, why: "The council decided Gentiles did not need circumcision or full Torah observance." },
    { q: "How does the Jewish mindset picture time?", options: ["As a straight line with one beginning and end only", "As random and meaningless", "As a spiral of cycles and repeated patterns moving toward fulfillment", "As something that does not matter to faith"], answer: 2, why: "Jewish time moves forward like a spiral; events repeat thematically, each cycle deepening in meaning." },
    { q: "The measuring of the temple in Revelation 11 echoes which prophet?", options: ["Ezekiel 40–48", "Jonah", "Isaiah 53", "Malachi"], answer: 0, why: "Ezekiel saw an angel measure a restored temple; John reapplies it to the people of God as the true temple." },
    { q: "When did Christianity become an official religion?", options: ["Immediately after Pentecost", "In the 4th century", "In the 16th century", "In AD 95"], answer: 1, why: "For at least two centuries it was a movement within Judaism; it became an official religion in the 4th century." }

{
  id: "r03-how-should-apocalyptic-literature-be-read",
  title: "How Should Apocalyptic Literature Be Read?",
  summary: "The Bible speaks in pictures. Apocalyptic writing takes this to the maximum, partly to hide God’s plan from evil while revealing it to the faithful. Reading Revelation “as literally as possible” turns it into nonsense; reading it symbolically reveals a message of hope.",
  sections: [
    {
      h: "A Hebrew Book Speaks in Pictures",
      blocks: [
        { t: "p", text: "The Bible is a **Hebrew and Jewish masterpiece**. Its way of thinking and speaking is deeply metaphorical, using vivid images, symbols and layered meanings to express timeless truths." },
        { t: "p", text: "Biblical Hebrew has a **fairly small vocabulary** compared to many modern languages. Because of this, prophets, rabbis and writers often used **metaphors, symbols and figures of speech** to express complex ideas, feelings and spiritual realities. So reading the Bible requires knowing its cultural, historical and literary context, even more than with modern, more direct languages." },
        { t: "p", text: "Jewish apocalyptic writing comes from a worldview where the **physical and spiritual are tightly connected**. It is very abstract and must be read beyond the literal. This makes it powerful for deep spiritual truths, but hard for the typical Western mind, which prefers straightforward, linear, analytical thinking." },
        { t: "compare", title: "How warnings are given", cols: [
          { h: "Modern style", items: ["Literal and direct", "Highway signs", "Warning stickers on electronics", "Instruction manuals"] },
          { h: "Biblical style", items: ["Symbols and metaphors", "The narrow gate", "Wolves in sheep’s clothing", "Unquenchable fire"] }
        ] },
        { t: "table", title: "Jesus also warned in pictures", head: ["Picture", "Reference"], rows: [
          ["The “narrow gate” leading to life", "Matthew 7:13-14"],
          ["Wolves disguised as sheep", "Matthew 7:15"],
          ["Unquenchable fire", "Matthew 3:12"],
          ["Gnashing of teeth", "Matthew 8:12"],
          ["A house built on sand", "Matthew 7:26-27"],
          ["“Pluck out your eye”", "Matthew 18:9"]
        ] },
        { t: "callout", kind: "insight", text: "John, like his Rabbi Jesus, used highly figurative language. Apocalyptic writing such as Revelation turns this style **up to the maximum**." }
      ]
    },
    {
      h: "Symbolism vs. Literalism: Pictures We All Use",
      blocks: [
        { t: "p", text: "Apocalyptic texts are filled with images that would sound **absurd if taken literally**. No Jewish reader expected these creatures to stomp through Jerusalem. They stood for kingdoms, rulers and heavenly realities." },
        { t: "cards", title: "Wild images in the Hebrew Bible", items: [
          { h: "Daniel 7:3-7", d: "Four beasts from the sea: a lion with eagle’s wings, a bear devouring flesh, a leopard with four heads and wings, and a beast with iron teeth and ten horns. They represent kingdoms and rulers." },
          { h: "Zechariah 5:1-2", d: "A huge flying scroll, about thirty feet long, soaring through the air as a curse on the land." },
          { h: "Ezekiel 1:5-14", d: "Heavenly beings with four faces (human, lion, ox, eagle), darting like lightning, with wheels covered in eyes." }
        ] },
        { t: "cards", title: "And outside the Bible", items: [
          { h: "1 Enoch", d: "Nations and rulers shown as animals: rams, sheep and eagles in a cosmic struggle." },
          { h: "4 Ezra", d: "A monstrous many-winged eagle ruling the world, its heads speaking with different voices." }
        ] },
        { t: "p", text: "These books use imaginative visions to communicate deep spiritual and historical truths, the same method Revelation later uses." },
        { t: "p", text: "**We use figurative language every day.** Symbolic language is not totally foreign to us. Read this everyday paragraph:" },
        { t: "callout", kind: "note", title: "Ordinary speech", text: "*My brain is fried after that meeting, which was a complete trainwreck, and now I’m drowning in work trying to fix the mess. This project feels like a ticking time bomb, and dealing with someone who has a heart of stone only makes it worse. She’s constantly fishing for compliments, and though that exam was a piece of cake, I’ve hit a wall in my training. I have to watch out for him, he’s a snake in the grass, but at least she’s the light of my life.*" },
        { t: "p", text: "Your brain reads every phrase as a picture without effort. Now imagine someone **two thousand years from now** reading it literally: fried brains, a real train crash, a snake hiding in the grass. Apocalyptic language goes further still, using fantastical pictures and poetry with even less literal language. Something closer to it would sound like this:" },
        { t: "callout", kind: "note", title: "Apocalyptic-style speech", text: "*The bridge of trust lay shattered, stones reduced to dust by neglect… She had nurtured a garden with seeds of kindness, waiting for his love to bloom. But storms of indifference raged within him, tearing hope from the roots. From shadows emerged another, quietly stealing her heart away. In the dim sky, regret circled like a creature with fiery wings, darkening memories that flickered like fading lampstands… His heart became a locked door, rusted shut by remorse.*" },
        { t: "p", text: "At first this sounds vague and confusing, yet it is full of meaning. It paints a vivid picture of a **broken relationship** without a single literal statement, just like the apocalyptic genre." },
        { t: "flip", title: "Decode the pictures", items: [
          { front: "“The bridge of trust lay shattered”", back: "The relationship’s trust was broken." },
          { front: "“A garden with seeds of kindness”", back: "She patiently invested love and care." },
          { front: "“Storms of indifference”", back: "His coldness and lack of care." },
          { front: "“Another… stealing her heart”", back: "Someone else won her love." },
          { front: "“A locked door, rusted shut by remorse”", back: "He became closed off and full of regret." }
        ] }
      ]
    },
    {
      h: "Why Not Just Speak Plainly? Confusing the Devil",
      blocks: [
        { t: "p", text: "A common argument says: “God wants people to understand His plan, so the Bible should be read literally, at face value.” Some preachers insist God had no reason to use any code or camouflage, so every prophecy must be read literally. There are interpretive answers to this, but here is a **theological** one: Satan’s failure to understand prophetic language." },
        { t: "p", text: "Biblical prophecy often comes with the warning that only those with **spiritual eyes and ears** will understand (Isaiah 6:9-10; Ezekiel 12:2; Matthew 13:13-15; 1 Corinthians 2:14). Revelation repeats it: “Whoever has ears, let them hear” (Revelation 2:7, 11, 17). Prophecy needs spiritual sensitivity, something the devil lacks." },
        { t: "quote", text: "He was led like a lamb to the slaughter… After he has suffered, he will see the light of life.", ref: "Isaiah 53:7, 11" },
        { t: "p", text: "The prophets foretold a **suffering servant** who would die and yet live. Satan did not grasp that the Messiah’s death would be the very means of redemption. His weakness was not lack of power but **lack of wisdom**: brilliant but blind. Like a self-obsessed narcissist fixated on control, rank and appearances, he may have been unable to grasp God’s poetic, symbolic ways. This may partly explain why “Jesus spoke… in parables; he did not say anything to them without using a parable” (Matthew 13:34)." },
        { t: "steps", title: "How symbolic prophecy outwitted evil", items: [
          { h: "Prophecy veiled in pictures", d: "A lamb led to slaughter who will see the light of life (Isaiah 53)." },
          { h: "Evil reads it literally", d: "Satan misses that death would be the path to victory." },
          { h: "Evil acts against Jesus", d: "Satan enters Judas (Luke 22:3) and pushes the rulers to demand crucifixion." },
          { h: "The cross", d: "Evil thinks it has destroyed the Messiah." },
          { h: "Evil ensures its own defeat", d: "Through His death, the suffering servant conquers death." }
        ] },
        { t: "quote", text: "None of the rulers of this age understood it, for if they had, they would not have crucified the Lord of glory.", ref: "1 Corinthians 2:8" },
        { t: "callout", kind: "insight", title: "Satan, the ultimate literalist", text: "The great accuser could twist facts and laws, but the mystery of **sacrificial love** was hidden from him because it was wrapped in symbols. Had God laid out the plan plainly, Satan would have tried to stop it. Instead he played right into God’s hands. Sadly, many readers today fall into the same trap, reading metaphors literally and missing God’s deeper, redemptive beauty." },
        { t: "p", text: "Many Western pastors and theologians are masters of logic, like brilliant lawyers, yet **imprisoned by literalism**. In trying to be precise, they flatten the text and miss the layered, mystical meaning that came naturally to ancient Jewish thought." },
        { t: "callout", kind: "note", title: "A divine filter", text: "God speaks in symbols and visions **not to confuse**, but to hide truth from those who would misuse it while revealing it to those with “eyes to see” (Matthew 13:11-13) and “wisdom to understand” (Revelation 13:18). Symbolic prophecy lets God’s plan unfold without interference and rewards the faithful with deeper understanding." }
      ]
    },
    {
      h: "Concealing Truth and a Language Above All Languages",
      blocks: [
        { t: "p", text: "This kind of skill is not only found in the Bible. Smart politicians often speak in symbols and metaphors when they want to avoid being quoted out of context, hide something, or avoid being held to their words later." },
        { t: "p", text: "Or imagine someone whose life’s work was taken from them by force, who cannot speak openly because of fear or a legal agreement. They might write: *“I birthed a fragile, innocent infant… a fearless beast cloaked in doctrines foreign to the child’s essence seized the child from my arms… The child now wanders in a foreign land, its soul torn between the original light and the dark forces that reshaped it.”* The meaning is clear to those who know the story, but hidden from others." },
        { t: "callout", kind: "insight", title: "A practical reason for John", text: "Apocalyptic language also helped John send his letter to the churches **through Roman channels** without openly offending the authorities. Rome could be called a “beast” or “Babylon” in code." },
        { t: "p", text: "Parables, poems and apocalyptic writing are a sophisticated way of speaking. They are not designed to give dry, manual-like facts, but to engage our **God-given imagination**, provoke reflection and invite us to take part in interpreting (Psalm 1:2; Joshua 1:8). They require spiritual sensitivity, discernment and openness to many layers of meaning." },
        { t: "cards", title: "Why symbolic language is powerful", items: [
          { h: "Many levels at once", d: "Like poetry or art, it enriches thought and deepens emotional impact." },
          { h: "Crosses cultures and centuries", d: "Word meanings change, but a shepherd caring for sheep (Psalm 23:1) stays meaningful everywhere." },
          { h: "Expresses the inexpressible", d: "Love, justice and compassion defy exact definition. “Smoke rose from his nostrils; consuming fire came from his mouth” (Psalm 18:8) speaks to the heart." },
          { h: "Adapts to every life", d: "Symbols offer layers people can apply to their own situations, making them lasting and deeply human." }
        ] },
        { t: "p", text: "That is why the Jewish prophets and rabbis, including Jesus, so often spoke in **parables** (Matthew 13:34). Revelation communicates the **Jewish way**: through layers of symbolic meaning in dramatic, often surreal imagery. From a Jewish point of view, it is frustrating to see so many Western Christians insist on reading Revelation as literally as possible." }
      ]
    },
    {
      h: "Reading Revelation “As Literally As Possible”",
      blocks: [
        { t: "p", text: "Some popular teachers say the key to Revelation is to read it “as literally as possible,” taking every word in its ordinary, literal meaning. Challenge accepted! Revelation has hundreds of symbols. Here are just a few, read literally, to show how quickly it becomes a surreal and comical nightmare." },
        { t: "table", title: "What a strictly literal reading would mean", head: ["Passage", "The image", "Taken literally…"], rows: [
          ["Revelation 3:12", "The faithful made “a pillar in the temple”", "You become a marble column forever. Corinthian or Ionic style?"],
          ["Revelation 8:12", "A third of the sun, moon and stars struck", "The sun sliced like a pie while the rest keeps shining."],
          ["Revelation 8:13", "An eagle cries “Woe! Woe! Woe!”", "God sends His message through a bird with a megaphone."],
          ["Revelation 9:7-8", "Locusts with human faces, crowns, women’s hair, lions’ teeth", "An evolutionary nightmare: part insect, human, mammal and reptile."],
          ["Revelation 9:17-19", "Horses with tails like snakes", "Soldiers riding fanged, snake-tailed stallions."],
          ["Revelation 10:9-10", "John eats a scroll, sweet then bitter", "A divine snack, munching paper like a celestial goat."],
          ["Revelation 12:1", "A woman clothed with the sun, standing on the moon, crowned with twelve stars", "A gravity-defying acrobat wearing balls of burning gas."],
          ["Revelation 12:3-4", "A red dragon with seven heads and ten horns waiting to devour a newborn", "A literal monster roaming the heavens for an infant buffet."],
          ["Revelation 12:15-16", "The earth opens its mouth and swallows a river", "The planet grows a digestive system."],
          ["Revelation 17:1-3", "A prostitute riding a scarlet beast, drunk with the blood of saints", "A giant red monster as personal transport, plus a diplomatic scandal with kings."],
          ["Revelation 19:17-18", "Birds invited to feast on human flesh", "A heavenly barbecue with vultures as VIP guests."],
          ["Revelation 19:15", "A sword coming out of the rider’s mouth", "Swinging a weapon with your teeth while giving a speech."],
          ["Revelation 21:16", "New Jerusalem a perfect cube, about 1,500 miles each way", "A giant floating cube crammed with people."],
          ["Revelation 22:1-2", "Trees of life on both sides of one river, feeding the nations", "Endless queues at the heavenly fruit stand."]
        ] },
        { t: "callout", kind: "warn", title: "The result", text: "Read “as literally as possible,” Revelation becomes a bizarre, impossible spectacle that defies logic, science and basic coherence. The absurdity shows how unnatural that approach is. A literal reading turns a profound symbolic vision into an incoherent fantasy." }
      ]
    },
    {
      h: "What a Symbolic Reading Looks Like",
      blocks: [
        { t: "p", text: "Reading symbolically does **not** mean nothing real is described. Symbol and reality often go together in prophecy: vivid pictures convey deep truths without describing physical events step by step." },
        { t: "p", text: "**Daniel 7:** “Four great beasts, each different from the others, came up out of the sea.” Not Hollywood monsters trampling cities, but **kingdoms**: traditionally Babylon, Medo-Persia, Greece and Rome. Since Israel lies on the Mediterranean coast, “rising from the sea” came to symbolize **foreign powers arriving**." },
        { t: "p", text: "**Isaiah 46:11:** “A bird of prey from the east” is not a real bird but most likely **Cyrus the Great** of Persia. Prophecy uses striking images to depict real historical figures and events." },
        { t: "quote", text: "Tie them as symbols on your hands and bind them on your foreheads.", ref: "Deuteronomy 6:8" },
        { t: "p", text: "**The mark of the beast (Revelation 13:16-18).** Some today see it as a microchip, barcode or vaccine. Such a thing might one day happen, but to a first-century Jew, marks on the **hand and forehead** recalled Deuteronomy 6:8, where God’s commands were bound “as a sign on your hand” and “frontlets between your eyes.” The mark was a symbol of **allegiance**. Likewise, “a seal on the foreheads of the servants of our God” (Revelation 7:3) meant loyalty to God, not a literal mark on the skin." },
        { t: "compare", title: "The mark on hand and forehead", cols: [
          { h: "Modern literal guess", items: ["Microchip", "Barcode", "Vaccine", "A physical mark on the body"] },
          { h: "First-century Jewish hearing", items: ["Echo of Deuteronomy 6:8", "Hand = what you do", "Forehead = what you think and love", "A sign of whom you belong to and serve"] }
        ] },
        { t: "term", word: "Gematria", heb: "גִּימַטְרִיָּה", lang: "Hebrew", meaning: "Jewish number-reading. Each Hebrew letter also stands for a number, so a name can be “added up.”" },
        { t: "p", text: "**The beast of Revelation 13.** The first readers would likely see **Rome**, the oppressive empire of their day. Its seven heads are “seven hills” (Revelation 17:9), and Rome was famous as the city of seven hills. **Nero**, notorious for persecuting believers, is strongly linked to the beast: spelled in Hebrew letters, “Nero Caesar” adds up to **666**." }
      ]
    },
    {
      h: "Why Is Symbolic Reading Taboo? Hope, Not Fear",
      blocks: [
        { t: "p", text: "Many Christians see symbolic reading as compromise, weak faith or lack of trust in God. But this feeling rests on an **appeal to fear and loyalty** (the “appeal to fear” fallacy), not on careful study. Not taking Revelation at face value does **not** dismiss its truth. It means reading it **as it was meant to be read**: in the symbolic tradition of Jewish apocalyptic literature." },
        { t: "p", text: "Insisting that only a literal reading is faithful ignores the genre, the history and how prophecy has worked in Judaism for thousands of years. Ironically, forcing a literal reading on a symbolic text is what **distorts** it." },
        { t: "callout", kind: "note", title: "An example of fear-driven reading", text: "One pastor explained that he takes everything literally unless the text says “as” or “like,” because he will have to give an account to the King for what he teaches. Faithfulness to Scripture truly matters, since we will answer for how we represent God. But here, fear may produce the very opposite of what is intended." },
        { t: "p", text: "Read in its Jewish context, Revelation stops being a literal end-time timetable and becomes what it was meant to be: **a message of hope**. It reassures a suffering church that despite Rome’s power (or any oppressive system), **God reigns**. Jesus, the slain Lamb, has already won the decisive victory. The judgment scenes are not predictions of a literal cataclysm but a dramatic way of saying that the empires of this world will fall before God’s justice." },
        { t: "compare", title: "Two outcomes of reading Revelation", cols: [
          { h: "Sensational literalism", items: ["Spooky blood moons", "Sinister microchips", "A sudden whisking away of a chosen few", "Convenient political conspiracies", "Fear and speculation"] },
          { h: "Jewish symbolic reading", items: ["God reigns over every empire", "The slain Lamb has already won", "The struggle between God’s kingdom and darkness in every generation", "A call to faithfulness", "Hope and endurance"] }
        ] },
        { t: "callout", kind: "insight", title: "The key, not the obstacle", text: "The Jewishness of Revelation is not an obstacle to understanding it. It is the **key**. Read through Jewish apocalyptic eyes, Revelation is a bold declaration that Jesus, the Messiah of Israel, is Lord of history, and that His kingdom will prevail, not only in a distant future, but **even now**, wherever His followers stay faithful." },
        { t: "flip", title: "Flashcards", items: [
          { front: "Why does biblical Hebrew use so many metaphors?", back: "Its vocabulary is relatively small, so writers used pictures and figures of speech to express complex ideas." },
          { front: "What does Revelation 2:7 repeatedly say?", back: "“Whoever has ears, let them hear”: understanding prophecy needs spiritual discernment." },
          { front: "Why is Satan called “the ultimate literalist”?", back: "He failed to grasp that the suffering servant would conquer death by dying, a truth veiled in symbols." },
          { front: "What did the mark on hand and forehead echo?", back: "Deuteronomy 6:8: God’s commands bound on the hand and between the eyes, a sign of allegiance." },
          { front: "What do the beast’s seven heads represent?", back: "Seven hills (Revelation 17:9), pointing to Rome, the city of seven hills." },
          { front: "What is Revelation’s main purpose?", back: "Encouragement and hope for the persecuted, not fearful speculation." }
        ] }
      ]
    }
  ],
  keypoints: [
    "The Bible is a Hebrew masterpiece that speaks in metaphors; Hebrew’s limited vocabulary encouraged rich figurative speech.",
    "Jesus warned in pictures (narrow gate, wolves in sheep’s clothing, house on sand), and John follows his Rabbi.",
    "Daniel, Zechariah, Ezekiel, 1 Enoch and 4 Ezra all use wild images that no Jewish reader took literally.",
    "Symbolic prophecy is a divine filter: Satan, the ultimate literalist, missed that the Messiah’s death would defeat evil (1 Corinthians 2:8).",
    "Symbolic language works on many levels, crosses cultures and speaks to the heart, and it also helped John write safely under Rome.",
    "Reading Revelation “as literally as possible” produces absurd results: human pillars, sliced suns, snake-tailed horses, a planet that drinks rivers.",
    "The mark on the hand and forehead echoes Deuteronomy 6:8 as a sign of allegiance; the beast with seven hills points to Rome, and 666 to Nero.",
    "Revelation is a message of hope: God reigns, the slain Lamb has already won, and believers are called to faithfulness now."
  ],
  quiz: [
    { q: "According to this chapter, why did God veil His plan of redemption in symbolic prophecy?", options: ["To make the Bible hard for everyone", "To hide it from those who would oppose it while revealing it to the spiritually discerning", "Because Hebrew had no plain words", "To keep it secret from the prophets"], answer: 1, why: "Symbolic prophecy acted as a divine filter; Satan misread it and helped bring about his own defeat (1 Corinthians 2:8)." },
    { q: "What did marks on the hand and forehead suggest to a first-century Jewish reader?", options: ["A microchip", "A tattoo required by Rome", "Allegiance, echoing Deuteronomy 6:8", "A medical vaccine"], answer: 2, why: "God’s commands were bound on the hand and between the eyes; the mark signals whom one serves." },
    { q: "Which clue in Revelation links the beast to Rome?", options: ["Its seven heads are seven hills (Revelation 17:9)", "It speaks Latin", "It rises from the Jordan River", "It has twelve stars"], answer: 0, why: "Rome was known as the city of seven hills; Nero’s name in Hebrew letters also adds up to 666." },
    { q: "In Isaiah 46:11, “a bird of prey from the east” most likely represents…", options: ["A real eagle", "Cyrus the Great of Persia", "An angel", "Babylon’s army"], answer: 1, why: "Prophecy used striking images for historical figures; this picture likely points to Cyrus." },
    { q: "What is the main purpose of Revelation when read in its Jewish context?", options: ["To give a precise date for the end", "To warn about microchips and blood moons", "To encourage the suffering church that God reigns and the Lamb has won", "To replace the Hebrew prophets"], answer: 2, why: "Revelation is a message of hope and a call to faithfulness, not fearful speculation." }
  ]
},
{
  id: "r04-daniel-the-backbone-of-revelation",
  title: "The Book of Daniel: The Backbone of Revelation",
  summary: "Daniel’s stories of faithful exiles and his visions of beasts, a great statue, the Son of Man and the resurrection form the backbone of Revelation’s imagery and message.",
  sections: [
    {
      h: "Daniel in a Nutshell",
      blocks: [
        { t: "p", text: "Before exploring Revelation, it helps to survey the **Book of Daniel** in the Hebrew Scriptures. Daniel is written in both **Hebrew and Aramaic** and blends **story and prophecy**: historical accounts and apocalyptic visions." },
        { t: "p", text: "It is set during the **Babylonian exile**, after King **Nebuchadnezzar** conquered Jerusalem (6th century BC). Daniel and his three friends, **Shadrach, Meshach and Abednego**, are taken captive, yet they stay faithful to the God of Israel despite huge pressure to blend into Babylon’s pagan culture." },
        { t: "tree", title: "The structure of Daniel", root: "The Book of Daniel", children: [
          { h: "Chapters 1–6: Stories", d: "Daniel and his friends in Babylon", children: [
            { h: "Interpreting Nebuchadnezzar’s dreams" },
            { h: "The fiery furnace (ch. 3)" },
            { h: "The lions’ den (ch. 6)" }
          ] },
          { h: "Chapters 7–12: Visions", d: "The future of world kingdoms and God’s rule", children: [
            { h: "The four beasts (ch. 7)" },
            { h: "The ram and the goat (ch. 8)" },
            { h: "The seventy weeks (ch. 9)", d: "Much argued over by end-times enthusiasts" }
          ] }
        ] },
        { t: "cards", title: "Key themes", items: [
          { h: "Faithfulness in exile", d: "Daniel and his friends keep worshiping God despite persecution." },
          { h: "God’s sovereignty over kingdoms", d: "Beastly, oppressive rulers are temporary; God will overcome them." },
          { h: "Prophecy and the end", d: "Visions of future empires, the coming “Son of Man,” and the final victory of God’s kingdom." }
        ] }
      ]
    },
    {
      h: "The Four Beasts (Daniel 7 & Revelation 13, 17)",
      blocks: [
        { t: "p", text: "Daniel’s visions are foundational for Revelation, which builds on his imagery. In Daniel 7, four beasts stand for **successive world empires**, ending with a terrifying beast with **ten horns**. Revelation echoes this with its own ten-horned beast, picturing oppressive world systems that oppose God." },
        { t: "table", title: "Daniel’s four beasts", head: ["Beast", "Empire", "Details"], rows: [
          ["Lion with eagle’s wings", "Babylon (605–539 BC)", "Plucked wings may picture Nebuchadnezzar humbled before God (Daniel 4)."],
          ["Bear raised on one side", "Medo-Persia (539–331 BC)", "Raised side: Persia stronger than the Medes. Three ribs: its conquests (Babylon, Lydia, Egypt)."],
          ["Leopard with four wings and four heads", "Greece (331–168 BC)", "Wings: Alexander the Great’s speed. Four heads: his empire split among four generals."],
          ["Terrifying beast with iron teeth and ten horns", "Rome (168 BC–AD 476)", "More dreadful than the rest; ten horns show power and future divisions."]
        ] },
        { t: "timeline", title: "The empires in order", items: [
          { when: "605–539 BC", h: "Babylon", d: "The lion with eagle’s wings." },
          { when: "539–331 BC", h: "Medo-Persia", d: "The lopsided bear." },
          { when: "331–168 BC", h: "Greece", d: "The swift, four-headed leopard." },
          { when: "168 BC–AD 476", h: "Rome", d: "The iron-toothed, ten-horned beast." }
        ] },
        { t: "callout", kind: "insight", title: "Revelation’s composite beast", text: "Revelation 13 describes a beast with features of Daniel’s beasts (lion, bear, leopard) rolled into one. The message: **oppressive empires keep reappearing throughout history**, and God will judge them all." }
      ]
    },
    {
      h: "The Little Horn",
      blocks: [
        { t: "p", text: "From the fourth beast’s horns comes a **“little horn”** (Daniel 7:7-8, 20-25). It is an arrogant, oppressive ruler or power that:" },
        { t: "list", items: [
          "Rises by displacing three earlier kings",
          "Speaks boastfully against God",
          "Persecutes God’s people",
          "Tries to change sacred times and laws"
        ] },
        { t: "p", text: "Historically, this fits **Antiochus IV Epiphanes**, the Seleucid (Greek-Syrian) king who desecrated the Jerusalem Temple in the **2nd century BC** and brutally persecuted the Jews." },
        { t: "cycle", title: "The little horn as a recurring pattern", center: "Anti-God power", hint: "The pattern repeats", items: [
          { h: "Antiochus IV", d: "2nd century BC: desecrates the Temple and persecutes the Jews." },
          { h: "Rome’s beast", d: "Revelation 13:5-7: a beast that blasphemes and wars against the saints." },
          { h: "Antichrist figures in history", d: "Tyrants who exalt themselves and oppress God’s people." },
          { h: "A final climax", d: "Possibly a last, climactic Antichrist at the very end of time." }
        ] },
        { t: "callout", kind: "note", text: "Seen as a **recurring theme**, the little horn is not only one ruler. It points to anti-God powers across history, possibly ending in a final Antichrist. Revelation 13:5-7 echoes it with a beast that shares the little horn’s traits." }
      ]
    },
    {
      h: "The Son of Man and the End of Oppressive Kingdoms",
      blocks: [
        { t: "term", word: "Son of Man", heb: "בַּר אֱנָשׁ", lang: "Aramaic", meaning: "“Bar enash,” literally “son of man” or “human one.” In Daniel 7:13-14 a heavenly human figure receives eternal dominion from God. Jesus used it as His favorite title for Himself." },
        { t: "quote", text: "I saw… one like a son of man, coming with the clouds of heaven… He was given authority, glory and sovereign power; all nations and peoples of every language worshiped him.", ref: "Daniel 7:13-14" },
        { t: "p", text: "Both books end with **God’s victory**: the Son of Man establishes God’s eternal kingdom and destroys the oppression of the old world systems. In Daniel’s vision, the Son of Man is exalted and given dominion over all nations. Jesus applies this title to Himself (Mark 14:62), and Revelation shows Him returning in power and reigning as King (Revelation 1:7; 14:14)." },
        { t: "flow", title: "The Son of Man thread", nodes: [
          { h: "Daniel 7:13-14", d: "One like a son of man receives the kingdom" },
          { h: "Mark 14:62", d: "Jesus claims the title before the high priest" },
          { h: "Revelation 1:7; 14:14", d: "He comes with the clouds and reigns" }
        ] },
        { t: "p", text: "**Daniel 2** gives another picture of the end of human empires (compare Daniel 2:44; 7:26-27 with Revelation 19:11-21). King Nebuchadnezzar dreams of a great statue made of different materials, each standing for a world empire." },
        { t: "steps", title: "Nebuchadnezzar’s statue (Daniel 2)", items: [
          { h: "Head of gold", d: "Babylon (Daniel 2:38): wealth and prominence." },
          { h: "Chest and arms of silver", d: "Medo-Persia, which followed." },
          { h: "Belly and thighs of bronze", d: "Greece, likely the era of Alexander the Great." },
          { h: "Legs of iron", d: "Rome: strong and ruthless in conquest." },
          { h: "Feet of iron mixed with clay", d: "A divided, unstable kingdom after Rome, strong on the surface but weak inside." },
          { h: "The stone", d: "Strikes and destroys the statue: God’s eternal kingdom replacing all human empires." }
        ] },
        { t: "quote", text: "As you saw iron mixed with soft clay, so they will mix with one another in marriage, but they will not hold together, just as iron does not mix with clay.", ref: "Daniel 2:43" },
        { t: "p", text: "The iron and clay picture a broken kingdom that may try to unite through political alliances, yet fails. Verse 43 is much debated and other readings are possible, but historically it has often been seen as **Europe after Rome’s fall**: despite many alliances and royal marriages, it stayed divided and unstable." },
        { t: "callout", kind: "insight", text: "The stone not cut by human hands is **God’s kingdom**, outlasting every empire. Revelation shows the same climax: Christ’s final victory over earthly powers, when **Babylon**, the symbol of the corrupt world system, is shattered." }
      ]
    },
    {
      h: "Resurrection, Judgment and Daniel’s Lasting Hope",
      blocks: [
        { t: "quote", text: "Multitudes who sleep in the dust of the earth will awake: some to everlasting life, others to shame and everlasting contempt. Those who are wise will shine like the brightness of the heavens.", ref: "Daniel 12:2-3" },
        { t: "p", text: "Daniel speaks of a **resurrection** where the righteous shine like stars and the wicked face shame and disgrace. Revelation expands this into the **final judgment**, where the dead are judged according to their deeds (Revelation 20:11-15)." },
        { t: "table", title: "Daniel ↔ Revelation: the key parallels", head: ["Theme", "Daniel", "Revelation"], rows: [
          ["Beasts as empires", "Four beasts; ten-horned fourth beast (ch. 7)", "Ten-horned composite beast (ch. 13, 17)"],
          ["Arrogant anti-God ruler", "The little horn (7:7-8, 20-25)", "Beast that blasphemes and wars on the saints (13:5-7)"],
          ["God’s King", "One like a son of man (7:13-14)", "Christ coming with the clouds, reigning (1:7; 14:14)"],
          ["End of human empires", "Statue struck by the stone (2:44; 7:26-27)", "Babylon falls; the rider defeats the nations (19:11-21)"],
          ["Resurrection and judgment", "Some to life, some to shame (12:2-3)", "The dead judged by their deeds (20:11-15)"]
        ] },
        { t: "p", text: "Daniel’s message reaches far beyond its own time. It is a promise to **persecuted believers in every age**. When human kingdoms thirst only for endless power and wealth and set themselves above God, they become **oppressive and beastly**. Yet God’s justice will win, ending in the reign of the Son of Man." },
        { t: "p", text: "Revelation carries this theme forward and presents Christ as the **fulfillment of Daniel’s prophecies**. Together, these books give a powerful vision of the end that encourages faithfulness in suffering and confidence in God’s final victory." },
        { t: "callout", kind: "insight", title: "Hope for every generation", text: "Even when evil seems to win, God sees and has a plan to overcome it, though it may not unfold in our lifetime. Many before us faced similar dark times. Like them, we are called to trust God’s greater purpose and wait for His final **restoration of all things** (Acts 3:21)." },
        { t: "flip", title: "Flashcards", items: [
          { front: "In what two languages is Daniel written?", back: "Hebrew and Aramaic." },
          { front: "Which empire is the lion with eagle’s wings?", back: "Babylon (605–539 BC)." },
          { front: "What do the leopard’s four heads likely mean?", back: "Alexander the Great’s empire divided among four generals." },
          { front: "Who historically fits the “little horn”?", back: "Antiochus IV Epiphanes, who desecrated the Temple in the 2nd century BC." },
          { front: "What does the stone in Daniel 2 represent?", back: "God’s eternal kingdom, which destroys and replaces all human empires." },
          { front: "Where does Jesus claim the Son of Man title?", back: "Mark 14:62, before the high priest." }
        ] }
      ]
    }
  ],
  keypoints: [
    "Daniel, written in Hebrew and Aramaic, is set in the Babylonian exile and mixes stories (ch. 1–6) with visions (ch. 7–12).",
    "Its key themes are faithfulness in exile, God’s sovereignty over kingdoms, and the final victory of God’s kingdom.",
    "Daniel’s four beasts are Babylon, Medo-Persia, Greece and Rome; Revelation’s beast combines their features.",
    "The little horn fits Antiochus IV Epiphanes, but as a recurring pattern it points to anti-God powers throughout history.",
    "The “Son of Man” of Daniel 7 receives eternal dominion; Jesus claimed the title (Mark 14:62) and Revelation shows Him reigning.",
    "Nebuchadnezzar’s statue (gold, silver, bronze, iron, iron-and-clay) is shattered by a stone: God’s kingdom replacing human empires.",
    "Daniel 12’s resurrection becomes Revelation 20’s final judgment.",
    "Both books offer hope: beastly empires fall, God’s justice prevails, and believers are called to faithful endurance."
  ],
  quiz: [
    { q: "Which empire does the leopard with four wings and four heads represent?", options: ["Babylon", "Medo-Persia", "Rome", "Greece"], answer: 3, why: "The wings show Alexander’s speed; the four heads likely show his empire divided among four generals." },
    { q: "Which historical ruler best fits Daniel’s “little horn”?", options: ["Cyrus the Great", "Antiochus IV Epiphanes", "Nebuchadnezzar", "Alexander the Great"], answer: 1, why: "Antiochus IV desecrated the Jerusalem Temple and persecuted the Jews in the 2nd century BC." },
    { q: "In Nebuchadnezzar’s statue, what does the stone that strikes it represent?", options: ["God’s eternal kingdom replacing human empires", "The Roman army", "A meteor", "The Temple"], answer: 0, why: "The stone symbolizes God’s kingdom, which supplants all human kingdoms, as Revelation shows Babylon shattered." },
