{
  id: "r05-seven-churches",
  title: "Revelation 1-3: The Seven Churches",
  summary: "Revelation opens as an 'unveiling' of God's view of history. Jesus walks among seven real churches in Asia Minor, praising and correcting them, and calls them to 'conquer' through faithful, loving endurance rather than violence or compromise.",
  sections: [
    {
      h: "An Unveiling, Not a Catastrophe",
      blocks: [
        { t: "quote", text: "The revelation from Jesus Christ, which God gave him to show his servants what must soon take place.", ref: "Revelation 1:1" },
        { t: "term", word: "Apokalypsis", heb: "ἀποκάλυψις", lang: "Greek", meaning: "'Revelation' or 'unveiling'. The very first word of the book. It means a divine disclosure: uncovering a truth that was already there but hidden. It does not mean chaos or the end of the world, as the modern word 'apocalypse' suggests." },
        { t: "compare", title: "Two meanings of 'apocalypse'", cols: [
          { h: "Modern use", items: ["Chaos and destruction", "The end of the world", "Disaster movies and fear"] },
          { h: "Biblical meaning", items: ["A divine disclosure", "Uncovering secrets that were hidden", "God's perspective on the human story", "How the present world will be transformed by God's plan"] }
        ] },
        { t: "p", text: "In Revelation, John receives **God's perspective** on human history. The book shows how the present world will finally be transformed by His divine plan." }
      ]
    },
    {
      h: "A Prophecy to Warn and to Comfort",
      blocks: [
        { t: "p", text: "John insists that his vision is not his own invention. It is **prophecy**. But in the Bible, prophecy is mostly *not* about predicting the future." },
        { t: "table", title: "What biblical prophecy is mostly about (a rough estimate)", head: ["Share", "Focus", "Examples"], rows: [
          ["About 20-25%", "Future events", "Messianic prophecies, end-time visions, the final judgment"],
          ["About 75-80%", "The prophet's own day", "Warnings, calls to repentance, corrections, messages of hope and restoration for Israel and the nations"]
        ] },
        { t: "callout", kind: "insight", title: "Exegesis, not eisegesis", text: "Whether or not these numbers are exact, the lesson is clear. To read faithfully we must draw meaning **out of** the text in its original setting (*exegesis*), not read our own news, culture and assumptions **into** it (*eisegesis*)." },
        { t: "p", text: "John says these things 'must soon take place'. That can puzzle readers 2,000 years later. In fact, most (not all) of Revelation's events did happen, or were about to happen, in John's own day. Yet Jewish prophecy often works in **patterns and cycles** rather than one fixed timetable. The same idea keeps repeating in new forms through history until its final fulfillment." },
        { t: "list", title: "How to read Revelation", items: [
          "It reveals God's heavenly view of history and deeper spiritual realities, not just a timeline.",
          "Its symbols and numbers are meant to communicate, not confuse.",
          "Almost every vision is woven from Old Testament images and other Jewish apocalyptic writings, and John expects readers to recognise them.",
          "Its meaning is anchored in John's own time and place, yet the pattern repeats in every generation."
        ] }
      ]
    },
    {
      h: "John's Audience and the Vision on Patmos",
      blocks: [
        { t: "p", text: "John writes to **seven churches** in the Roman province of Asia (modern-day Turkey). There were more than seven Christian communities there, so the choice was deliberate. These churches were real, but they also stand for the spiritual conditions of the whole Church through history." },
        { t: "cards", title: "Seven: the number of divine completeness", items: [
          { h: "Seven days of creation", d: "Genesis 1" },
          { h: "Seven lamps in the Tabernacle", d: "Exodus 25:37" },
          { h: "Seven marches around Jericho", d: "Joshua 6:15-16" },
          { h: "Sevens in Revelation", d: "Seven seals (6:1), seven trumpets (8:6), seven bowls (16:1), seven spirits before God's throne (1:4)" }
        ] },
        { t: "p", text: "John received his vision while exiled on **Patmos** (Revelation 1:9), a barren island in the Aegean Sea. Rome used it to hold political and religious dissidents. Christians refused to worship the emperor, so they were seen as a threat to the empire. John's exile was probably part of the growing persecution under **Emperor Domitian** (AD 81-96)." },
        { t: "p", text: "There, alone, John sees the risen Jesus standing among **seven golden lampstands** (Revelation 1:20). The picture comes from Zechariah 4, where a golden lampstand stands for God's presence among His people. In Revelation the lampstands are the seven churches. Jesus, shining with divine glory, walks among them: He knows their struggles intimately and has full authority over His Church." }
      ]
    },
    {
      h: "Faithfulness or Compromise? The Seven Messages",
      blocks: [
        { t: "p", text: "Jesus speaks to each church, giving both praise and correction. Some were complacent, some had slipped into moral compromise, and some were enduring harassment and persecution." },
        { t: "table", title: "The seven churches at a glance", head: ["Church", "Passage", "Condition", "What it looks like today"], rows: [
          ["Ephesus", "Revelation 2:1-7", "Pure doctrine but lost its 'first love'; zealous for truth but drifted into mere religious duty", "Believers who are theologically zealous but cold, rigid or legalistic, putting doctrine above love and missing the heart of the gospel"],
          ["Smyrna", "Revelation 2:8-11", "Faithful amid intense persecution; told to stay steadfast even unto death", "Underground and persecuted Christians (e.g. China, North Korea, parts of Asia and the Middle East) who endure prison, violence or death yet stay faithful"],
          ["Pergamum", "Revelation 2:12-17", "Compromise: some embraced false teaching that led to idolatry and immorality", "Watering down biblical truth and blending faith with idolatry, e.g. the prosperity gospel, where faith is compromised by the pursuit of wealth"],
          ["Thyatira", "Revelation 2:18-29", "Tolerated a false prophetess, 'Jezebel', who led many into corruption", "Letting charismatic but deceptive leaders manipulate people for power or money under the guise of prophecy: cult-like movements, some televangelists"],
          ["Sardis", "Revelation 3:1-6", "Spiritually dead: a reputation for being alive, but lifeless faith", "Ministries that became 'clubs': busy with programs, newsletters, online presence and big events, yet spiritually empty, living on tradition or past success"],
          ["Philadelphia", "Revelation 3:7-13", "A faithful remnant that kept Jesus' word despite opposition", "Small, often unnoticed churches and believers who stay true to Christ under cultural pressure and marginalisation, deeply valued in God's Kingdom"],
          ["Laodicea", "Revelation 3:14-22", "Lukewarm, comfortable and self-reliant, neither hot nor cold: 'I will spit you out of my mouth' (3:16)", "Churches that prize diplomacy over truth, afraid to confront anything for fear of offending: inoffensive, comfortable and ineffective"]
        ] },
        { t: "callout", kind: "note", title: "Who was 'Jezebel'?", text: "She may not have been a literal woman. The name likely points to a 'spirit of Jezebel' (deception and corruption), like the historical Jezebel of 1 and 2 Kings who led Israel into idolatry and immorality. It could also stand for a group, an ideology, or a corrupt leader influencing the church." },
        { t: "quote", text: "You will break them with a rod of iron; you will dash them to pieces like pottery.", ref: "Psalm 2:9 (quoted in Revelation 2:27)" },
        { t: "p", text: "The warning to Thyatira quotes Psalm 2:9 directly. The early church historian **Eusebius of Caesarea** (c. 260-340) offered a hopeful reading: the Son 'breaks' His enemies in order to **remould** them, as a potter reshapes his own clay (Jeremiah 18:6), restoring them to their former state." },
        { t: "callout", kind: "insight", text: "These churches are both **historical** and **symbolic**. Throughout Christian history, some churches look like Philadelphia, faithful under persecution, while others look like Laodicea, trusting in wealth and comfort instead of true devotion." }
      ]
    },
    {
      h: "Faithfulness as Conquering",
      blocks: [
        { t: "p", text: "Faithfulness in Revelation is not religious stubbornness. It is not about how long your sleeves are or how 'orthodox' your theology is. It is **loyalty to Christ's ways** under pressure. Rome, like oppressive regimes since, demanded total allegiance, forcing believers to choose between social, economic or even physical survival and their commitment to Jesus." },
        { t: "timeline", title: "The pressure on the churches", items: [
          { when: "AD 60s", h: "Nero's persecution", d: "Brutal persecution of Christians, already past by the time John wrote." },
          { when: "AD 81-96", h: "Domitian's reign", d: "Enforced emperor worship, exiled leaders like John to Patmos, and executed those who would not call him 'Lord and God' by beheading, crucifixion, burning and wild beasts in the arena." },
          { when: "John's letter", h: "A call to conquer", d: "The temptation to deny Jesus was overwhelming; Jesus calls the churches to stay faithful." }
        ] },
        { t: "p", text: "Jesus urges the churches to **'conquer'**, a war word. Those who stay steadfast will be rewarded in the final marriage of Heaven and Earth (Revelation 21-22), receiving honour in God's future kingdom, pictured as becoming **'pillars' in God's temple** (Revelation 3:12)." },
        { t: "compare", title: "Salvation and reward", cols: [
          { h: "A common Western view", items: ["Salvation is a simple binary: heaven or hell", "Faithfulness is often confused with legalistic rigidity"] },
          { h: "The fuller biblical picture", items: ["Jesus spoke of varying rewards in the Kingdom (Matthew 5:19)", "Faithfulness shapes one's role in the world to come", "Faithfulness means trust, perseverance and commitment to Jesus' Way (Matthew 5-7)"] }
        ] },
        { t: "steps", title: "What 'conquering' looks like", items: [
          { h: "Love over hatred", d: "Loving enemies even when they mock your faith and seek to harm you." },
          { h: "Mercy over retaliation", d: "Refusing to answer evil with evil." },
          { h: "Trust over fear", d: "Neither violent resistance nor fearful submission, but unwavering trust." },
          { h: "Endurance", d: "Sacrificial love and endurance define true faithfulness, not clinging to rules for their own sake." }
        ] },
        { t: "callout", kind: "insight", title: "The core tension of the book", text: "Will God's people 'conquer' (Revelation 3:5) despite persecution? Revelation uses war language again and again (e.g. 1:16; 2:16; 6:4; 12:7; 13:7; 19:15) because faithfulness is how believers take part in the cosmic war against evil. It is fought not with swords but with endurance, sacrificial love and trust. **To conquer is not to kill one's enemies, but to love them as the Lamb did.**" },
        { t: "callout", kind: "warn", title: "A note on Revelation 3:10", text: "Some read 'I will keep you from the hour of trial' as proof of a pre-tribulation rapture of the Church. This study holds that this reading takes the verse out of context and adds assumptions that are not there, and that the pre-tribulation rapture idea is not supported by Scripture and distorts the heart of the gospel. The rapture debate itself is not covered further here." },
        { t: "flip", title: "Flashcards: the seven churches", items: [ { front: "Apokalypsis", back: "Greek for unveiling: God disclosing hidden truth and His view of history." }, { front: "Exegesis vs. eisegesis", back: "Drawing meaning out of the text in context vs. reading our own assumptions into it." }, { front: "Seven golden lampstands", back: "The seven churches (Rev 1:20), drawn from Zechariah 4: God present among His people." }, { front: "Ephesus / Laodicea", back: "Ephesus: truth without love. Laodicea: lukewarm, comfortable and self-reliant." }, { front: "Smyrna / Philadelphia", back: "Smyrna: faithful under persecution. Philadelphia: a faithful remnant keeping His word." }, { front: "To conquer", back: "Faithful, loving endurance; not killing enemies but loving them as the Lamb did." } ] } ] }
  ],
  keypoints: [
    "'Apokalypsis' means 'unveiling': God revealing His view of history, not a picture of chaos.",
    "Most biblical prophecy speaks to the prophet's own day; read Revelation in its original context (exegesis, not eisegesis).",
    "Jewish prophecy works in repeating patterns and cycles that build toward a final fulfillment.",
    "The seven churches were real communities in Asia Minor and also symbols of the Church's spiritual conditions in every age.",
    "John wrote from exile on Patmos, probably under Domitian, who demanded worship as 'Lord and God'.",
    "Each church receives praise and/or correction: from Ephesus' lost first love to Laodicea's lukewarm comfort.",
    "To 'conquer' in Revelation means faithful, loving endurance, not violence or legalism; the faithful become 'pillars' in God's temple."
  ],
  quiz: [
    { q: "What does the Greek word 'apokalypsis' mean?", options: ["Destruction of the world", "Unveiling or revelation", "Final battle", "Secret code"], answer: 1, why: "It means a divine disclosure: uncovering truth that was previously hidden." },
    { q: "Which church was praised for doctrinal purity but rebuked for losing its first love?", options: ["Laodicea", "Smyrna", "Sardis", "Ephesus"], answer: 3, why: "Ephesus guarded truth zealously but had drifted into duty without love (Revelation 2:1-7)." },
    { q: "Which Old Testament passage lies behind the image of the golden lampstand(s)?", options: ["Zechariah 4", "Genesis 49", "Daniel 12", "Psalm 94"], answer: 0, why: "In Zechariah 4 a golden lampstand represents God's presence among His people; in Revelation the lampstands are the churches." },
    { q: "According to Revelation, how do believers truly 'conquer'?", options: ["By violent resistance to Rome", "By strict rule-keeping", "By faithful, loving endurance and trust", "By escaping before trouble comes"], answer: 2, why: "To conquer is not to kill one's enemies but to love them as the Lamb did, enduring with trust." },
    { q: "Which church was 'lukewarm', comfortable and self-reliant?", options: ["Philadelphia", "Laodicea", "Pergamum", "Thyatira"], answer: 1, why: "Jesus told Laodicea, 'I will spit you out of my mouth' (Revelation 3:16)." }
  ]

{
  id: "r06-throne-room",
  title: "Revelation 4-5: The Heavenly Throne Room and First Judgment",
  summary: "John is taken into God's throne room, where no one is worthy to open the sealed scroll of God's plan until the Lion of Judah appears as a slain Lamb. His self-giving death is His victory, and it sets in motion three overlapping cycles of seven judgments.",
  sections: [
    {
      h: "The Throne Room: Who Rules History",
      blocks: [
        { t: "p", text: "John is taken up 'in the Spirit' into God's heavenly throne room. Every image here is drawn from earlier prophetic books. This scene is a turning point: it shows **God's absolute authority over history** before any judgment or redemption unfolds. The throne is not just scenery; it is a symbol of God's rule over heaven and earth." },
        { t: "table", title: "Throne-room images and their Old Testament roots", head: ["In Revelation", "Background", "Meaning"], rows: [
          ["God seated on the throne (4:2)", "Isaiah 6 (the Lord 'high and exalted'); Ezekiel 1 (God above a dazzling chariot-throne)", "God reigns over all"],
          ["24 elders in white (4:4)", "12 tribes of Israel + 12 apostles", "The fullness of God's people throughout history"],
          ["Four living creatures (4:6-8)", "Ezekiel 1:5-14", "All creation (wild animals, domestic beasts, birds and humans) worshipping the Creator"],
          ["'Holy, holy, holy' (4:8)", "Isaiah 6:3, the cry of the seraphim", "Tripled 'holy' stresses God's absolute purity, transcendence and perfection"]
        ] },
        { t: "quote", text: "Holy, holy, holy is the Lord God Almighty, who was, and is, and is to come.", ref: "Revelation 4:8" }
      ]
    },
    {
      h: "The Sealed Scroll: Who Is Worthy?",
      blocks: [
        { t: "p", text: "In God's right hand is a **scroll sealed with seven seals** (Revelation 5:1). Some translations, like the KJV, say 'book'. Seven seals mean the contents are fully secured, divinely decreed and out of reach for any human being. No one can bring in God's promised kingdom by their own power." },
        { t: "term", word: "Biblion", heb: "βιβλίον", lang: "Greek", meaning: "'Book' or 'scroll'. In John's day important writings were usually on rolled parchment (scrolls); bound books came later. Either translation means practically the same thing." },
        { t: "cards", title: "Sealed scrolls in the Old Testament", items: [
          { h: "Isaiah 8:16", d: "God seals up His testimony among His disciples." },
          { h: "Ezekiel 2-3", d: "A scroll full of lament, which Ezekiel is told to eat." },
          { h: "Daniel 12:4, 9", d: "A prophecy sealed until the time of the end." }
        ] },
        { t: "p", text: "So the scroll stands for **God's plan for the world's redemption**: His decree to bring salvation through judgment. It is the culmination of the Old Testament prophets' longing for redemption." },
        { t: "p", text: "Then comes the drama: **no one is found worthy** to open it (5:3). John weeps bitterly. If the scroll stays shut, God's purposes stay unknown or, worse, unfulfilled, and justice is never done." },
        { t: "callout", kind: "insight", title: "Why the tears? Think of Israel's priests", text: "A priest stood where heaven and earth meet. He was not just a ritual official but a **representative**: Israel's ambassador, carrying its name and hopes before God. But Israel's priests were limited, temporary and flawed, only shadows. Their sacrifices had to be repeated, and they had to atone for their own sins first. Creation longed for a true priest, a perfect mediator, to unlock the scroll, and none could be found." }
      ]
    },
    {
      h: "The Lion and the Lamb",
      blocks: [
        { t: "quote", text: "Do not weep! See, the Lion of the tribe of Judah, the Root of David, has triumphed. He is able to open the scroll and its seven seals.", ref: "Revelation 5:5" },
        { t: "p", text: "The **Lion of Judah** (Genesis 49:9) and the **Root of David** (Isaiah 11:1) are Messianic titles in Judaism. They call to mind a mighty king from David's line, whom many expected to bring God's kingdom by military victory." },
        { t: "quote", text: "Then I saw a Lamb, looking as if it had been slain, standing at the center of the throne.", ref: "Revelation 5:6" },
        { t: "flow", title: "John hears one thing and sees another", nodes: [
          { h: "John hears", d: "A conquering Lion of Judah" },
          { h: "John turns", d: "Expecting a warrior king" },
          { h: "John sees", d: "A little slain Lamb" },
          { h: "The lesson", d: "God conquers through self-sacrifice" }
        ] },
        { t: "term", word: "Arnion", heb: "ἀρνίον", lang: "Greek", meaning: "'Little lamb' or 'lambkin', the word for 'Lamb' in Revelation. Like the Passover lamb, it portrays Jesus' meekness, innocence and sacrifice as He begins God's kingdom." },
        { t: "p", text: "A good modern picture is the lion Aslan from a well-known Christian children's story: the warrior king of the animals who fought evil by dying for his friends." },
        { t: "compare", title: "The expected Messiah vs. the Lamb", cols: [
          { h: "What many expected", items: ["A roaring lion", "Military conquest", "Shedding enemies' blood", "Power through force"] },
          { h: "What John sees", items: ["A slain yet standing Lamb", "Victory through self-giving love", "Offering His own precious blood", "Power through laying down His life"] }
        ] },
        { t: "p", text: "Like the lamb's blood in Exodus 12 that protected and cleansed, Jesus' sacrifice brings redemption, cleansing not only Israel but the whole world (John 1:29). It also recalls Isaiah's **Suffering Servant**, 'led like a lamb to the slaughter' (Isaiah 53:7), who conquered through self-sacrifice. Jesus turned the primal human instinct for power upside down: He defeated evil by absorbing its worst blow and overcoming it through resurrection." },
        { t: "callout", kind: "note", text: "After 2,000 years we still try to change the world the way Rome did: by force, fear and manipulation. But Rome's iron-fisted empire is long gone, while the message of a crucified Jewish rabbi keeps transforming hearts around the world." }
      ]
    },
    {
      h: "The Lamb's Victory and Upside-Down Kingdom",
      blocks: [
        { t: "p", text: "Jesus' death was not a defeat. It was His **enthronement**, His conquest of sin, death and evil." },
        { t: "steps", title: "How the Lamb wins", items: [
          { h: "By dying and rising", d: "He overcomes the power of death (Hebrews 2:14)." },
          { h: "By suffering", d: "He defeats the forces of evil (Colossians 2:15)." },
          { h: "By offering Himself", d: "He ransoms people for God (Revelation 5:9)." },
          { h: "So He alone is worthy", d: "He takes the scroll and heaven bursts into worship." }
        ] },
        { t: "quote", text: "Worthy is the Lamb, who was slain, to receive power and wealth and wisdom and strength and honor and glory and praise!", ref: "Revelation 5:12" },
        { t: "p", text: "Angels, elders and living creatures, representing all creation, sing together. This may be a glimpse of the day 'every tongue confesses that Jesus Christ is Lord' (Philippians 2:11). Notice that the Lamb **shares divine authority** with God: He is not worshipped separately, but together with God as one." },
        { t: "compare", title: "Two ways to rule", cols: [
          { h: "The beastly way (Rome, Babylon, every dominating empire)", items: ["Power", "Oppression", "Violence", "Domination"] },
          { h: "The Lamb's way (Matthew 5-7)", items: ["The humble, meek and persecuted are blessed", "Enemies are loved, not hated", "Sinners are forgiven, not stoned", "Sacrificial love, compassion, meekness"] }
        ] }
      ]
    },
    {
      h: "Three Cycles of Seven: Unfolding Judgment",
      blocks: [
        { t: "p", text: "When the Lamb takes the scroll, history begins to unfold through three series of judgments, each built on the number seven." },
        { t: "tree", title: "The structure of the judgments", root: "The Lamb opens the scroll", children: [
          { h: "1. Seven Seals", d: "Revelation 6 - 8:1", children: [ { h: "The seventh seal opens into the trumpets" } ] },
          { h: "2. Seven Trumpets", d: "Revelation 8:2 - 11:19", children: [ { h: "The seventh trumpet introduces the bowls" } ] },
          { h: "3. Seven Bowls", d: "Revelation 15-16", children: [ { h: "Each cycle ends in the final judgment" } ] }
        ] },
        { t: "callout", kind: "insight", title: "Nesting dolls, or a spiral staircase", text: "These are **not** a simple chronological sequence. They are three overlapping views of the same period: the era between Jesus' ascension and His return. Like a spiral staircase, each cycle brings us back to the same truths from a higher vantage point, showing God's justice and mercy in new ways." },
        { t: "p", text: "Judgment in Revelation, as across the whole Bible, is not just punishment. **God's judgment always ends in redemption.**" },
        { t: "table", title: "Judgment that leads to redemption", head: ["Judgment", "Redemptive outcome"], rows: [
          ["The Flood (Genesis 6-9)", "Noah preserved to restart humanity"],
          ["Babel's scattering (Genesis 11:1-9)", "Led to the blessing of all nations through Abraham (Genesis 12:1-3)"],
          ["Plagues and Red Sea (Exodus 6:6-7; 12:51)", "Egypt judged, Israel set free"],
          ["Exile of Judah (Jeremiah 29:10-14; Ezekiel 36:24-28)", "Discipline with a promise of restoration"],
          ["The cross (Isaiah 53:5; Romans 3:24-26; 5:8-9)", "God judged sin to bring salvation"]
        ] },
        { t: "callout", kind: "note", title: "The Lamb reigns, even when you can't see it", text: "Before history's judgments are shown, we must know who rules history: God on His throne, with the slain Lamb sharing it as rightful King. The question for every reader: will we follow the way of the beast (power, domination, violence) or the way of the Lamb (sacrificial love, faithfulness, endurance)? However chaotic the world looks, the Lamb is on the throne and His kingdom will prevail." },
        { t: "flip", title: "Flashcards: the throne room", items: [ { front: "24 elders", back: "12 tribes + 12 apostles: the fullness of God's people." }, { front: "Four living creatures", back: "All creation worshipping God (Ezekiel 1:5-14)." }, { front: "The sealed scroll", back: "God's plan of redemption through judgment, which only a worthy mediator can open." }, { front: "Lion of Judah / Root of David", back: "Messianic titles from Genesis 49:9 and Isaiah 11:1." }, { front: "Arnion", back: "Greek 'little lamb': the slain Lamb who conquers by self-sacrifice." }, { front: "Seals, trumpets, bowls", back: "Three overlapping views of the same era, like a spiral staircase." } ] } ] }
  ],
  keypoints: [

    { q: "How should the seals, trumpets and bowls be understood?", options: ["As three separate future eras in strict order", "As three overlapping perspectives on the same period", "As events already fully finished in AD 70", "As purely poetic with no meaning"], answer: 1, why: "They are a layered, recursive structure, like a spiral staircase, covering the era between Jesus' ascension and return." }

{
  id: "r07-slain-servants",
  title: "Revelation 6-7: The Lord's Slain Servants",
  summary: "As the Lamb opens the seals, four horsemen show the forces of conquest, war, famine and death that run through all history. The martyrs cry 'How long?', the Day of the Lord dawns, and the 144,000 turn out to be a countless multitude who conquer by faithful, sacrificial love.",
  sections: [
    {
      h: "The Seven Seals at a Glance",
      blocks: [
        { t: "p", text: "As the Lamb opens the seals of the scroll, John sees a symbolic vision. The four horsemen (Revelation 6:1-8) come straight from **Zechariah 1:8-11 and 6:1-8**, where four horses patrol the earth and its affairs." },
        { t: "table", title: "Every seal and its Old Testament background", head: ["Seal", "What John sees", "Meaning", "Old Testament background"], rows: [
          ["1st (6:1-2)", "White horse", "Conquest, imperial domination, deception", "Zechariah 1:8-11; 6:1-8"],
          ["2nd (6:3-4)", "Red horse", "War: peace taken from the earth", "Zechariah 1:8-11; 6:1-8"],
          ["3rd (6:5-6)", "Black horse", "Famine and economic oppression", "Zechariah 6:1-8"],
          ["4th (6:7-8)", "Pale green horse: Death, followed by Hades", "Death and the grave", "Zechariah 6:1-8"],
          ["5th (6:9-11)", "Martyrs' souls under the altar", "The cry for justice: 'How long?'", "Psalm 94:3; Jeremiah 12:4; Habakkuk 1:2"],
          ["6th (6:12-17)", "Earthquake, black sun, blood moon, shaken heavens", "The Day of the Lord", "Isaiah 2:10-21; Joel 2:30-31"],
          ["7th (8:1)", "Silence in heaven", "Opens into the seven trumpets", "(see next chapter)"]
        ] }
      ]
    },
    {
      h: "The Four Horsemen",
      blocks: [
        { t: "cards", title: "Four forces at work in human history", items: [
          { h: "White Horse: Conquest", d: "Some see Christ here because of the colour. But in the ancient world a white horse meant triumph; generals and kings rode one in victory parades (like Roman triumphs). Next to war, famine and death, it most likely means human conquest, deception and imperial domination. Christ does ride a white horse in Revelation 19:11, but in a completely different context." },
          { h: "Red Horse: War", d: "The rider takes peace from the earth, leading to bloodshed and destruction (6:4)." },
          { h: "Black Horse: Famine", d: "A measure of wheat for a denarius (a full day's wage): basic food becomes unaffordable for the poor (6:5-6)." },
          { h: "Pale Green Horse: Death", d: "Death and destruction follow in the wake of war and famine (6:8)." }
        ] },
        { t: "quote", text: "And I looked, and behold a pale horse: and his name that sat on him was Death, and Hell followed with him.", ref: "Revelation 6:8 (KJV)" },
        { t: "p", text: "These are not one future event but an **ongoing theme**. War, famine, disease and death have shaped civilisations from the beginning and remind us how fragile life is." },
        { t: "callout", kind: "insight", title: "How many 'world wars'?", text: "We call two 20th-century conflicts 'World War I' and 'World War II', as if they were the first global wars. In reality, history is full of earlier wars that engulfed many nations and continents, from ancient empires to colonial powers. There were likely hundreds of 'world wars' before; we only started calling them that recently." },
        { t: "term", word: "Hades", heb: "ᾅδης", lang: "Greek", meaning: "The word translated 'Hell' in Revelation 6:8 (KJV). It means the realm of the dead, the 'Great Grave' of the ancient world, where the dead 'sleep' awaiting resurrection and judgment. It is not the later idea of eternal torment in fire." },
        { t: "p", text: "So 'Hell followed with him' means: wherever death goes, the grave follows. It underlines death's grim rule over humanity." },
        { t: "callout", kind: "note", text: "Incidentally (or not), the four horse colours (green, black, red, white) match the dominant colours of the flags of most Islamic nations, and the four early caliphs of Islam are sometimes pictured as four riders on horses." }
      ]
    },
    {
      h: "The Cry of the Martyrs: How Long, Lord?",
      blocks: [
        { t: "p", text: "At the fifth seal John sees the souls of slain martyrs **beneath the altar** (Revelation 6:9-11). They cry, 'How long, Sovereign Lord?' (6:10), echoing the psalmists and prophets." },
        { t: "quote", text: "How long, Lord, will the wicked be jubilant?", ref: "Psalm 94:3" },
        { t: "quote", text: "How long, LORD, must I call for help, but you do not listen? Or cry out to you, 'Violence!' but you do not save?", ref: "Habakkuk 1:2" },
        { t: "p", text: "Jeremiah asked the same: 'How long?' (Jeremiah 12:4). The answer to the martyrs is bittersweet. They receive **white robes** (their vindication) but are told to **wait**, because more believers will be martyred before justice is complete (6:11). Suffering is not an interruption of God's plan but part of it, even for the righteous." },
        { t: "callout", kind: "insight", title: "Why suffering?", text: "Humanity rarely grows without suffering. Pain forces people and societies to face their own corruption, question assumptions and seek deeper truth. Comfort breeds complacency; pain awakens the soul. Many of history's great moral, scientific and spiritual breakthroughs came through trials. Suffering becomes a refining fire that shapes character, purifies hearts and drives the search for justice and meaning." },
        { t: "table", title: "Job met the four horsemen too", head: ["Horseman", "In Job's life"], rows: [
          ["Violence", "Raiders take his wealth"],
          ["Conquest", "His property is carried off"],
          ["Suffering", "Disaster, poverty and disease"],
          ["Death", "His children die"]
        ] },
        { t: "p", text: "Job was righteous. He did not suffer for wrongdoing; his life became the stage of a cosmic drama between good and evil. His pain was purpose, not punishment, and his story became a small picture of apocalyptic suffering. Like the martyrs in Revelation, and like believers today, Job endured while waiting for God's justice." },
        { t: "p", text: "The pattern continues. In February 2025, Islamic ADF militants abducted over 70 Christian civilians from the village of Mayba in eastern Congo (DRC) and beheaded them in a church in nearby Kasanga. In March 2025, about a thousand Christians were massacred in a few days in Syria's coastal region. Christians have faced tribulation throughout history and still do (John 15:20; Matthew 24:9)." },
        { t: "callout", kind: "note", text: "Tribulation is not only beheadings or nuclear disaster. It can be as personal as being fired by your boss for becoming a Christian, and no longer being able to feed your baby. That is a true story." }
      ]
    },
    {
      h: "The Sixth Seal: Who Can Stand?",
      blocks: [
        { t: "p", text: "At the sixth seal the earth quakes (Revelation 6:12-17). The sun turns black, the moon turns to blood, the heavens shake. This is unmistakably the prophets' **Day of the Lord** (Isaiah 2:10-21; Joel 2:30-31). Justice is about to be served." },
        { t: "quote", text: "For the great day of their wrath has come, and who can withstand it?", ref: "Revelation 6:17" },
        { t: "p", text: "The question 'Who can stand?' is not about people physically falling down, but it is not merely rhetorical either. John pauses the story to answer it in chapter 7." }
      ]
    },
    {
      h: "The 144,000: Who Are They?",
      blocks: [
        { t: "p", text: "An angel with God's **signet ring** marks God's servants for protection (7:2-3). John then **hears** the number 144,000: 12,000 from each of the twelve tribes of Israel (7:4-8)." },
        { t: "cards", title: "Why 12 x 12,000?", items: [
          { h: "12 = God's covenant people", d: "12 tribes, 12 apostles, 12 stones on the high priest's breastplate." },
          { h: "Counted by thousands per tribe", d: "Israel was numbered by tribe (Numbers 1; 26), especially before battle (Numbers 31). This is an army." },
          { h: "Not literal", d: "Far more than 144,000 are redeemed. It is not a cult finally reaching its quota of members (as Jehovah's Witnesses teach), but a symbol of the fullness of God's people." }
        ] },
        { t: "flow", title: "Hear, then see: the same pattern as chapter 5", nodes: [
          { h: "Rev 5:5-6", d: "Hears: the Lion. Sees: a slain Lamb." },
          { h: "Rev 7:4", d: "Hears: 144,000 from Israel's tribes." },
          { h: "Rev 7:9", d: "Sees: a great multitude from every nation, tribe and language." }
        ] },
        { t: "callout", kind: "insight", title: "Israel as the 'starter culture'", text: "The Jewish people are like the starter culture of God's kingdom: the original seed through which God's blessing spreads. The kingdom was always meant to grow and be filled with multitudes of Gentiles grafted in by faith. So Gentile believers must not 'boast over the branches' (Romans 11:18) but honour their older brother, through whom came the covenants, the prophets, the Scriptures and the Messiah Himself (Romans 9:4-5)." },
        { t: "quote", text: "I have made you a father of many nations.", ref: "Genesis 17:4" },
        { t: "p", text: "This multinational **army of the Lamb** fulfils God's promise to Abraham. But unlike earthly armies, they do not conquer by killing. They overcome through suffering, sacrificial love and faithful witness, just as the Lamb did. 'Staying faithful' means imitating the Lamb's self-giving love." }
      ]
    },
    {
      h: "Faithfulness Is Not Pacifism",
      blocks: [
        { t: "p", text: "Does Revelation teach absolute pacifism? **No.** Sacrificial love is not passivity in the face of evil. It is a willingness to do what Jesus did: lay down your life to protect those you love. It is active resistance to evil through righteousness, truth and unwavering faithfulness." },
        { t: "compare", title: "Holding both truths together", cols: [
          { h: "Do not retaliate", items: ["Love your enemies", "Suffer without revenge", "Jesus rebuked Peter for using the sword (Matthew 26:52)", "The cycle of revenge is endless"] },
          { h: "Do protect", items: ["'Love always protects' (1 Corinthians 13:7)", "Jesus forcefully drove out the money changers (John 2:15)", "Loving enemies never meant letting injustice thrive", "Sometimes war is refusing to surrender to violence"] }
        ] },
        { t: "p", text: "Those with a strong emphasis on God's mercy rightly stress loving enemies, but there is a blind spot. War is never the ideal, yet defending ourselves and protecting future generations can be right. **Peace is always the goal, but justice and protection are often the path to it.** True faithfulness means resisting evil without fearing it or becoming like it." }
      ]
    },
    {
      h: "The Pattern of Suffering and Redemption",
      blocks: [
        { t: "p", text: "Revelation 6-7 shows a cosmic pattern repeated in every generation. Over the past 2,000 years, perhaps 700 million to 1.25 billion people died from wars and disease alone (a rough estimate). Most people in every age have lived with suffering, instability and death." },
        { t: "cycle", title: "The repeating pattern", center: "Every generation", hint: "Tap each stage", items: [
          { h: "Conquest", d: "Empires rise and dominate." },
          { h: "War", d: "Peace is taken from the earth." },
          { h: "Famine", d: "The poor cannot afford to live." },
          { h: "Death", d: "The grave follows." },
          { h: "Martyrs cry 'How long?'", d: "The faithful suffer and wait." },
          { h: "God preserves His people", d: "His kingdom still advances." }
        ] },
        { t: "p", text: "That is why most Christian generations believed they lived in the last days, and in a sense they did. These events are patterns that repeat until the **final fulfillment**, which will be one last, climactic event. Feeling that our era is uniquely apocalyptic is mostly a matter of perspective. One crucial difference today: the Jews are back in the Land of Israel, and that is theologically significant." },
        { t: "list", title: "The real question is not 'When?' but 'Who will stay faithful?'", items: [
          "Those sealed by God, marked not by a physical sign but by faithfulness to the Lamb.",
          "Those who overcome not by violence but by endurance.",
          "Those who understand that conquering means loving, sacrificing and bearing witness to the truth."
        ] },
        { t: "callout", kind: "insight", text: "The Lamb leads His army not to bloodshed but to victory through faithfulness. Are we willing to serve in Christ's army?" },
        { t: "flip", title: "Flashcards: seals and martyrs", items: [ { front: "White horse", back: "Conquest and imperial domination (victory-parade imagery), not Christ." }, { front: "Black horse", back: "Famine and economic oppression: a day's wage for a measure of wheat." }, { front: "Hades", back: "The grave, the realm of the dead awaiting resurrection; not eternal torment." }, { front: "'How long, Lord?'", back: "The martyrs' cry (Rev 6:10), echoing Psalm 94:3, Jeremiah 12:4, Habakkuk 1:2." }, { front: "144,000", back: "Symbolic fullness of God's people; heard as Israel, seen as a multitude from all nations." }, { front: "Faithfulness vs. pacifism", back: "Love refuses revenge but also protects: 'love always protects'." } ] } ] }
  ],
  keypoints: [
    "The four horsemen come from Zechariah 1 and 6 and stand for conquest, war, famine and death, forces present in every age.",
    "The white horse is most likely imperial conquest, not Christ; white horses were used in victory parades.",
    "'Hell' in Revelation 6:8 is Hades, the grave or realm of the dead, not eternal torment.",
    "The martyrs' 'How long?' echoes Psalm 94, Jeremiah 12 and Habakkuk 1; they are vindicated but told to wait.",
    "Suffering refines and awakens; Job experienced all four 'horsemen' and became a picture of faithful endurance.",
    "The sixth seal uses Day of the Lord imagery from Isaiah 2 and Joel 2.",
    "John hears 144,000 from Israel but sees a countless multitude from every nation: Israel is the seed, the nations are grafted in.",
    "Faithfulness is not pacifism: love both refuses revenge and protects others from harm."
  ],
  quiz: [
    { q: "Which prophet's vision lies behind the four horsemen?", options: ["Ezekiel", "Daniel", "Zechariah", "Amos"], answer: 2, why: "Zechariah 1:8-11 and 6:1-8 describe four horses patrolling the earth." },
    { q: "What does the Greek word behind 'Hell' in Revelation 6:8 (Hades) mean?", options: ["The realm of the dead, the grave", "A lake of eternal fire", "The abyss of demons", "The second death"], answer: 0, why: "Hades is the ancient 'Great Grave' where the dead await resurrection and judgment." },
    { q: "What does John SEE after hearing the number 144,000?", options: ["12 tribal armies", "A great multitude from every nation", "Four angels at the corners of the earth", "The New Jerusalem"], answer: 1, why: "As with the Lion and the Lamb, what he hears is reinterpreted by what he sees: a countless, multinational people (7:9)." },
    { q: "What answer do the martyrs under the altar receive?", options: ["Immediate revenge on their enemies", "Nothing at all", "A new body and a crown", "White robes and a call to wait a little longer"], answer: 3, why: "They are vindicated (white robes) but told to wait until the full number of witnesses is complete (6:11)." },
    { q: "According to this chapter, does Revelation teach absolute pacifism?", options: ["No: love refuses revenge but also protects others", "Yes: Christians must never resist evil", "Yes: but only for pastors", "The question is not addressed"], answer: 0, why: "'Love always protects' (1 Cor 13:7); faithfulness resists evil without fearing or imitating it." }
  ]
},
{
  id: "r08-trumpets-temple-witnesses",
  title: "Revelation 8-11: Judgment, Temple, and Two Witnesses",
  summary: "The seventh seal opens into seven trumpets that retell the story through the Exodus plagues. Judgment alone does not make the nations repent. Only when the two witnesses die and are raised, showing God's grace, do the nations turn, and the seventh trumpet announces that the world's kingdom has become God's.",
  sections: [
    {
      h: "Silence, Then Seven Trumpets Echoing Exodus",
      blocks: [
        { t: "p", text: "When the seventh seal is broken, something unexpected happens: **silence** (Revelation 8:1). It prepares for the next stage. From the seventh seal come seven trumpets, a reminder that Revelation is **recursive, not linear**: each cycle shows the same reality from a new angle." },
        { t: "p", text: "The trumpets do not describe new events. They retell the story using the imagery of **Israel's Exodus from Egypt**. As God sent plagues on Egypt to challenge Pharaoh and free His people, these trumpets fall on oppressive nations as a wake-up call to repent." },
        { t: "table", title: "Every trumpet and its Old Testament background", head: ["Trumpet", "In Revelation", "Old Testament background"], rows: [
          ["1st", "Hail and fire mixed with blood (8:7)", "The plague of hail and fire on Egypt (Exodus 9:23-24)"],
          ["2nd", "A burning mountain turns the sea to blood (8:8-9)", "The Nile turned to blood (Exodus 7:20-21)"],
          ["3rd", "A star ('Wormwood') poisons the rivers and springs (8:10-11)", "Egypt's water became undrinkable (Exodus 7:20-21)"],
          ["4th", "A third of sun, moon and stars darkened (8:12)", "The ninth plague: darkness (Exodus 10:21-23)"],
          ["5th", "Demonic locusts from the abyss (9:1-11)", "The locust plague (Exodus 10:12-15), now turned demonic and terrifying"],
          ["6th", "Release of armies; the survivors still do not repent (9:13-21)", "Pharaoh's hardened heart"],
          ["7th", "'The kingdom of the world has become the kingdom of our Lord' (11:15)", "The Exodus goal: God's people freed to serve Him; Psalm 2"]
        ] },
        { t: "p", text: "Like Egypt's plagues, these judgments come as **warnings**, one after another. But John reports something crucial: **the nations still do not repent** (9:20-21), just as Pharaoh hardened his heart under God's blows." }
      ]
    },
    {
      h: "The Limits of Judgment and the Power of Grace",
      blocks: [
        { t: "callout", kind: "insight", title: "Judgment alone does not change the heart", text: "Like Egypt, oppressive empires resist repentance even in devastation, and that leads to their fall. It is the same in personal life and society: punishment may deter outward wrongdoing, but it rarely brings inner change. Laws restrain evil; only mercy, grace and love transform the heart." },
        { t: "compare", title: "Law and grace", cols: [
          { h: "The Law: punishment, judgment, plagues", items: ["Exposes sin", "Restrains evil", "Does not create righteousness"] },
          { h: "Grace: forgiveness, sacrificial love, patience, mercy", items: ["Truly transforms people", "Wins hearts", "Is how Christ is victorious"] }
        ] },
        { t: "p", text: "So, in Revelation, victory like Christ's comes not through judgment and vengeance, but through **grace**, which alone can transform hearts." }
      ]
    },
    {
      h: "The Bitter-Sweet Scroll",
      blocks: [
        { t: "p", text: "Before the seventh trumpet there is an interlude. An angel gives John a scroll and tells him to **eat it** (Revelation 10:9-10). It is sweet in his mouth and bitter in his stomach." },
        { t: "compare", title: "Why bitter and sweet?", cols: [
          { h: "Sweet", items: ["The hope of God's promises", "The coming of His Kingdom", "Hope for the faithful"] },
          { h: "Bitter", items: ["Suffering, persecution and tribulation that must come first", "Warning of judgment for oppressive powers"] }
        ] },
        { t: "p", text: "This echoes **Ezekiel 2:8-3:3**, where the prophet eats a scroll sweet as honey but full of lament and woe. Like Ezekiel, John is commissioned as a prophet of both bad and good news: calling humanity to repent, warning oppressors and comforting the faithful." }
      ]
    },
    {
      h: "Measuring the Temple: The True Worshipers",
      blocks: [
        { t: "p", text: "John is told to **measure God's temple**, where the worshippers stand near the altar, set apart and protected (Revelation 11:1). The outer court and the city are left to be trampled by the nations: suffering and hope side by side. The image comes from **Zechariah 2:1-5**, where measuring the city means divine protection." },
        { t: "p", text: "Some take this as a literal destruction of Jerusalem, past or future. But the New Testament consistently teaches that God's true temple is **His people**, not a building." },
        { t: "quote", text: "Do you not know that you are God's temple?", ref: "1 Corinthians 3:16" },
        { t: "quote", text: "We are His house if we hold firmly to our confidence and hope.", ref: "Hebrews 3:6" },
        { t: "quote", text: "You, like living stones, are being built into a spiritual house.", ref: "1 Peter 2:4-5" },
        { t: "p", text: "Measuring the temple, then, means God's spiritual protection and blessing of His faithful ones, even under persecution. They may be oppressed, imprisoned or killed, but they become **pillars** in God's Kingdom: 'The one who conquers, I will make a pillar in the temple of my God' (Revelation 3:12). Empires and their buildings crumble; God's temple of living souls endures." },
        { t: "quote", text: "If they persecuted Me, they will also persecute you.", ref: "John 15:20" }
      ]
    },
    {
      h: "The Two Witnesses: Prophets of the Lamb",
      blocks: [
        { t: "p", text: "Next come **two witnesses** (Revelation 11:3). Many imagine two literal end-time prophets with superpowers ('fire comes from their mouths', 11:5). But John gives a key clue: he calls them **lampstands** (11:4). Letting Scripture interpret Scripture, lampstands are the **people of God** (1:20)." },
        { t: "term", word: "Menorah", heb: "מְנוֹרָה", lang: "Hebrew", meaning: "The seven-branched lampstand of the Tabernacle and Temple (Exodus 25:31-40). A central symbol of God's presence and of Israel's mission to be 'a light to the nations' (Isaiah 42:6)." },
        { t: "p", text: "Jesus called His followers 'the light of the world' and said a lamp belongs on a stand (Matthew 5:14-16). So the two witnesses represent God's ambassadors, bearing witness to His truth in a hostile world." },
        { t: "table", title: "The two witnesses as Moses and Elijah", head: ["The witnesses (Rev 11)", "Old Testament model"], rows: [
          ["Fire devours their enemies (11:5)", "Elijah called down fire from heaven (2 Kings 1:10-12)"],
          ["Power to shut the sky so no rain falls (11:6)", "Elijah stopped the rain for three and a half years (1 Kings 17:1)"],
          ["Power to turn water into blood and strike with plagues (11:6)", "Moses turned water to blood and struck Egypt with plagues (Exodus 7-11)"],
          ["Killed by the beast, raised after three and a half days (11:7-12)", "Echoes Jesus' death and resurrection"]
        ] },
        { t: "p", text: "Moses (the great lawgiver) and Elijah (the fiery, miracle-working prophet who called Israel back to God, 1 Kings 18:20-40) represent **the Law and the Prophets**. They appeared with Jesus at the Transfiguration (Matthew 17:3), testifying that He fulfils all the Law and the Prophets point to (Luke 24:27). Their role was always to call Israel and the nations to repentance." },
        { t: "callout", kind: "insight", title: "A metamorphosis", text: "In Revelation the story of Moses and Elijah (the Old Testament) transforms into the story of Jesus and the fulfilment of all things (the New Testament). It is not a rejection of what came before but its climax in Yeshua, where law and prophecy converge into love, sacrifice and redemption." },
        { t: "flow", title: "What finally makes the nations repent", nodes: [
          { h: "Plagues", d: "Trumpet judgments: no repentance (9:20-21)" },
          { h: "Witness", d: "The two witnesses prophesy" },
          { h: "Death", d: "The beast kills them" },
          { h: "Resurrection", d: "God raises them publicly" },
          { h: "Repentance", d: "Many give glory to God (11:13)" }
        ] },
        { t: "p", text: "The nations repented because **God showed them His grace**. The beast tries to silence the witnesses of every age (Moses, Elijah, Jesus and all who follow), but God's testimony prevails." }
      ]
    },
    {
      h: "The Two Witnesses Throughout History",
      blocks: [
        { t: "timeline", title: "A pattern that keeps repeating", items: [
          { when: "Old Testament", h: "Israel survives", d: "The nations could not destroy God's chosen people or their message." },
          { when: "c. AD 30", h: "Jesus crucified", d: "Killing Him did not stop His message." },
          { when: "1st-4th centuries", h: "Roman persecution", d: "Persecution accelerated the faith's growth; fleeing believers carried the gospel to new lands." },
          { when: "Later centuries", h: "A global movement", d: "The beastly empire that tried to crush the message eventually fell to it." }
        ] },
        { t: "callout", kind: "note", text: "The paradox of Revelation: evil may seem to win for a time, but what Satan and the beast try to destroy, God turns into an explosion of grace. **The blood of the martyrs is the seed of the Church.**" },
        { t: "p", text: "The two witnesses mirror faithful witnesses through history, especially Israel's prophets, Jesus and His disciples: they brought God's message, were rejected, persecuted, killed, and then glorified. True victory is won not by the sword but by endurance, sacrificial love and faithfulness." }
      ]
    },
    {
      h: "The Seventh Trumpet: The Kingdom Has Come",
      blocks: [
        { t: "quote", text: "The kingdom of the world has become the kingdom of our Lord and of His Messiah, and He will reign forever and ever.", ref: "Revelation 11:15" },
        { t: "callout", kind: "insight", text: "God's final victory is not the **destruction** of the world but its **transformation**. The kingdoms of the earth become God's kingdom: 'Every knee will bow before Me; every tongue will confess to God' (Romans 14:11). This is already underway: every time someone turns to Christ, injustice is confronted, love beats hatred, or a sinner is forgiven, God's Kingdom advances." },
        { t: "list", title: "The heart of the gospel in Revelation 8-11", items: [
          "The Law is good, but judgment cannot produce true righteousness.",
          "The Lamb's triumph, born from sacrificial love, leads to righteousness.",
          "The world is won not by force, fear or domination, but by faithful endurance and God's grace.",
          "Empires conquer by oppression and violence; God conquers hearts by love, forgiveness and endurance."
        ] },
        { t: "p", text: "That is why the gospel spread so fast in the ancient church and spreads in persecuted countries today. People saw in the martyrs a love the world could not offer: self-sacrificial, unwavering and refusing to retaliate even facing death. The two witnesses represent the Church's mission: to testify to God's truth even when it costs everything. The real question is not 'How can we escape suffering?' but **'Will we remain faithful in the midst of tribulation?'**" },
        { t: "flip", title: "Flashcards: trumpets and witnesses", items: [ { front: "Trumpets 1-5", back: "Echo Exodus plagues: hail and fire, blood, poisoned water, darkness, locusts." }, { front: "Revelation 9:20-21", back: "Despite the plagues, the nations do not repent, like Pharaoh." }, { front: "Bitter-sweet scroll", back: "Sweet hope of the Kingdom, bitter suffering first; echoes Ezekiel 2:8-3:3." }, { front: "Measuring the temple", back: "God protecting His people, the true temple (Zechariah 2:1-5; 1 Cor 3:16)." }, { front: "Two witnesses", back: "Lampstands (God's people) modelled on Moses and Elijah, the Law and the Prophets." }, { front: "Seventh trumpet", back: "'The kingdom of the world has become the kingdom of our Lord': transformation, not destruction." } ] } ] }
  ],
  keypoints: [
    "The seventh seal opens into silence and then the seven trumpets: the same story retold from a new angle.",
    "The trumpets echo the Exodus plagues: hail and fire, blood, darkness and locusts.",
    "Judgment alone does not change hearts: the nations do not repent after the plagues (9:20-21), like Pharaoh.",
    "The bitter-sweet scroll echoes Ezekiel 2-3: a message of hope (sweet) and suffering first (bitter).",
    "Measuring the temple (Zechariah 2) pictures God protecting His people, who are the true temple.",

{
  id: "r09-dragon-woman-child",
  title: "Revelation 12: The Dragon, the Woman, and Her Child",
  summary: "The first 'sign' pulls back the curtain on the cosmic war behind Rome's persecution. Israel (the woman) gives birth to the Messiah (the child), whom the dragon (Satan) cannot destroy. Cast down from heaven, the dragon attacks God's people, but they conquer him by the blood of the Lamb and their faithful testimony.",
  sections: [
    {
      h: "Signs and the Cosmic War",

        { t: "p", text: "Both Jews in Israel and the early Church across the Roman Empire faced waves of persecution. Seen as subversive for refusing to worship the emperor, they were hunted, imprisoned and executed. Many went underground, meeting in secret (as in the catacombs of Rome), or fled." },

    {

      blocks: [
        { t: "quote", text: "They conquered him by the blood of the Lamb and by the word of their testimony, for they did not love their lives even unto death.", ref: "Revelation 12:11" },

        { t: "flow", title: "How believers overcome Satan", nodes: [

        { t: "p", text: "'They did not love their lives' simply means they put faithfulness to Christ above self-preservation, choosing death rather than denying Him. They were **martyrs**." },

 {

  "title": "Revelation 13: The Two Beasts",
  "summary": "Revelation 13 shows two beasts serving the dragon: one stands for violent, greedy empires, and the other for false religion that looks like the Lamb but speaks like the dragon. The famous \"antichrist\", the number 666 and the mark on the hand and forehead all make the most sense when read through John's Jewish world.",

      "text": "Next John sees a second beast, rising from the **earth** (Revelation 13:11-12). It looks \"like a lamb\" but speaks \"like a dragon\". In Revelation and John's other writings, the lamb always stands for Christ, the innocent Lamb of God (e.g. Revelation 5:6-14; 7:9-17; 14:1-5; 19:7-9). So this beast is false religion dressed up as Christian, a fitting demonic tactic, since \"Satan himself masquerades as an angel of light\" (2 Corinthians 11:14)."

      "text": "This has lasting effects on the gospel. Take India: for nearly two centuries it lived under British rule. Colonial rule is not evil in itself, but the British Empire was often violent and merciless toward native peoples, and its leadership was almost entirely Christian. What would millions of Indians, many raised in Hinduism, conclude about the Christian God? Probably not that He is merciful and loving, and they would hardly want to follow a religion that oppressed the weak instead of protecting them."

 {
  "id": "r12-the-fall-of-babylon",
  "title": "Revelation 17-20: The Fall of Babylon",
  "summary": "Revelation 17-20 shows the fall of Babylon, the prostitute riding the beast, the return of Jesus on a white horse with a robe already soaked in His own blood, the defeat of the False Prophet, the thousand-year reign, the lake of fire, and the final judgment. Read in their Jewish setting, these images speak of refining justice and the end of evil.",
  "sections": [
   {
    "h": "Babylon: The Prostitute on the Beast",
    "blocks": [
     {
      "t": "p",
      "text": "Having unpacked the Lamb's scroll, God's plan to judge and redeem, John now expands three themes from earlier: **(1) the fall of Babylon, (2) the defeat of evil, and (3) the coming of God's Kingdom, the New Jerusalem.** Each looks at the same reality, the coming of God's Kingdom, from a different angle."
     },
     {
      "t": "tree",
      "title": "Revelation 17-20 at a glance",
      "root": "God's Kingdom comes",
      "children": [
       {
        "h": "Babylon falls",
        "d": "Rev 17-18",
        "children": [
         {
          "h": "Prostitute on the scarlet beast"
         },
         {
          "h": "\"Fallen, fallen is Babylon\""
         }
        ]
       },
       {
        "h": "Evil defeated",
        "d": "Rev 19-20",
        "children": [
         {
          "h": "Rider on the white horse"
         },
         {
          "h": "False Prophet defeated"
         },
         {
          "h": "Thousand years; Gog and Magog"
         },
         {
          "h": "Lake of fire"
         }
        ]
       },
       {
        "h": "Judgment and honour",
        "d": "Rev 20:11-15",
        "children": [
         {
          "h": "Great white throne"
         },
         {
          "h": "Book of Life"
         }
        ]
       }
      ]
     },
     {
      "t": "p",
      "text": "John is shown a striking woman in luxurious clothes, drunk on the blood of martyrs and innocent people (Revelation 17:3-6). She is called **Babylon the Great, the Mother of Prostitutes**, and she rides a **scarlet beast**. Scarlet stands for luxury, sin and bloodshed (Proverbs 31:21; Isaiah 1:18; Luke 16:19), fitting for a figure who is both seductive and violent."
     },
     {
      "t": "p",
      "text": "The scarlet beast is the same first beast: oppressive worldly empire. Babylon is more than a city or a woman. It is a symbol of corrupt power that rises again and again, enslaving nations and persecuting the righteous."
     },
     {
      "t": "p",
      "text": "To John's first-century readers, Babylon obviously meant **Rome**, which oppressed Christians and promoted emperor worship. But Babylon is bigger than Rome: it is any world power that exalts itself to God's level or above, using military, economic and religious influence to deceive. John borrows from prophecies against other great powers: Babylon, Tyre and Edom (Isaiah 13; 23; 34; 47; Jeremiah 50-51; Ezekiel 26-27)."
     },
     {
      "t": "p",
      "text": "She is a **prostitute** because she pictures a civilisation that sells its morals for wealth and power. It seduces rulers with luxury, intimidates with violence, and leads people into idolatry. But it will not last."
     },
     {
      "t": "quote",
      "text": "Fallen! Fallen is Babylon the Great!... In one hour your doom has come!",
      "ref": "Revelation 18:2, 10"
     },
     {
      "t": "p",
      "text": "By John's time the Babylonian Empire was long gone, yet its name lived on as the **prototype of every oppressive empire**. Some Protestants have claimed Babylon means the Catholic Church, but that reading is historically and contextually weak. The image fits empires that oppress the innocent, worship wealth and power and oppose God's justice, often with religion (the second beast) mixed in."
     },
     {
      "t": "timeline",
      "title": "Every Babylon falls",
      "items": [
       {
        "when": "6th c. BC",
        "h": "Babylon falls",
        "d": "To the Persians"
       },
       {
        "when": "4th c. BC",
        "h": "Persia falls",
        "d": "To Alexander the Great"
       },
       {
        "when": "5th c. AD",
        "h": "Rome falls",
        "d": "In the West"
       },
       {
        "when": "1453 AD",
        "h": "Byzantium falls",
        "d": "Constantinople is captured"
       },
       {
        "when": "Forever",
        "h": "Jesus' Kingdom remains",
        "d": "None of the empires proved eternal; His Kingdom lasts forever"
       }
      ]
     }
    ]
   },
   {
    "h": "The Rider on the White Horse",
    "blocks": [
     {
      "t": "p",
      "text": "At the turning point of the story John sees Jesus return, not as a baby in a manger but as a conquering King (Revelation 19:11-16). He rides a **white horse**, which in the ancient world was the mount of victorious generals and kings. He is called \"Faithful\" and \"True\": a righteous, victorious King, not just a warrior."
     },
     {
      "t": "p",
      "text": "Yet Christ does not return with jets, tanks and missiles. His only weapon is **\"the sword of His mouth\"** (19:15): His teaching, authority and truth. It is His power to judge, expose lies and bring justice by His word (Isaiah 11:4; Hebrews 4:12)."
     },
     {
      "t": "p",
      "text": "Then a striking detail: before the battle even starts, His robe is already **dipped in blood** (19:13). Whose blood? His own. In most ancient battle scenes the warrior's robe is stained *after* the fight with his enemies' blood. Jesus enters already covered in the blood of His sacrifice on the cross. He conquers not through violence but through self-sacrifice."
     },
     {
      "t": "compare",
      "title": "Two ways to understand Jesus' blood",
      "cols": [
       {
        "h": "Later Western framing",
        "items": [
         "Blood appeases God's wrath",
         "Sacrifice as punishment paid",
         "Focus on a legal transaction"
        ]

        "h": "First Jewish followers' understanding",
        "items": [

         "Like Israel's sacrifices: cleanses the altar, purifies priests, sanctifies the Holy of Holies",
         "Jesus' sacrifice cleanses, purifies and sanctifies the world (Hebrews 9:13-14; 10:10-14; John 1:29; 1 John 2:2)"
        ]
       }
      ]
     },
     {
      "t": "callout",
      "kind": "insight",
      "text": "The robe is bloody before the battle begins. The Lamb wins by the blood He gave, not by the blood He sheds.",
      "title": "A crucial reversal"
     }
    ]
   },
   {
    "h": "The False Prophet = The Second Beast",
    "blocks": [
     {
      "t": "p",
      "text": "Revelation 19:20 describes the defeat of the two beasts and explains that the **False Prophet**, the second beast, performed signs on behalf of the first beast."
     },
     {
      "t": "p",
      "text": "In the Torah, a false prophet is anyone, or any teaching, that claims to speak for God but leads people away from Him (Deuteronomy 13:1-5). This is the heart of taking God's name in vain: using God's authority to promote falsehood, injustice, idolatry or personal gain. It is Satan's ultimate deception."
     },
     {
      "t": "flow",
      "title": "How the False Prophet deceives",
      "nodes": [
       {
        "h": "Speaks in God's name",
        "d": "Claims divine authority"

     {
      "t": "p",
      "text": "Notice that the False Prophet does not lead people straight to the dragon. It leads them to worship the **first beast**, corrupt worldly empires. It is a religion or ideology that looks righteous, even Christian, while corrupting believers. This misuse of God's name is an ongoing strategy across Scripture (Exodus 20:7; Jeremiah 23:25-27; Ezekiel 13:6-9), and Jesus warned about it directly (Matthew 7:15-23; 24:4-5, 24)."
     },
     {
      "t": "callout",
      "kind": "warn",
      "text": "The danger is subtle: religion that misuses Jesus' name for corrupt, worldly goals.",
      "title": "Warning"
     }
    ]
   },
   {
    "h": "The Thousand-Year Reign",
    "blocks": [
     {
      "t": "p",
      "text": "After the beast and False Prophet are defeated, the faithful martyrs reign with Christ for **a thousand years** (Revelation 20:4-6). This \"Millennium\" is one of the most debated passages in Revelation. Some read it as a literal future reign of Christ on earth; others as a symbol of His present reign with His people."
     },
     {
      "t": "p",
      "text": "In the Old Testament and Jewish thought, 1,000 often means completeness, vastness or divine perfection rather than an exact count."
     },
     {
      "t": "table",
      "title": "\"A thousand\" in the Hebrew Bible",
      "head": [
       "Verse",

     {

      "text": "So Revelation 20's thousand years is best read as God's complete, decisive rule, where justice wins and Christ's followers reign with Him. The exact length is secondary. If it is a complete but undefined period, then Satan's release afterwards may also describe a **recurring pattern**: evil resurfaces after times of peace, testing humanity again, until God removes it for good."

     {

   {
    "h": "The Lake of Fire and Sulfur",
    "blocks": [
     {
      "t": "p",
      "text": "The **lake of fire and sulfur** (Revelation 20:10, 15) is one of the most misunderstood images in Scripture. It is often pulled out of its setting in the Hebrew Bible and Second Temple Jewish thought to fit later theology. Here is the gist, word by word."
     },
     {
      "t": "term",
      "word": "Limne (lake)",
      "meaning": "Greek word translated \"lake\"; it can mean a pool of any size, closer to a refiner's crucible of molten metal than a vast lake.",
      "heb": "λίμνη",
      "lang": "Greek"
     },
     {
      "t": "p",
      "text": "**Fire.** Revelation is full of Old Testament symbols, yet some read this one as a literal cosmic furnace. In the Bible fire often stands for purification, refining judgment and cleansing (Malachi 3:2-3; Zechariah 13:9; Isaiah 48:10; 1 Peter 1:7; 1 Corinthians 3:13-15; Hebrews 12:29; Revelation 3:18). \"Fire from heaven consuming the wicked\" (20:9) points to exposure and judgment. God's fire consumes the sin within sinners. It is not the fire of a sadistic abuser but of holy love, burning away all that is unworthy of the divine image."
     },
     {
      "t": "p",
      "text": "**Sulfur.** In the ancient world fire and sulfur together pictured the gold-refining process. Sulfur (brimstone) turned unwanted metals into sulfides that reacted and smoked away, letting pure gold settle at the bottom of the crucible. Jesus uses the same picture: \"I counsel you to buy from me gold refined in the fire\" (Revelation 3:18). Fire and sulfur were painful but **beneficial**, not the medieval image of tools for torture."
     },
     {
      "t": "term",
      "word": "Basanizo (torment)",
      "meaning": "Greek verb translated \"torment\". Its root, basanos, was a touchstone, a black stone used to test the purity of gold and silver. It suggests testing and refining (perhaps very unpleasant), rather than sadistic torture.",
      "heb": "βασανίζω",
      "lang": "Greek"
     },
     {
      "t": "term",
      "word": "Aion (age): \"forever and ever\"",
      "meaning": "The phrase usually translated \"forever and ever\" is literally \"unto the ages of the ages\". Aion first meant \"life\" or \"lifetime\", then \"age\": a long but undetermined period, not the abstract idea of timeless eternity.",
      "heb": "αἰών",
      "lang": "Greek"
     },
     {
      "t": "p",
      "text": "Standard Bible reference works agree: the Old and New Testaments do not know eternity as \"timelessness\"; there is no Hebrew or Greek word for the abstract idea of eternity; and a 19th-century Bible commentator admitted that the Greek word rendered \"eternal\" does not in itself mean endless, and is even used of periods with a beginning and an end."
     },

/* ---------- download: saves this whole app as one offline file ---------- */
var PRISTINE = null;
function download(){
  var html = "<!DOCTYPE html>\n" + PRISTINE, name = "roots-and-branches.html";
  var hosted = window.claude && typeof window.claude.use === "function";
  if (hosted){
    toast("Preparing your download\u2026");
    window.claude.use("downloads").then(function(dl){
      if (!dl) return toast("Downloads aren\u2019t available in this view. Open the app in a browser to save it.");
      return dl.save({filename:name, data:new Blob([html], {type:"text/html"})}).then(function(){
        toast("Saved " + name + ". Open it on any device, even offline.");
      }, function(e){ if (e && e.code !== "declined") toast("The file wasn\u2019t saved. Try again in a moment."); });
    });
    return;
  }
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], {type:"text/html"})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast("Saved " + name + ". Open it on any device, even offline.");
}

/* ---------- search ---------- */
var INDEX = [];
function buildIndex(){
  BOOKS.forEach(function(b){ b.chapters.forEach(function(c){
    var parts = [c.title, c.summary];
    (c.sections||[]).forEach(function(s){ parts.push(s.h); (s.blocks||[]).forEach(function(k){ parts.push(blockText(k)); }); });
    (c.keypoints||[]).forEach(function(k){ parts.push(k); });
    INDEX.push({b:b, c:c, text: plain(parts.join(" • "))});
  }); });
}
function blockText(k){
  var out = [];
  (function walk(o){ if (o == null) return; if (typeof o === "string") out.push(o); else if (Array.isArray(o)) o.forEach(walk); else if (typeof o === "object") Object.keys(o).forEach(function(key){ if (key !== "t" && key !== "kind") walk(o[key]); }); })(k);
  return out.join(" ");
}
function search(q){
  q = q.trim(); var r = $("#results");
  if (q.length < 2){ r.innerHTML = '<p style="color:var(--muted);font-size:.9rem;margin:6px 4px">Type at least two letters.</p>'; return; }
  var ql = q.toLowerCase(), hits = [];
  INDEX.forEach(function(it){
    var i = it.text.toLowerCase().indexOf(ql); if (i < 0) return;
    var s = Math.max(0, i-60), snip = it.text.slice(s, i+q.length+80);
    hits.push('<a href="#/'+it.b.id+'/'+it.c.id+'"><b>'+esc(it.c.title)+'</b><small>'+esc(it.b.short)+'</small><small>…'+esc(snip).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"), function(m){return "<mark>"+m+"</mark>";})+'…</small></a>');
  });
  r.innerHTML = hits.length ? hits.slice(0,30).join("") : '<p style="color:var(--muted);font-size:.9rem;margin:6px 4px">No chapter mentions “'+esc(q)+'”. Try a shorter word.</p>';
}

function renderBlock(k){
  var f = R[k.t]; if (!f) return "";

var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
  es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
}, {rootMargin:"0px 0px -8% 0px"}) : null;
function wire(root){

function route(){

  } else html = viewHome();

  // same chapter, only a section anchor changed
  if (c && key === lastKey && parts[2]){ scrollToSec(parts[2]); return; }
  lastKey = key;

  var show = function(){
    app.innerHTML = html; app.classList.remove("page-enter"); void app.offsetWidth; app.classList.add("page-enter");
    wire(app); bindView(b, c);
    if (parts[2]) scrollToSec(parts[2]); else window.scrollTo(0, 0);
    document.title = (c ? c.title + " – " : b ? b.short + " – " : "") + "Roots & Branches";
  };
  if (c){
    app.innerHTML = '<div class="wrap"><div class="skel" aria-hidden="true"><i class="h"></i><i></i><i style="width:85%"></i><i class="box"></i><i></i><i style="width:70%"></i></div></div>';
    setTimeout(show, 260);
  } else show();
}
function scrollToSec(id){ var el = document.getElementById(id); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); var t = $("#toc"); if (t) t.classList.remove("open"); }

function bindView(b, c){
  $$(".tabs button").forEach(function(t){ t.onclick = function(){ location.hash = "#/"+b.id+"/tab-"+t.dataset.tab; }; });
  $$(".letters button").forEach(function(t){ t.onclick = function(){ location.hash = "#/glossary" + (t.dataset.l ? "/"+t.dataset.l : ""); }; });
  if (!c) return;
  var tb = $("#tocbtn"); if (tb) tb.onclick = function(){ $("#toc").classList.toggle("open"); };
  // quiz
  var answered = 0, right = 0, total = $$(".q").length;
  $$(".q").forEach(function(q){
    var a = +q.dataset.a;
    $$(".opt", q).forEach(function(o){ o.onclick = function(){
      $$(".opt", q).forEach(function(x){ x.disabled = true; });
      $$(".opt", q)[a].classList.add("right");
      if (+o.dataset.i !== a) o.classList.add("wrong"); else right++;
      $(".why", q).hidden = false; answered++;
      if (answered === total){
        $("#score").textContent = "You got " + right + " of " + total + " right." + (right === total ? " Chapter marked as complete." : " Review the key points and try again any time.");
        if (right === total) markDone(b.id+"/"+c.id);
      }
    }; });
  });
  // mark complete when reaching the end
  var end = $(".chapnav");
  if (end && "IntersectionObserver" in window){
    var o = new IntersectionObserver(function(es){ if (es[0].isIntersecting){ markDone(b.id+"/"+c.id); o.disconnect(); } });
    o.observe(end);
  }
  // scrollspy
  var heads = $$("article.chapter h2[id]");
  if ("IntersectionObserver" in window){
    var spy = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){
      $$(".toc a[data-sec]").forEach(function(a){ a.classList.toggle("on", a.dataset.sec === e.target.id); });
    } }); }, {rootMargin:"-10% 0px -80% 0px"});
    heads.forEach(function(h){ spy.observe(h); });
  }
}

/* ---------- boot ---------- */
PRISTINE = (function(){
  var h = "", b = "";
  $$("[data-app]").forEach(function(el){ if (el.tagName === "SCRIPT") b += el.outerHTML + "\n"; else h += el.outerHTML + "\n"; });
  return '<html lang="en">\n<head>\n<meta charset="utf-8">\n' + h + '</head>\n<body>\n<main id="app"></main>\n' + b + '</body>\n</html>';
})();
applyTheme(); shell(); buildIndex();
window.addEventListener("hashchange", route);
route();
})();

</script>
