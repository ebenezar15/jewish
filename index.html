<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roots &amp; Branches</title>
<meta name="description" content="An interactive study of the Jewish roots of the Christian faith: Jesus the Jewish teacher, the feasts of Israel, and Revelation read through Hebrew eyes.">
<meta name="theme-color" content="#EDF1F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roots &amp; Branches">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%232B59C3'/%3E%3Cpath d='M20 11v19M10 13v4a10 10 0 0 0 20 0v-4M15 13v4a5 5 0 0 0 10 0v-4M14 31h12' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap">
<style>
/* ---------- Font: Avenir Next where installed (Apple devices), Nunito Sans elsewhere ---------- */
:root{
  --font: "Avenir Next", "AvenirNext", "Avenir", "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --radius-lg: 22px; --radius-md: 14px; --radius-sm: 8px;
  --ease: cubic-bezier(.2,.7,.2,1);
  --fs: 17px;
}

/* ---------- Colour schemes ---------- */
:root, [data-scheme="tekhelet"]{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#E3E9F3; --ink:#14213D; --muted:#56637E;
  --line:#CBD5E5; --accent:#2B59C3; --accent-ink:#FFFFFF; --second:#C9A227; --third:#3E8E7E;
  --flame:#F2B134; --shadow: 0 1px 0 rgba(20,33,61,.06), 0 10px 30px -12px rgba(20,33,61,.25);
  color-scheme: light;
}
[data-scheme="midnight"]{
  --bg:#0D1B2A; --surface:#14263A; --surface-2:#1B3149; --ink:#E6ECF3; --muted:#9FB0C4;
  --line:#294462; --accent:#7FB7FF; --accent-ink:#0D1B2A; --second:#F2C14E; --third:#6FD3B8;
  --flame:#F7C548; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
[data-scheme="pomegranate"]{
  --bg:#FAF1EF; --surface:#FFFFFF; --surface-2:#F3E1DD; --ink:#3A1218; --muted:#7A4E54;
  --line:#E8C9C3; --accent:#A3203A; --accent-ink:#FFFFFF; --second:#3F7D5C; --third:#C27C2C;
  --flame:#E9A23B; --shadow: 0 1px 0 rgba(58,18,24,.06), 0 10px 30px -12px rgba(58,18,24,.3);
  color-scheme: light;
}
[data-scheme="olive"]{
  --bg:#EFF1E6; --surface:#FBFCF6; --surface-2:#E2E6D2; --ink:#22281A; --muted:#5D6650;
  --line:#CDD3B8; --accent:#55702A; --accent-ink:#FFFFFF; --second:#B8862B; --third:#4E7A8A;
  --flame:#E2A93A; --shadow: 0 1px 0 rgba(34,40,26,.06), 0 10px 30px -12px rgba(34,40,26,.3);
  color-scheme: light;
}
[data-scheme="galilee"]{
  --bg:#E8F4F3; --surface:#FFFFFF; --surface-2:#D3EAE8; --ink:#0E2E33; --muted:#4A6B70;
  --line:#B7D8D5; --accent:#0F7F82; --accent-ink:#FFFFFF; --second:#D9694C; --third:#5A63B8;
  --flame:#F0A64A; --shadow: 0 1px 0 rgba(14,46,51,.06), 0 10px 30px -12px rgba(14,46,51,.3);
  color-scheme: light;
}
[data-scheme="menorah"]{
  --bg:#17140F; --surface:#221E17; --surface-2:#2D281F; --ink:#F1E9D6; --muted:#B5A98E;
  --line:#3D3628; --accent:#E3B04B; --accent-ink:#17140F; --second:#8FB3E0; --third:#C46F5A;
  --flame:#FFC857; --shadow: 0 1px 0 rgba(0,0,0,.35), 0 14px 34px -14px rgba(0,0,0,.8);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-scheme]){
    --bg:#0D1B2A; --surface:#14263A; --surface-2:#1B3149; --ink:#E6ECF3; --muted:#9FB0C4;
    --line:#294462; --accent:#7FB7FF; --accent-ink:#0D1B2A; --second:#F2C14E; --third:#6FD3B8;
    --flame:#F7C548; color-scheme: dark;
  }
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{font-size:var(--fs); -webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.6;
  transition: background-color .4s var(--ease), color .4s var(--ease); overflow-x:hidden}
h1,h2,h3,h4{line-height:1.15; margin:0 0 .5em; font-weight:700; letter-spacing:-.01em}
p{margin:0 0 1em}
a{color:var(--accent)}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} html{scroll-behavior:auto} }

/* ---------- Top bar ---------- */
.bar{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
  padding:10px 16px; background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; text-decoration:none; color:var(--ink); margin-right:auto; min-width:0}
.brand svg{flex:none}
.brand span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.iconbtn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface);
  padding:8px 12px; border-radius:999px; font-size:.85rem; font-weight:600}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn svg{width:18px;height:18px}
@media (max-width:640px){ .iconbtn .lbl{display:none} .iconbtn{padding:8px} }
.progressline{position:fixed; top:0; left:0; height:3px; background:var(--accent); z-index:60; width:0; transition:width .15s linear}

/* ---------- Panels (theme, search) ---------- */
.sheet{position:fixed; inset:0; z-index:80; display:none}
.sheet.open{display:block}
.sheet .scrim{position:absolute; inset:0; background:rgba(0,0,0,.35); animation:fade .25s}
.sheet .panel{position:absolute; right:12px; top:62px; width:min(380px, calc(100% - 24px)); max-height:calc(100% - 80px); overflow:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow);
  animation:drop .35s var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{opacity:0; transform:translateY(-10px) scale(.98)}}
.swatches{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0 18px}
.swatch{border:2px solid var(--line); border-radius:var(--radius-md); padding:10px; background:var(--surface-2); text-align:left; font-size:.8rem; font-weight:600}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.swatch .dots{display:flex; gap:4px; margin-bottom:6px}
.swatch .dots i{width:16px; height:16px; border-radius:50%; display:block; border:1px solid rgba(0,0,0,.1)}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.seg button{border:0; background:transparent; padding:6px 14px; font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.search-input{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit}
.results{margin-top:12px; display:grid; gap:6px}
.results a{display:block; padding:10px 12px; border-radius:10px; text-decoration:none; color:var(--ink); background:var(--surface-2)}
.results a small{display:block; color:var(--muted)}
.results mark{background:color-mix(in srgb, var(--second) 45%, transparent); color:inherit; border-radius:3px}

/* ---------- Layout ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 16px}
main{min-height:70vh}

/* ---------- Home hero ---------- */
.hero{display:grid; grid-template-columns:1.1fr .9fr; gap:28px; align-items:center; padding:48px 0 24px}
.hero h1{font-size:clamp(2.2rem, 5.6vw, 4.2rem); letter-spacing:-.025em; font-weight:700}
.hero p.lead{font-size:1.15rem; color:var(--muted); max-width:34em}
.hero .cta{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.btn{display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:999px; font-weight:700; text-decoration:none; border:0;
  background:var(--accent); color:var(--accent-ink)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.menorah{width:100%; max-width:440px; justify-self:center}
.menorah .stem{stroke:var(--second); stroke-width:9; fill:none; stroke-linecap:round; stroke-dasharray:600; stroke-dashoffset:600; animation:draw 1.6s var(--ease) forwards}
.menorah .base{fill:var(--second); animation:fade .8s .3s both}
.menorah .cup{fill:var(--second)}
.menorah .flame{fill:var(--flame); transform-box:fill-box; transform-origin:50% 100%; opacity:0;
  animation: ignite .5s var(--ease) forwards, flicker 2.4s ease-in-out infinite alternate}
.menorah .glow{fill:var(--flame); opacity:0; filter:blur(10px); animation: glow .8s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ignite{from{opacity:0; transform:scale(.2)} to{opacity:1; transform:scale(1)}}
@keyframes flicker{0%{transform:scale(1) skewX(0)} 50%{transform:scale(1.05,.95) skewX(2deg)} 100%{transform:scale(.96,1.06) skewX(-2deg)}}
@keyframes glow{to{opacity:.35}}

.books{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:16px 0 40px}
.book{position:relative; display:flex; flex-direction:column; gap:10px; text-decoration:none; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; overflow:hidden; min-height:300px;
  transition: transform .35s var(--ease), border-color .3s}
.book:hover{transform:translateY(-4px); border-color:var(--accent)}
.book .stripe{position:absolute; inset:0 0 auto 0; height:10px; background:
  linear-gradient(90deg, var(--bk) 0 30%, transparent 30% 34%, var(--bk) 34% 38%, transparent 38% 62%, var(--bk) 62% 66%, transparent 66% 70%, var(--bk) 70%)}
.book .glyph{width:56px; height:56px; border-radius:16px; display:grid; place-items:center; background:color-mix(in srgb, var(--bk) 16%, transparent); color:var(--bk)}
.book h3{font-size:1.45rem; margin-top:6px}
.book p{color:var(--muted); margin:0}
.book .meta{margin-top:auto; display:flex; align-items:center; gap:12px; font-size:.85rem; color:var(--muted)}
.ring{--p:0; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:.7rem; font-weight:700; color:var(--ink);
  background: radial-gradient(closest-side, var(--surface) 76%, transparent 78% 100%), conic-gradient(var(--bk, var(--accent)) calc(var(--p)*1%), var(--surface-2) 0)}

.tools{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding-bottom:56px}
.tool{background:var(--surface-2); border-radius:var(--radius-md); padding:18px; text-decoration:none; color:var(--ink); border:1px solid transparent}
.tool:hover{border-color:var(--accent)}
.tool svg{width:28px; height:28px; color:var(--accent)}
.tool b{display:block; margin:8px 0 4px}
.tool span{color:var(--muted); font-size:.9rem}
.sectionhead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:12px}
.sectionhead h2{font-size:1.5rem}

@media (max-width:900px){ .hero{grid-template-columns:1fr; padding-top:28px} .menorah{max-width:300px; order:-1} .books{grid-template-columns:1fr} .tools{grid-template-columns:1fr 1fr} }

/* ---------- Book page ---------- */
.bookhead{padding:36px 0 18px; display:grid; gap:10px}
.crumbs{font-size:.85rem; color:var(--muted)}
.crumbs a{color:var(--muted)}
.bookhead h1{font-size:clamp(2rem,4.6vw,3.2rem)}
.bookhead .lead{color:var(--muted); font-size:1.1rem; max-width:44em}
.tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin:10px 0 22px; overflow-x:auto}
.tabs button{border:0; background:transparent; padding:10px 14px; font-weight:700; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink); border-color:var(--accent)}
.chapters{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px; padding-bottom:48px}
.chap{display:grid; grid-template-columns:auto 1fr; gap:14px; text-decoration:none; color:var(--ink); padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); transition: border-color .25s, transform .25s var(--ease)}
.chap:hover{border-color:var(--accent); transform:translateX(3px)}
.chap .n{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:700; background:var(--surface-2); color:var(--accent)}
.chap.done .n{background:var(--accent); color:var(--accent-ink)}
.chap h3{font-size:1.05rem; margin:0 0 4px}
.chap p{margin:0; color:var(--muted); font-size:.9rem}

/* mind map skeleton */
.mindmap{overflow-x:auto; padding:8px 0 48px}
.mm{display:flex; align-items:center; gap:0; min-width:max-content}
.mm-root{background:var(--accent); color:var(--accent-ink); font-weight:700; padding:14px 18px; border-radius:var(--radius-md); max-width:220px}
.mm-branches{display:flex; flex-direction:column; gap:10px; padding-left:36px; position:relative}
.mm-branches::before{content:""; position:absolute; left:0; top:50%; width:36px; height:2px; background:var(--line)}
.mm-branch{position:relative; display:flex; align-items:center; gap:18px}
.mm-branch::before{content:""; position:absolute; left:-18px; top:50%; width:18px; height:2px; background:var(--line)}
.mm-branches > .rail{position:absolute; left:18px; top:22px; bottom:22px; width:2px; background:var(--line)}
.mm-node{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:8px 12px; font-weight:700; font-size:.9rem; text-decoration:none; color:var(--ink); min-width:220px; max-width:260px}
.mm-leaves{display:flex; flex-wrap:wrap; gap:6px; max-width:520px}
.mm-leaf{font-size:.78rem; padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--muted)}
.mm-anim .mm-branch{opacity:0; transform:translateX(-8px); animation: slidein .45s var(--ease) forwards}
@keyframes slidein{to{opacity:1; transform:none}}

/* ---------- Reader ---------- */
.reader{display:grid; grid-template-columns:260px minmax(0,1fr); gap:36px; padding-top:28px; padding-bottom:60px}
.toc{position:sticky; top:74px; align-self:start; max-height:calc(100vh - 90px); overflow:auto; font-size:.9rem; padding-right:6px}
.toc h4{font-size:.85rem; color:var(--muted); margin:0 0 8px; font-weight:600}
.toc a{display:block; padding:6px 10px; border-radius:8px; color:var(--muted); text-decoration:none; border-left:2px solid transparent}
.toc a.on{color:var(--ink); border-left-color:var(--accent); background:var(--surface-2)}
.toc .chlist a{font-size:.85rem}
.toc details{margin-top:16px}
.toc summary{cursor:pointer; font-weight:700; color:var(--muted); font-size:.85rem}
article.chapter{max-width:760px}
article.chapter h1{font-size:clamp(1.8rem,4vw,2.6rem)}
article.chapter .summary{font-size:1.12rem; color:var(--muted); border-left:4px solid var(--second); padding-left:16px; margin:14px 0 26px}
article.chapter h2{font-size:1.45rem; margin-top:44px; scroll-margin-top:80px; display:flex; gap:12px; align-items:center}
article.chapter h2 .hn{flex:none; width:32px; height:32px; border-radius:10px; display:grid; place-items:center; font-size:.85rem; background:var(--surface-2); color:var(--accent)}
article.chapter h3{font-size:1.1rem; margin-top:24px}
article.chapter ul{padding-left:1.2em}
article.chapter li{margin-bottom:.35em}
.chapnav{display:flex; justify-content:space-between; gap:12px; margin-top:48px; flex-wrap:wrap}
.chapnav a{flex:1; min-width:200px; padding:16px; border:1px solid var(--line); border-radius:var(--radius-md); text-decoration:none; color:var(--ink); background:var(--surface)}
.chapnav a small{display:block; color:var(--muted)}
.chapnav a.next{text-align:right}
.tocbtn{display:none}
@media (max-width:900px){
  .reader{grid-template-columns:1fr; gap:0}
  .toc{position:fixed; inset:0 30% 0 0; top:0; max-height:none; z-index:70; background:var(--surface); padding:20px; transform:translateX(-105%); transition:transform .35s var(--ease); box-shadow:var(--shadow)}
  .toc.open{transform:none}
  .tocbtn{display:inline-flex; position:fixed; left:16px; bottom:16px; z-index:65; box-shadow:var(--shadow)}
}

/* skeleton loading */
.skel{display:grid; gap:14px; max-width:760px; padding:28px 0}
.skel i{display:block; height:16px; border-radius:8px; background:linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%); background-size:200% 100%; animation: shimmer 1.1s linear infinite}
.skel i.h{height:34px; width:60%}
.skel i.box{height:160px; border-radius:16px}
@keyframes shimmer{from{background-position:200% 0} to{background-position:-200% 0}}

/* ---------- Content blocks ---------- */
.blk{margin:22px 0}
.blk-title{font-weight:700; font-size:.95rem; color:var(--muted); margin-bottom:10px; display:flex; align-items:center; gap:8px}
.blk-title svg{width:18px; height:18px; color:var(--accent)}
.reveal{opacity:0; transform:translateY(14px); transition: opacity .6s var(--ease), transform .6s var(--ease)}
.reveal.in{opacity:1; transform:none}

.callout{padding:16px 18px; border-radius:var(--radius-md); background:color-mix(in srgb, var(--accent) 9%, var(--surface)); border:1px solid color-mix(in srgb, var(--accent) 25%, transparent); display:grid; grid-template-columns:auto 1fr; gap:12px}
.callout.note{background:color-mix(in srgb, var(--second) 12%, var(--surface)); border-color:color-mix(in srgb, var(--second) 35%, transparent)}
.callout.warn{background:color-mix(in srgb, var(--third) 12%, var(--surface)); border-color:color-mix(in srgb, var(--third) 35%, transparent)}
.callout svg{width:22px; height:22px; color:var(--accent); margin-top:2px}
.callout p:last-child{margin:0}
.quote{margin:0; padding:18px 22px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--line); position:relative; font-size:1.05rem}
.quote::before{content:"\201C"; position:absolute; top:-18px; left:12px; font-size:4rem; color:var(--second); line-height:1}
.quote cite{display:block; margin-top:8px; font-style:normal; font-weight:700; color:var(--accent); font-size:.9rem}
.term{display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center; padding:14px 18px; border-radius:var(--radius-md); background:var(--surface-2)}
.term .w{font-size:1.4rem; font-weight:700; color:var(--accent)}
.term .heb{display:block; font-size:1rem; color:var(--muted); font-weight:600; direction:rtl; text-align:left}
.term .m{margin:0}
.term small{color:var(--muted)}

/* flow (horizontal flowchart) */
.flow{display:flex; flex-wrap:wrap; align-items:stretch; gap:0}
.flow .node{flex:1 1 140px; background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:12px; padding:12px 14px; font-weight:600; font-size:.92rem; position:relative}
.flow .node small{display:block; font-weight:400; color:var(--muted); margin-top:4px}
.flow .arrow{flex:0 0 34px; display:grid; place-items:center; color:var(--accent)}
.flow .arrow svg{width:26px; height:26px}
.flow .arrow path{stroke-dasharray:40; stroke-dashoffset:40}
.in .flow .arrow path{animation: draw .6s var(--ease) forwards}
@media (max-width:640px){ .flow{flex-direction:column} .flow .arrow{flex-basis:30px; transform:rotate(90deg)} .flow .node{flex-basis:auto} }

/* steps (vertical flowchart) */
.steps{position:relative; display:grid; gap:14px; padding-left:46px}
.steps::before{content:""; position:absolute; left:17px; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--line)}
.steps .fill{position:absolute; left:17px; top:8px; width:3px; border-radius:3px; background:var(--accent); height:0; transition:height 1.4s var(--ease)}
.in .steps .fill{height:calc(100% - 16px)}
.step{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px}
.step .dot{position:absolute; left:-46px; top:10px; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:.85rem; box-shadow:0 0 0 5px var(--bg)}
.step b{display:block}
.step p{margin:4px 0 0; color:var(--muted); font-size:.95rem}

/* compare */
.compare{display:grid; grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); gap:12px}
.compare .col{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.compare .col h4{margin:0; padding:10px 14px; background:var(--accent); color:var(--accent-ink); font-size:.95rem}
.compare .col:nth-child(2) h4{background:var(--second); color:#1b1b1b}
.compare .col:nth-child(3) h4{background:var(--third); color:#fff}
.compare ul{margin:0; padding:12px 14px 12px 30px; font-size:.93rem}

/* timeline */
.timeline{position:relative; display:grid; gap:18px; padding-left:22px; border-left:3px solid var(--line); margin-left:8px}
.tl{position:relative}
.tl::before{content:""; position:absolute; left:-31px; top:6px; width:15px; height:15px; border-radius:50%; background:var(--surface); border:3px solid var(--second)}
.tl .when{font-size:.8rem; font-weight:700; color:var(--second)}
.tl b{display:block}
.tl p{margin:2px 0 0; color:var(--muted); font-size:.95rem}

/* cards grid */
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.card b{display:block; margin-bottom:4px; color:var(--accent)}
.card p{margin:0; font-size:.93rem; color:var(--muted)}

/* cycle (circular diagram) */
.cycle{position:relative; width:min(100%, 520px); aspect-ratio:1; margin:0 auto}
.cycle svg.ring-svg{position:absolute; inset:0; width:100%; height:100%}
.cycle .ring-path{fill:none; stroke:var(--accent); opacity:.35; stroke-width:.6; stroke-dasharray:2 2.5}
.in .cycle .ring-path{animation: spin 40s linear infinite; transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.cycle .cnode{position:absolute; transform:translate(-50%,-50%); width:26%; text-align:center; background:var(--surface); border:2px solid var(--accent); border-radius:14px; padding:8px; font-size:.8rem; font-weight:700; cursor:pointer; transition: transform .3s var(--ease), background .3s}
.cycle .cnode:hover, .cycle .cnode[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); transform:translate(-50%,-50%) scale(1.06)}
.cycle .center{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:42%; text-align:center; font-size:.85rem; color:var(--muted)}
.cycle .center b{display:block; color:var(--ink); font-size:1rem; margin-bottom:4px}
@media (max-width:520px){ .cycle .cnode{font-size:.68rem; padding:5px; width:30%} .cycle .center{font-size:.72rem} }

/* tree (skeleton / mind map in-chapter) */
.tree{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px}
.tree .troot{display:inline-block; font-weight:700; background:var(--accent); color:var(--accent-ink); padding:8px 14px; border-radius:10px}
.tree ul{list-style:none; margin:0; padding-left:22px; position:relative}
.tree li{position:relative; padding:8px 0 0 18px; margin:0}
.tree li::before{content:""; position:absolute; left:0; top:0; height:100%; border-left:2px solid var(--line)}
.tree li:last-child::before{height:22px}
.tree li::after{content:""; position:absolute; left:0; top:22px; width:14px; border-top:2px solid var(--line)}
.tree .tn{display:inline-block; padding:5px 12px; border-radius:8px; background:var(--surface-2); font-weight:600; font-size:.92rem}
.tree .tn small{display:block; font-weight:400; color:var(--muted); font-size:.82rem}

/* table */
.tbl{overflow-x:auto; border:1px solid var(--line); border-radius:12px}
.tbl table{border-collapse:collapse; width:100%; font-size:.92rem; background:var(--surface)}
.tbl th{background:var(--surface-2); text-align:left; padding:10px 12px}
.tbl td{padding:10px 12px; border-top:1px solid var(--line); vertical-align:top}

/* flip cards */
.flips{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:12px}
.flip{display:block; width:100%; color:inherit; perspective:900px; min-height:150px; border:0; background:none; padding:0; text-align:left}
.flip .inner{display:block; position:relative; width:100%; height:100%; min-height:150px; transition: transform .6s var(--ease); transform-style:preserve-3d}
.flip[aria-pressed="true"] .inner{transform:rotateY(180deg)}
.flip .face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:14px; padding:16px; display:flex; flex-direction:column; justify-content:center}
.flip .front{background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:1.02rem}
.flip .front small{font-weight:500; opacity:.8; margin-top:8px; font-size:.75rem}
.flip .back{background:var(--surface); border:1px solid var(--line); transform:rotateY(180deg); font-size:.9rem; overflow:auto}

/* key points */
.keypoints{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px 22px; margin-top:40px}
.keypoints h2{margin-top:0!important}
.keypoints ol{margin:0; padding-left:1.3em}
.keypoints li{margin-bottom:.5em}

/* quiz */
.quiz{margin-top:28px; background:var(--surface-2); border-radius:var(--radius-lg); padding:20px 22px}
.quiz h2{margin-top:0!important}
.q{margin:18px 0}
.q > b{display:block; margin-bottom:8px}
.opts{display:grid; gap:8px}
.opt{text-align:left; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:500}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:#2E8B57; background:color-mix(in srgb, #2E8B57 16%, var(--surface))}
.opt.wrong{border-color:#C0392B; background:color-mix(in srgb, #C0392B 14%, var(--surface)); animation: shake .35s}
.why{margin-top:8px; font-size:.92rem; color:var(--muted); animation: fade .3s}
.score{font-weight:700; color:var(--accent)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* glossary page */
.gloss{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px; padding-bottom:48px}
.gloss .term{grid-template-columns:1fr}
.letters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.letters button{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:4px 10px; font-weight:700}
.letters button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

footer{border-top:1px solid var(--line); padding:24px 16px 80px; color:var(--muted); font-size:.85rem; text-align:center}

.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(120px); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:999px; font-weight:600; z-index:90; opacity:0; pointer-events:none; transition: transform .4s var(--ease), opacity .3s}
.toast.show{transform:translateX(-50%); opacity:1}
.page-enter{animation: pagein .45s var(--ease)}
@keyframes pagein{from{opacity:0; transform:translateY(10px)}}

@media print{ .bar,.toc,.tocbtn,.chapnav,.quiz,footer{display:none} .reader{display:block} .reveal{opacity:1; transform:none} }

  q = q.trim(); var r = $("#results");
  if (q.length < 2){ r.innerHTML = '<p style="color:var(--muted);font-size:.9rem;margin:6px 4px">Type at least two letters.</p>'; return; }
  var ql = q.toLowerCase(), hits = [];
  INDEX.forEach(function(it){
    var i = it.text.toLowerCase().indexOf(ql); if (i < 0) return;
    var s = Math.max(0, i-60), snip = it.text.slice(s, i+q.length+80);
    hits.push('<a href="#/'+it.b.id+'/'+it.c.id+'"><b>'+esc(it.c.title)+'</b><small>'+esc(it.b.short)+'</small><small>…'+esc(snip).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"), function(m){return "<mark>"+m+"</mark>";})+'…</small></a>');
  });
  r.innerHTML = hits.length ? hits.slice(0,30).join("") : '<p style="color:var(--muted);font-size:.9rem;margin:6px 4px">No chapter mentions “'+esc(q)+'”. Try a shorter word.</p>';
}

/* ---------- block renderers ---------- */
function title(k, icon){ return k.title ? '<div class="blk-title">'+(icon||I.diagram)+md(k.title)+'</div>' : ""; }
var R = {
  p: function(k){ return '<p>'+md(k.text)+'</p>'; },
  list: function(k){ return title(k, I.bulb)+'<ul>'+k.items.map(function(i){ return '<li>'+md(i)+'</li>'; }).join("")+'</ul>'; },
  callout: function(k){ var kind = k.kind || "insight"; return '<div class="callout '+kind+'">'+(kind==="insight"?I.bulb:I.note)+'<div>'+(k.title?'<b>'+md(k.title)+'</b>':"")+'<p>'+md(k.text)+'</p></div></div>'; },
  quote: function(k){ return '<blockquote class="quote">'+md(k.text)+(k.ref?'<cite>'+esc(k.ref)+'</cite>':"")+'</blockquote>'; },
  term: function(k){ return '<div class="term"><div><span class="w">'+esc(k.word)+'</span>'+(k.heb?'<span class="heb">'+esc(k.heb)+'</span>':"")+'</div><div><p class="m">'+md(k.meaning)+'</p>'+(k.lang?'<small>'+esc(k.lang)+'</small>':"")+'</div></div>'; },
  flow: function(k){
    return title(k)+'<div class="flow">'+k.nodes.map(function(n, i){
      var h = typeof n === "string" ? md(n) : md(n.h) + (n.d ? '<small>'+md(n.d)+'</small>' : "");
      return (i ? '<div class="arrow" aria-hidden="true">'+I.arrow+'</div>' : "") + '<div class="node">'+h+'</div>';
    }).join("")+'</div>';
  },
  steps: function(k){ return title(k)+'<div class="steps"><div class="fill"></div>'+k.items.map(function(s, i){ return '<div class="step"><span class="dot">'+(i+1)+'</span><b>'+md(s.h)+'</b>'+(s.d?'<p>'+md(s.d)+'</p>':"")+'</div>'; }).join("")+'</div>'; },
  compare: function(k){ return title(k)+'<div class="compare" style="--cols:'+k.cols.length+'">'+k.cols.map(function(c){ return '<div class="col"><h4>'+md(c.h)+'</h4><ul>'+c.items.map(function(i){return '<li>'+md(i)+'</li>';}).join("")+'</ul></div>'; }).join("")+'</div>'; },
  timeline: function(k){ return title(k)+'<div class="timeline">'+k.items.map(function(t){ return '<div class="tl">'+(t.when?'<span class="when">'+esc(t.when)+'</span>':"")+'<b>'+md(t.h)+'</b>'+(t.d?'<p>'+md(t.d)+'</p>':"")+'</div>'; }).join("")+'</div>'; },
  cards: function(k){ return title(k)+'<div class="cards">'+k.items.map(function(c){ return '<div class="card"><b>'+md(c.h)+'</b><p>'+md(c.d||"")+'</p></div>'; }).join("")+'</div>'; },
  table: function(k){ return title(k)+'<div class="tbl"><table><thead><tr>'+k.head.map(function(h){return '<th>'+md(h)+'</th>';}).join("")+'</tr></thead><tbody>'+k.rows.map(function(r){ return '<tr>'+r.map(function(c){return '<td>'+md(c)+'</td>';}).join("")+'</tr>'; }).join("")+'</tbody></table></div>'; },
  flip: function(k){ return title(k, I.quiz)+'<div class="flips">'+k.items.map(function(f){ return '<button class="flip" aria-pressed="false"><span class="inner"><span class="face front">'+md(f.front)+'<small>Tap to reveal</small></span><span class="face back">'+md(f.back)+'</span></span></button>'; }).join("")+'</div>'; },
  tree: function(k){
    function kids(arr){ return arr && arr.length ? '<ul>'+arr.map(function(n){ if (typeof n === "string") n = {h:n}; return '<li><span class="tn">'+md(n.h)+(n.d?'<small>'+md(n.d)+'</small>':"")+'</span>'+kids(n.children)+'</li>'; }).join("")+'</ul>' : ""; }
    return title(k, I.map)+'<div class="tree"><span class="troot">'+md(k.root)+'</span>'+kids(k.children)+'</div>';
  },
  cycle: function(k){
    var n = k.items.length, uid = "cy"+Math.random().toString(36).slice(2,7);
    var nodes = k.items.map(function(it, i){
      var a = -Math.PI/2 + i*2*Math.PI/n, x = 50 + 35*Math.cos(a), y = 50 + 36*Math.sin(a);
      return '<button class="cnode" style="left:'+x.toFixed(2)+'%;top:'+y.toFixed(2)+'%" data-i="'+i+'" aria-pressed="false">'+md(it.h)+'</button>';
    }).join("");
    return title(k)+'<div class="cycle" id="'+uid+'" data-items="'+esc(JSON.stringify(k.items))+'"><svg class="ring-svg" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-path" cx="50" cy="50" r="35.5"/></svg>'+nodes+'<div class="center"><b>'+md(k.center||"Tap a circle")+'</b><span>'+md(k.hint||"Each one opens its meaning here.")+'</span></div></div>';
  }
};
function renderBlock(k){
  var f = R[k.t]; if (!f) return "";
  var cls = k.t === "p" ? "" : " reveal";
  return k.t === "p" ? f(k) : '<div class="blk'+cls+'">'+f(k)+'</div>';
}

/* ---------- interactions inside content ---------- */
var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
  es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
}, {rootMargin:"0px 0px -8% 0px"}) : null;
function wire(root){
  $$(".reveal", root).forEach(function(el){ if (io) io.observe(el); else el.classList.add("in"); });
  $$(".flip", root).forEach(function(b){ b.onclick = function(){ b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); }; });
  $$(".cycle", root).forEach(function(c){
    var items = JSON.parse(c.dataset.items), center = $(".center", c);
    c.addEventListener("click", function(e){
      var b = e.target.closest(".cnode"); if (!b) return;
      $$(".cnode", c).forEach(function(x){ x.setAttribute("aria-pressed", x === b); });
      var it = items[+b.dataset.i];
      center.innerHTML = '<b>'+md(it.h)+'</b><span>'+md(it.d||"")+'</span>';
      center.animate && center.animate([{opacity:0, transform:"translate(-50%,-46%)"},{opacity:1, transform:"translate(-50%,-50%)"}], {duration:350, easing:"ease-out"});
    });
  });
}

/* ---------- views ---------- */
function menorahSVG(){
  var xs = [40, 80, 120, 160, 200, 240, 280], out = "";
  // arms
  [[1,5],[2,4],[3,3]].forEach(function(p, i){
    var l = xs[p[0]-1], r = xs[7-p[0]], depth = 150 - i*45;
    out += '<path class="stem" style="animation-delay:'+(.2+i*.15)+'s" d="M'+l+' 110 v20 a'+((160-l))+' '+depth*0.6+' 0 0 0 '+(r-l)+' 0 v-20"/>';
  });
  out += '<path class="stem" d="M160 110 v200"/>';
  out += '<path class="base" d="M110 330 h100 l-14 -20 h-72 z" />';
  xs.forEach(function(x, i){
    var d = 1.2 + Math.abs(i-3)*.18;
    out += '<ellipse class="glow" cx="'+x+'" cy="86" rx="16" ry="20" style="animation-delay:'+d+'s"/>';
    out += '<rect class="cup" x="'+(x-11)+'" y="100" width="22" height="10" rx="3"/>';
    out += '<path class="flame" style="animation-delay:'+d+'s, '+(d+.5)+'s" d="M'+x+' 64 C '+(x+12)+' 80 '+(x+10)+' 96 '+x+' 98 C '+(x-10)+' 96 '+(x-12)+' 80 '+x+' 64 Z"/>';
  });
  return '<svg class="menorah" viewBox="0 0 320 350" role="img" aria-label="A seven-branched lampstand lighting up">'+out+'</svg>';
}

function viewHome(){
  var total = 0; BOOKS.forEach(function(b){ total += b.chapters.length; });
  var h = '<section class="wrap hero">'+
    '<div><h1>Read the Bible with first-century Jewish eyes.</h1>'+
    '<p class="lead">Three studies in one place: how Jesus taught as a Jewish rabbi, what Israel’s feasts reveal about him, and how the book of Revelation reads to someone steeped in the Hebrew Scriptures. '+total+' chapters, each with diagrams, flashcards and a short quiz.</p>'+
    '<div class="cta"><a class="btn" href="#/'+(BOOKS[0]?BOOKS[0].id:"")+'">Start reading</a><a class="btn ghost" href="#/glossary">Browse the glossary</a></div></div>'+
    menorahSVG()+'</section>'+
    '<section class="wrap"><div class="sectionhead"><h2>Choose a study</h2></div><div class="books">'+
    BOOKS.map(function(b){
      var p = bookPct(b);
      return '<a class="book" href="#/'+b.id+'" style="--bk:'+b.color+'"><span class="stripe"></span>'+
        '<span class="glyph">'+(BOOK_ICON[b.icon]||I.book)+'</span><h3>'+esc(b.title)+'</h3><p>'+md(b.tagline)+'</p>'+
        '<div class="meta"><span class="ring" style="--p:'+p+'">'+p+'%</span><span>'+b.chapters.length+' chapters</span></div></a>';
    }).join("")+'</div>'+
    '<div class="sectionhead"><h2>Study tools</h2></div><div class="tools">'+
      '<a class="tool" href="#/glossary">'+I.book+'<b>Glossary</b><span>Every Hebrew and Greek word explained in plain English.</span></a>'+
      '<a class="tool" href="#/maps">'+I.map+'<b>Big-picture maps</b><span>The skeleton of each study on one screen.</span></a>'+
      '<a class="tool" href="#/cards">'+I.quiz+'<b>Flashcards</b><span>Flip cards from every chapter to test your memory.</span></a>'+
      '<a class="tool" href="#/'+(BOOKS[1]?BOOKS[1].id:"")+'">'+I.calendar+'<b>Feast calendar</b><span>The yearly cycle of Israel’s appointed times.</span></a>'+
    '</div></section>';
  return h;
}

function mindmap(b, animate){
  return '<div class="mindmap"><div class="mm'+(animate?' mm-anim':'')+'"><div class="mm-root">'+esc(b.title)+'</div><div class="mm-branches"><span class="rail"></span>'+
    b.chapters.map(function(c, i){
      return '<div class="mm-branch" style="animation-delay:'+(i*0.06)+'s"><a class="mm-node" href="#/'+b.id+'/'+c.id+'">'+esc(c.title)+'</a><div class="mm-leaves">'+
        (c.sections||[]).map(function(s){ return '<span class="mm-leaf">'+esc(plain(s.h))+'</span>'; }).join("")+'</div></div>';
    }).join("")+'</div></div></div>';
}

function viewBook(b, tab){
  tab = tab || "chapters";
  var d = done();
  var h = '<section class="wrap bookhead" style="--bk:'+b.color+'"><div class="crumbs"><a href="#/">Home</a> / '+esc(b.short)+'</div>'+
    '<h1>'+esc(b.title)+'</h1><p class="lead">'+md(b.intro || b.tagline)+'</p></section>'+
    '<section class="wrap"><div class="tabs" role="tablist">'+
      [["chapters","Chapters"],["map","Big-picture map"],["overview","Overview"]].map(function(t){ return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===tab)+'">'+t[1]+'</button>'; }).join("")+
    '</div><div id="tabbody">';
  if (tab === "chapters"){
    h += '<div class="chapters">'+b.chapters.map(function(c, i){
      return '<a class="chap'+(d[b.id+"/"+c.id]?" done":"")+'" href="#/'+b.id+'/'+c.id+'"><span class="n">'+(i+1)+'</span><span><h3>'+esc(c.title)+'</h3><p>'+md(c.summary)+'</p></span></a>';
    }).join("")+'</div>';
  } else if (tab === "map"){
    h += mindmap(b, true);
  } else {
    h += '<article class="chapter" style="padding-bottom:48px">'+(b.overview||[]).map(renderBlock).join("")+'</article>';
  }
  h += '</div></section>';
  return h;
}

function viewChapter(b, c){
  var idx = b.chapters.indexOf(c), prev = b.chapters[idx-1], next = b.chapters[idx+1];
  var secs = c.sections || [];
  var toc = '<nav class="toc" id="toc" aria-label="In this chapter"><h4>In this chapter</h4>'+
    secs.map(function(s, i){ return '<a href="#/'+b.id+'/'+c.id+'/'+slug(s.h)+'" data-sec="'+slug(s.h)+'">'+esc(plain(s.h))+'</a>'; }).join("")+
    (c.keypoints?'<a href="#/'+b.id+'/'+c.id+'/key-points" data-sec="key-points">Key points</a>':"")+
    (c.quiz?'<a href="#/'+b.id+'/'+c.id+'/quiz" data-sec="quiz">Quiz</a>':"")+
    '<details><summary>All chapters</summary><div class="chlist">'+b.chapters.map(function(x, i){ return '<a href="#/'+b.id+'/'+x.id+'"'+(x===c?' class="on"':'')+'>'+(i+1)+'. '+esc(x.title)+'</a>'; }).join("")+'</div></details></nav>';
  var art = '<article class="chapter"><div class="crumbs"><a href="#/">Home</a> / <a href="#/'+b.id+'">'+esc(b.short)+'</a> / Chapter '+(idx+1)+'</div>'+
    '<h1>'+esc(c.title)+'</h1><p class="summary">'+md(c.summary)+'</p>';
  secs.forEach(function(s, i){
    art += '<h2 id="'+slug(s.h)+'"><span class="hn">'+(i+1)+'</span>'+md(s.h)+'</h2>' + (s.blocks||[]).map(renderBlock).join("");
  });
  if (c.keypoints) art += '<section class="keypoints reveal"><h2 id="key-points">Key points to remember</h2><ol>'+c.keypoints.map(function(k){ return '<li>'+md(k)+'</li>'; }).join("")+'</ol></section>';
  if (c.quiz) art += '<section class="quiz"><h2 id="quiz">Check your understanding</h2>'+c.quiz.map(function(q, qi){
      return '<div class="q" data-a="'+q.answer+'"><b>'+(qi+1)+'. '+md(q.q)+'</b><div class="opts">'+q.options.map(function(o, oi){ return '<button class="opt" data-i="'+oi+'">'+md(o)+'</button>'; }).join("")+'</div><div class="why" hidden>'+md(q.why||"")+'</div></div>';
    }).join("")+'<p class="score" id="score"></p></section>';
  art += '<div class="chapnav">'+(prev?'<a href="#/'+b.id+'/'+prev.id+'"><small>Previous</small>'+esc(prev.title)+'</a>':'<span></span>')+
    (next?'<a class="next" href="#/'+b.id+'/'+next.id+'"><small>Next</small>'+esc(next.title)+'</a>':'<a class="next" href="#/'+b.id+'"><small>Finished</small>Back to the chapter list</a>')+'</div></article>';
  return '<div class="wrap reader">'+toc+art+'</div><button class="iconbtn tocbtn" id="tocbtn">'+I.menu+' Contents</button>';
}

function allTerms(){
  var seen = {}, list = [];
  BOOKS.forEach(function(b){ b.chapters.forEach(function(c){ (c.sections||[]).forEach(function(s){ (s.blocks||[]).forEach(function(k){
    if (k.t === "term"){ var key = k.word.toLowerCase(); if (!seen[key]){ seen[key] = 1; list.push({k:k, b:b, c:c}); } }
  }); }); }); });
  (window.EXTRA_TERMS||[]).forEach(function(k){ var key = k.word.toLowerCase(); if (!seen[key]){ seen[key]=1; list.push({k:k}); } });
  return list.sort(function(a, b){ return a.k.word.localeCompare(b.k.word); });
}
function viewGlossary(letter){
  var list = allTerms();
  var letters = []; list.forEach(function(t){ var L = t.k.word[0].toUpperCase(); if (letters.indexOf(L) < 0) letters.push(L); });
  var shown = letter ? list.filter(function(t){ return t.k.word[0].toUpperCase() === letter; }) : list;
  return '<section class="wrap bookhead"><div class="crumbs"><a href="#/">Home</a> / Glossary</div><h1>Glossary</h1><p class="lead">'+list.length+' words from the three studies, with what they mean and where they appear.</p></section>'+
    '<section class="wrap"><div class="letters"><button data-l="" aria-pressed="'+(!letter)+'">All</button>'+letters.map(function(L){ return '<button data-l="'+L+'" aria-pressed="'+(L===letter)+'">'+L+'</button>'; }).join("")+'</div>'+
    '<div class="gloss">'+shown.map(function(t){
      return '<div class="term"><div><span class="w">'+esc(t.k.word)+'</span>'+(t.k.heb?'<span class="heb">'+esc(t.k.heb)+'</span>':"")+'</div><div><p class="m">'+md(t.k.meaning)+'</p>'+(t.c?'<small><a href="#/'+t.b.id+'/'+t.c.id+'">'+esc(t.c.title)+'</a></small>':"")+'</div></div>';
    }).join("")+'</div></section>';
}
function viewMaps(){
  return '<section class="wrap bookhead"><div class="crumbs"><a href="#/">Home</a> / Big-picture maps</div><h1>Big-picture maps</h1><p class="lead">The skeleton of each study: every chapter and the topics inside it. Tap a chapter to open it.</p></section>'+
    '<section class="wrap">'+BOOKS.map(function(b){ return '<h2 style="margin-top:24px">'+esc(b.title)+'</h2>'+mindmap(b, true); }).join("")+'</section>';
}
function viewCards(){
  var cards = [];
  BOOKS.forEach(function(b){ b.chapters.forEach(function(c){ (c.sections||[]).forEach(function(s){ (s.blocks||[]).forEach(function(k){ if (k.t==="flip") k.items.forEach(function(f){ cards.push({f:f, b:b}); }); }); }); }); });
  for (var i = cards.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
  return '<section class="wrap bookhead"><div class="crumbs"><a href="#/">Home</a> / Flashcards</div><h1>Flashcards</h1><p class="lead">'+cards.length+' cards, shuffled each visit. Say the answer out loud, then tap to check.</p></section>'+
    '<section class="wrap" style="padding-bottom:48px"><div class="blk in">'+R.flip({items:cards.map(function(x){ return x.f; })})+'</div></section>';
}

/* ---------- router ---------- */
function find(id){ for (var i = 0; i < BOOKS.length; i++) if (BOOKS[i].id === id) return BOOKS[i]; }
var lastKey = "";
function route(){
  var parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  var key = parts.slice(0,2).join("/"), html, b, c, after = null;
  if (!parts.length) html = viewHome();
  else if (parts[0] === "glossary") html = viewGlossary(parts[1]||"");
  else if (parts[0] === "maps") html = viewMaps();
  else if (parts[0] === "cards") html = viewCards();
  else if ((b = find(parts[0]))){
    if (parts[1] && parts[1].indexOf("tab-") === 0) html = viewBook(b, parts[1].slice(4));
    else if (parts[1]){ c = b.chapters.filter(function(x){ return x.id === parts[1]; })[0]; html = c ? viewChapter(b, c) : viewBook(b); }
    else html = viewBook(b);
  } else html = viewHome();

  // same chapter, only a section anchor changed
  if (c && key === lastKey && parts[2]){ scrollToSec(parts[2]); return; }
  lastKey = key;

  var show = function(){
    app.innerHTML = html; app.classList.remove("page-enter"); void app.offsetWidth; app.classList.add("page-enter");
    wire(app); bindView(b, c);
    if (parts[2]) scrollToSec(parts[2]); else window.scrollTo(0, 0);
    document.title = (c ? c.title + " – " : b ? b.short + " – " : "") + "Roots & Branches";
  };
  if (c){
    app.innerHTML = '<div class="wrap"><div class="skel" aria-hidden="true"><i class="h"></i><i></i><i style="width:85%"></i><i class="box"></i><i></i><i style="width:70%"></i></div></div>';
    setTimeout(show, 260);
  } else show();
}
function scrollToSec(id){ var el = document.getElementById(id); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); var t = $("#toc"); if (t) t.classList.remove("open"); }

function bindView(b, c){
  $$(".tabs button").forEach(function(t){ t.onclick = function(){ location.hash = "#/"+b.id+"/tab-"+t.dataset.tab; }; });
  $$(".letters button").forEach(function(t){ t.onclick = function(){ location.hash = "#/glossary" + (t.dataset.l ? "/"+t.dataset.l : ""); }; });
  if (!c) return;
  var tb = $("#tocbtn"); if (tb) tb.onclick = function(){ $("#toc").classList.toggle("open"); };
  // quiz
  var answered = 0, right = 0, total = $$(".q").length;
  $$(".q").forEach(function(q){
    var a = +q.dataset.a;
    $$(".opt", q).forEach(function(o){ o.onclick = function(){
      $$(".opt", q).forEach(function(x){ x.disabled = true; });
      $$(".opt", q)[a].classList.add("right");
      if (+o.dataset.i !== a) o.classList.add("wrong"); else right++;
      $(".why", q).hidden = false; answered++;
      if (answered === total){
        $("#score").textContent = "You got " + right + " of " + total + " right." + (right === total ? " Chapter marked as complete." : " Review the key points and try again any time.");
        if (right === total) markDone(b.id+"/"+c.id);
      }
    }; });
  });
  // mark complete when reaching the end
  var end = $(".chapnav");
  if (end && "IntersectionObserver" in window){
    var o = new IntersectionObserver(function(es){ if (es[0].isIntersecting){ markDone(b.id+"/"+c.id); o.disconnect(); } });
    o.observe(end);
  }
  // scrollspy
  var heads = $$("article.chapter h2[id]");
  if ("IntersectionObserver" in window){
    var spy = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){
      $$(".toc a[data-sec]").forEach(function(a){ a.classList.toggle("on", a.dataset.sec === e.target.id); });
    } }); }, {rootMargin:"-10% 0px -80% 0px"});
    heads.forEach(function(h){ spy.observe(h); });
  }
}

/* ---------- boot ---------- */
PRISTINE = document.documentElement.outerHTML;
applyTheme(); shell(); buildIndex();
window.addEventListener("hashchange", route);
route();
})();

</script>
